              ? { type:"tool_result", tool_use_id:c.id, is_error:true, content:"Unknown tool." }
              : { type:"tool_result", tool_use_id:c.id, content:out };
          });
          msgs = [...msgs, { role:"assistant", content }, { role:"user", content:results }];
        }
        return { ...Ai._fail("steps", "The agent took too many steps. Try a narrower question."), usage:used };
      },
    };

    // ── Data portability: export / import a JSON backup ──────────
    // Offline, server-free way to move data between devices and to back it up.
    // Export → a downloadable (or shareable, on mobile) gtd-backup-*.json file
    // holding the live state PLUS the archive. Import → MERGE or REPLACE.
    const exportData = data => {
      const payload = JSON.stringify(data, null, 2);
      const fname   = `gtd-backup-${new Date().toISOString().slice(0,10)}.json`;
      const blob    = new Blob([payload], { type: "application/json" });
      const file    = (typeof File !== "undefined") ? new File([blob], fname, { type:"application/json" }) : null;
      // Mobile: native share sheet (AirDrop / Nearby / messaging) when it can share files.
      if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
        navigator.share({ files:[file], title:"GTD backup" }).catch(() => {});
        return;
      }
      const url = URL.createObjectURL(blob);
      const a   = document.createElement("a");
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    const placeFor = l => ({ inbox:"Capture…", next:"Next action…  (type [Project] to link one)", projects:"Project outcome…", waiting:"Waiting for…", someday:"Someday idea…", reference:"Reference title…" }[l]||"Add item…");

    const doneByTime = items => {
      const now   = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const week  = new Date(today); week.setDate(today.getDate()-6);
      const month = new Date(today); month.setDate(today.getDate()-29);
      const buckets = [
        { label:"Today",      test:d=>d>=today,             defaultOpen:true  },
        { label:"This week",  test:d=>d>=week&&d<today,     defaultOpen:true  },
        { label:"This month", test:d=>d>=month&&d<week,     defaultOpen:false },
        { label:"Older",      test:d=>d<month,              defaultOpen:false },
      ];
      return buckets
        .map(b => ({ ...b, items: items.filter(i => b.test(new Date(i.doneAt||i.created))) }))
        .filter(b => b.items.length > 0);
    };

    const doneByProject = (items, pnameOf) => {
      const map = {};
      items.forEach(i => { const p=pnameOf(i)||"Standalone"; (map[p]=map[p]||[]).push(i); });
      return Object.entries(map).map(([label,items]) => ({ label, items, defaultOpen:true }));
    };

    // ── App ───────────────────────────────────────────────────────
    // Read once at load, before the first render: the parse strips the query string,
    // so calling it from a component (which React may render twice) would lose it.
    const LAUNCH = readLaunchIntent();

    function App() {
      const [items, setItems]             = useState(null);
      const [active, setActive]           = useState(LAUNCH.view || "today");   // "chat" needs a key — see the guard below
      const [ctx, setCtx]                 = useState("all");
      const [capture, setCapture]         = useState("");
      const [showForm, setShowForm]       = useState(false);
      const [form, setForm]               = useState({title:"",context:"@anywhere",dueDate:"",dueTime:"",startDate:"",waitingFor:"",energy:"",time:""});
      const [enerF, setEnerF]             = useState("all");  // Next Actions engage filters
      const [timeF, setTimeF]             = useState("all");
      const [procItem, setProcItem]       = useState(null);
      const [complCand, setComplCand]     = useState(null);
      const [promoteCand, setPromoteCand] = useState(null);  // next action → project
      const [editCand, setEditCand]       = useState(null);  // {list, item} being edited
      const [history,  setHistory]        = useState([]);
      const [showData, setShowData]       = useState(false);
      const [navOpen,  setNavOpen]        = useState(false);  // mobile drawer
      const [updateReady, setUpdateReady] = useState(false);  // new build deployed → offer reload
      const [pipOn, setPipOn]             = useState(false);  // floating (always-on-top) Today window open
      const pipWinRef  = React.useRef(null);                  // the Document-PiP window
      const pipRootRef = React.useRef(null);                  // its own React root (separate document)
      const fileInputRef = React.useRef(null);
      const importMode   = React.useRef("merge");
      // OneDrive cloud sync (optional)
      const [odAccount, setOdAccount]     = useState(() => Drive.account());
      const [syncing,   setSyncing]       = useState(false);
      // Claude: the key lives in localStorage, not in state, so a save/clear has to
      // nudge React by hand for the AI affordances to appear or vanish without a reload.
      const [aiKeyTick, setAiKeyTick]     = useState(0);
      const [aiModel, setAiModel]         = useState(() => Ai.model());
      const [aiTest,    setAiTest]        = useState(null);   // null | "…" | {ok} | {ok:false,msg}
      const [syncTick,  setSyncTick]      = useState(0);   // bump to re-render the "last synced" label
      const [archive, setArchiveState] = useState([]);   // rotated-out old Done items (separate store)
      const itemsRef    = React.useRef(null);
      const archiveRef  = React.useRef([]);
      const lastSyncRef = React.useRef(0);
      const driveTimer  = React.useRef(null);
      const setArchive  = a => { archiveRef.current = a; setArchiveState(a); Store.saveArchive(a); };

      // ── heartbeat — when served by Flask on the PC, lets the server exit
      //    once the browser closes. Harmless (and silently ignored) offline. ──
      useEffect(() => {
        if (!HUB) return;
        const id = setInterval(() => fetch("api/ping", {method:"POST"}).catch(()=>{}), 5000);
        return () => clearInterval(id);
      }, []);

      // keep a ref of the latest items for async sync callbacks (avoids stale closures)
      useEffect(() => { itemsRef.current = items; }, [items]);

      // mirror a compact Today snapshot out to the Android home-screen widget on every
      // change (no-op in a normal browser). Self-contained so it can sit above the
      // `if (!items)` early return, where the App's own pnameOf isn't in scope yet.
      useEffect(() => {
        if (!items || !WidgetBridge.available()) return;
        const pm = projIndex(items);
        WidgetBridge.publish(items, isoDate(new Date()),
                             i => (i && i.projectId && pm.get(i.projectId)) || null);
      }, [items]);

      // a freshly deployed build took control (see the SW registration script) → prompt to reload
      useEffect(() => {
        const h = () => setUpdateReady(true);
        window.addEventListener("gtd:update-ready", h);
        return () => window.removeEventListener("gtd:update-ready", h);
      }, []);

      // process any pending MSAL redirect response once on load (no-op for popup flow).
      // If we returned from a loginRedirect fallback, finish the connection here.
      useEffect(() => {
        const m = Drive.init(); if (!m) return;
        m.handleRedirectPromise().then(res => {
          if (res && res.account) {
            m.setActiveAccount(res.account);
            try { localStorage.setItem(OD_FLAG, "1"); } catch {}
            setOdAccount(Drive.account());
            syncNow();
          }
        }).catch(() => {});
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);   // mount-only; syncNow is stable (useCallback) and only read inside .then after mount

      // ── adopt a merged state if it differs from what's on screen. The merge is
      //    re-run against the CURRENT items so edits made while a sync was in
      //    flight are never clobbered (merging is idempotent). ──
      const adopt = useCallback(merged => {
        const cur   = itemsRef.current || fresh();
        const final = mergeStates(cur, merged);
        if (!sameState(final, cur)) {
          setItems(final);
          setHistory([]);   // an older snapshot would undo this incoming change on every device
        }
        Store.saveLocal(final);
        return final;
      }, []);

      // Another tab wrote: take its changes so this tab's next save can't overwrite them.
      // Not saved back: the tabs' list orders can differ, and each save fires the other's event.
      useEffect(() => {
        const onStorage = e => {
          if (e.key !== LS_KEY || !e.newValue) return;
          let theirs = null;
          try { theirs = migrate(JSON.parse(e.newValue)); } catch {}
          if (!theirs) return;
          const cur = itemsRef.current || fresh(), final = mergeStates(cur, theirs);
          if (sameState(final, cur)) return;
          itemsRef.current = final;
          setItems(final);
          setHistory([]);
        };
        window.addEventListener("storage", onStorage);
        return () => window.removeEventListener("storage", onStorage);
      }, []);

      // ── full reconcile with every reachable remote (Flask hub + OneDrive):
      //    pull → item-level merge → adopt → push back whichever remote differs.
      //    Also rotates old Done items into the archive store and syncs it. ──
      const fullSync = useCallback(async () => {
        const cur = itemsRef.current || fresh();
        const [server, drive, sArch, dArch] = await Promise.all([
          Store.fetchServer(), Drive.pull(), Store.fetchServerArchive(), Drive.pullArchive(),
        ]);
        let merged = mergeStates(cur, server);
        if (drive && drive.data) merged = mergeStates(merged, drive.data);
        let arch = mergeArchive(mergeArchive(archiveRef.current, sArch), dArch && dArch.data);
        const rot = splitArchive(merged, arch);
        if (rot) { merged = rot.state; arch = rot.archive; }
        const final = adopt(merged);
        if (!sameState(arch, archiveRef.current) || rot) setArchive(arch);
        if (!sameState(server, final)) Store.pushServer(final);
        if (Drive.enabled() && (!drive || !sameState(drive.data, final))) {
          const res = await Drive.push(final);
          if (res.merged) adopt(res.merged);
        }
        const archOutdated = rem => !Array.isArray(rem) || rem.length !== arch.length;
        if (arch.length && archOutdated(sArch)) Store.pushServerArchive(arch);
        if (Drive.enabled() && arch.length && archOutdated(dArch && dArch.data)) Drive.pushArchive(arch);
        lastSyncRef.current = Date.now();
        setSyncTick(t => t + 1);
      }, [adopt]);
      const fullSyncRef = React.useRef(fullSync);
      useEffect(() => { fullSyncRef.current = fullSync; }, [fullSync]);

      // ── offline-first load: show local immediately (migrated to schema v2),
      //    then run a full reconcile against the optional remotes. ──
      useEffect(() => {
        const local  = Store.loadLocal() || fresh();
        const shared = LAUNCH.capture;        // PWA "share to GTD" → straight into the Inbox
        const seeded = shared ? stampChanges(local, { ...local, inbox:[mk(shared), ...local.inbox] }) : local;
        itemsRef.current = seeded; setItems(seeded); Store.saveLocal(seeded);
        archiveRef.current = Store.loadArchive(); setArchiveState(archiveRef.current);
        fullSyncRef.current();
      }, []);

      // ── poll the remotes for other devices' changes (Graph has no push; the
      //    Flask hub is plain HTTP). Cheap merge — adopts/pushes only on change. ──
      useEffect(() => {
        const id = setInterval(async () => {
          const [server, drive] = await Promise.all([
            Store.fetchServer(),
            Drive.enabled() ? Drive.pull() : Promise.resolve(null),
          ]);
          if (!server && !(drive && drive.data)) return;
          const cur = itemsRef.current || fresh();
          let merged = mergeStates(cur, server);
          if (drive && drive.data) merged = mergeStates(merged, drive.data);
          const final = adopt(merged);
          if (!sameState(final, cur)) { lastSyncRef.current = Date.now(); setSyncTick(t => t + 1); }
          if (server && !sameState(server, final)) Store.pushServer(final);
          if (drive && !sameState(drive.data, final)) {
            const res = await Drive.push(final);
            if (res.merged) adopt(res.merged);
          }
        }, 45000);
        return () => clearInterval(id);
      }, [adopt]);

      // debounced push to OneDrive so rapid edits don't spam Graph
      const drivePush = useCallback(d => {
        if (!Drive.enabled()) return;
        if (driveTimer.current) clearTimeout(driveTimer.current);
        driveTimer.current = setTimeout(() => {
          Drive.push(d).then(res => {
            if (!res.ok) return;
            if (res.merged) adopt(res.merged);
            lastSyncRef.current = Date.now(); setSyncTick(t => t + 1);
          });
        }, 2000);
      }, [adopt]);

      const persist = useCallback(d => {
        Store.saveLocal(d);
        Store.pushServer(d);
        drivePush(d);
      }, [drivePush]);

      // ── manual "Sync now" — the same full reconcile the app runs at load ──
      const syncNow = useCallback(async () => {
        setSyncing(true);
        try { await fullSync(); } finally { setSyncing(false); }
      }, [fullSync]);

      const connectDrive = useCallback(async () => {
        if (typeof msal === "undefined") {        // MSAL CDN didn't load — don't fail silently
          alert("The Microsoft sign-in library couldn't load (network or content blocker). Check your connection and reload, then try again.");
          return;
        }
        // Android wrapper: a WebView has no popup surface, so skip loginPopup entirely
        // and use the full-page redirect (the effect above finishes it on the way back).
        if (WidgetBridge.available()) {
          try { Drive.init(); Drive._msal.loginRedirect({ scopes: MS_SCOPES }); return; } catch {}
        }
        try {
          const a = await Drive.connect();
          setOdAccount(a);
          if (a) await syncNow();
          else alert("Sign-in didn't complete — the popup may have been blocked. Allow popups for this site and try again.");
        } catch (err) {
          const code = err && (err.errorCode || err.name) || "";
          if (/popup/i.test(code) || /popup/i.test(err && err.message || "")) {
            try { Drive.init(); Drive._msal.loginRedirect({ scopes: MS_SCOPES }); return; }  // fall back to full-page redirect
            catch {}
          }
          alert("Could not connect to OneDrive: " + (err && err.message ? err.message : "check your client ID / app registration / redirect URI."));
        }
      }, [syncNow]);

      const disconnectDrive = useCallback(async () => {
        await Drive.disconnect(); setOdAccount(null); setSyncTick(t => t + 1);
      }, []);

      // ── Claude ──
      // No key ⇒ every AI affordance is ABSENT (a configuration state, identical to
      // before the feature existed). Key set but offline ⇒ rendered and disabled
      // (a transient state). The two are deliberately not the same.
      const aiOn     = React.useMemo(() => Ai.enabled(), [aiKeyTick]);
      const aiOnline = Ai.online();
      const saveAiKey = useCallback(k => { Ai.setKey(k); setAiTest(null); setAiKeyTick(t => t + 1); }, []);
      const pickModel = useCallback(id => { Ai.setModel(id); setAiModel(id); }, []);
      const testAiKey = useCallback(async () => {
        setAiTest("…");
        const r = await Ai.ping();
        setAiTest(r.ok ? { ok:true } : { ok:false, msg:r.msg });
      }, []);

      // Every mutation flows through here: stampChanges gives each touched item a
      // fresh per-item _updatedAt (the merge clock) — call sites never stamp.
      const upd = useCallback(d => {
        const stamped = stampChanges(items, d);
        setHistory(h => [...h.slice(-19), items]);
        setItems(stamped);
        persist(stamped);
      }, [items, persist]);

      // Polls localStorage rather than React state so two tabs share one timer: whichever
      // tab sees the expiry saves first and the other reads the advanced phase, so a
      // session is credited once.
      const [pomo, setPomo] = useState(() => Pomo.load());
      const loaded = !!items;
      useEffect(() => {
        if (!loaded || LAUNCH.headless) return;
        const baseTitle = document.title;
        const tick = () => {
          const cur = Pomo.load(), now = Date.now();
          const { timer, credited, finished } = pomoTick(cur, now);
          if (timer !== cur) Pomo.save(timer);
          if (credited) {
            // the day it ended, not the day the page woke up to notice
            const live = itemsRef.current, next = pomoCredit(live, timer.itemId, isoDate(cur.endsAt));
            if (next !== live) {
              itemsRef.current = next;
              setItems(next);
              setHistory([]);
              persist(next);
            }
          }
          // a page waking long after the fact stays quiet: the moment to act has passed
          if (finished && now - cur.endsAt < 120000) Pomo.alert(POMO_MSG[finished]);
          setPomo(p => sameState(p, timer) ? p : timer);
          document.title = timer && timer.endsAt ? `${pomoClock(timer.endsAt-now)} ${timer.phase==="work"?"🍅":"☕"} ${baseTitle}` : baseTitle;
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => { clearInterval(id); document.title = baseTitle; };
      }, [loaded, persist]);
      const savePomo  = t => { Pomo.save(t); setPomo(t); };
      const startPomo = item => { Pomo.arm(); savePomo(pomoStart(Pomo.load(), item, Date.now())); };
      // A session is indivisible, so while one runs nothing offers to start another.
      const canStartPomo = !pomo || pomo.phase !== "work";
      // A thought that arrives mid-session goes to the Inbox and the session carries on;
      // the mark keeps visible how often the mind tried to leave.
      const captureThought = t => {
        upd({ ...items, inbox:[mk(t), ...items.inbox] });
        const cur = Pomo.load();
        if (cur && cur.phase === "work") savePomo({ ...cur, marks:(cur.marks||0)+1 });
      };
      const agent = useAgentSession(items, archive, pomo);
      const renderPomoBar = onCapture => (
        <PomoBar pomo={pomo} compact={!onCapture} onStop={()=>savePomo(null)} onCapture={onCapture}
          onSkip={()=>savePomo({ ...pomo, phase:"idle", endsAt:0 })}
          onNext={()=>startPomo({ id:pomo.itemId, title:pomo.title })}/>
      );

      // One job at a time: {kind, target, busy, error, data, refs}. Clarify, breakdown
      // and the review coach all run through here so there is one place that reads the
      // live state, one abort, and one error surface.
      const [aiJob, setAiJob] = useState(null);
      useEffect(() => { if (active === "chat" && !Ai.enabled()) setActive("today"); }, [active, aiKeyTick]);
      const aiAbort = React.useRef(null);
      const runAi = useCallback(async (kind, target) => {
        if (aiAbort.current) aiAbort.current.abort();
        const ctrl = new AbortController(); aiAbort.current = ctrl;
        setAiJob({ kind, target, busy:true, error:"", data:null, refs:{} });
        const cur = itemsRef.current || fresh(), day = isoDate(new Date());
        const r = kind === "clarify"   ? await AiTasks.clarify(cur, target, day, { ref:"c1", signal:ctrl.signal })
                : kind === "breakdown" ? await AiTasks.breakdown(cur, target, day, { signal:ctrl.signal })
                :                        await AiTasks.review(cur, target, day, { signal:ctrl.signal });
        if (ctrl.signal.aborted) return;
        setAiJob(j => j && j.kind === kind
          ? { ...j, busy:false, error: r.ok ? "" : r.msg, data: r.ok ? r.data : null, refs: r.refs || {} }
          : j);
      }, []);
      const closeAi = useCallback(() => {
        if (aiAbort.current) { aiAbort.current.abort(); aiAbort.current = null; }
        setAiJob(null);
      }, []);
      // Read itemsRef, NOT the `items` closure: an AI panel can sit open across a 45s
      // sync poll, and applying against a dead snapshot would clobber what just merged
      // in. Same reason drainWidgetOps does it. Re-running applyAiOps here also means
      // an op whose target vanished in the meantime comes back honestly skipped.
      const applyAi = useCallback((ops, refs) => {
        const cur = itemsRef.current || fresh();
        const res = applyAiOps(cur, ops, { refs: refs || {}, todayISO: isoDate(new Date()) });
        if (res.state !== cur) upd(res.state);          // ONE stamped transition — Ctrl+Z undoes it all
        return res;
      }, [upd]);
      // The preview IS the applier, run against live state — same function, same result.
      const aiPreview = React.useMemo(() => {
        if (!aiJob || !aiJob.data) return null;
        const ops = aiJob.data.ops || [];
        return { ops, results: applyAiOps(items, ops, { refs: aiJob.refs, todayISO: isoDate(new Date()) }).results };
      }, [aiJob, items]);
      // One bundle shape for all three mutating surfaces, so they render identically.
      const aiPanel = kind => {
        if (!aiOn) return null;
        const job = aiJob && aiJob.kind === kind ? aiJob : null;
        const d   = job && job.data;
        const notes = !d ? []
          : kind === "clarify"   ? [d.reasoning].filter(Boolean)
          : kind === "breakdown" ? [d.outcome && ("Outcome: " + d.outcome), d.nextAction && ("Next action: " + d.nextAction)].filter(Boolean)
          :                        [d.headline].filter(Boolean);
        return {
          online: aiOnline, active: !!job, busy: !!(job && job.busy), error: job ? job.error : "",
          data: d || null, notes,
          ops:     aiPreview ? aiPreview.ops : [],
          results: aiPreview ? aiPreview.results : [],
          onApply: chosen => {
            const ops = (aiPreview ? aiPreview.ops : []).filter((_, i) => chosen.indexOf(i) >= 0);
            applyAi(ops, job ? job.refs : {});
            closeAi();
          },
          onClose: closeAi,
        };
      };

      // ── Android widget → app: apply whatever the home screen queued ──────────
      // The whole batch goes in as ONE state transition: calling confirmComplete /
      // toggleFocus per op would race on their stale `items` closure. Stamps and sets
      // itemsRef synchronously (not via the [items] effect) because the headless run
      // below immediately hands the result to fullSync/Drive.push.
      const drainWidgetOps = useCallback(() => {
        const ops = WidgetBridge.drain();
        if (!ops.length) return null;
        const cur = itemsRef.current || fresh();
        const n = applyWidgetOps(cur, ops, ts(), isoDate(new Date()));
        if (n === cur) return null;
        const stamped = stampChanges(cur, n);
        itemsRef.current = stamped;
        setHistory(h => [...h.slice(-19), cur]);   // Ctrl+Z still undoes a widget action
        setItems(stamped);
        persist(stamped);
        return stamped;
      }, [persist]);

      // drain on load and whenever we come back to the foreground (the usual case:
      // you ticked something on the home screen, then opened the app)
      useEffect(() => {
        if (!WidgetBridge.available()) return;
        drainWidgetOps();
        const onVis = () => { if (document.visibilityState === "visible") drainWidgetOps(); };
        document.addEventListener("visibilitychange", onVis);
        return () => document.removeEventListener("visibilitychange", onVis);
      }, [drainWidgetOps]);

      // Offscreen sync run: HeadlessSyncWorker loads us with ?headless=1 right after a
      // widget action. Apply the queue, reconcile, force the OneDrive push past the 2s
      // debounce (the WebView is destroyed the moment we report ready), then release it.
      const headlessRef = React.useRef(false);
      useEffect(() => {
        if (!LAUNCH.headless || !items || headlessRef.current || !WidgetBridge.available()) return;
        headlessRef.current = true;
        (async () => {
          try {
            drainWidgetOps();
            await fullSyncRef.current();
            if (Drive.enabled()) await Drive.push(itemsRef.current);
          } catch {}
          WidgetBridge.ready();
        })();
      }, [items, drainWidgetOps]);

      const undo = useCallback(() => {
        if (history.length === 0) return;
        // stampChanges re-stamps everything the undo restores, so the revert also
        // wins the merge against remotes (including un-deleting past a tombstone).
        const prev = stampChanges(items, history[history.length - 1]);
        setHistory(h => h.slice(0, -1));
        setItems(prev);
        persist(prev);
      }, [history, items, persist]);

      useEffect(() => {
        const onKey = e => { if ((e.ctrlKey||e.metaKey) && e.key==="z" && !e.shiftKey) { e.preventDefault(); undo(); } };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [undo]);

      // ── data export / import ──
      const triggerImport = mode => { importMode.current = mode; if (fileInputRef.current) fileInputRef.current.click(); };

      const onImportFile = e => {
        const f = e.target.files && e.target.files[0];
        e.target.value = "";                                // allow picking the same file again
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          let parsed;
          try { parsed = JSON.parse(reader.result); }
          catch { alert("Could not read that file — is it a valid GTD backup (.json)?"); return; }
          if (!looksLikeState(parsed)) { alert("That doesn't look like a GTD backup file."); return; }
          const mig  = migrate(parsed);   // old v1 backups are upgraded transparently
          // Replace = restore: tombstone everything NOT in the backup, so synced
          // devices converge to the backup instead of merging old items back in.
          const next = importMode.current === "replace" ? (() => {
            const keep = new Set(); LISTS.forEach(l=>(mig[l]||[]).forEach(i=>keep.add(i.id)));
            const tombs = { ...mig.tombstones };
            LISTS.forEach(l=>(items[l]||[]).forEach(i=>{ if(!keep.has(i.id)) tombs[i.id]=Date.now(); }));
            return { ...mig, tombstones: tombs };
          })() : mergeStates(items, mig);
          if (Array.isArray(parsed.archive) && parsed.archive.length) {
            setArchive(importMode.current === "replace" ? parsed.archive : mergeArchive(archiveRef.current, parsed.archive));
          } else if (importMode.current === "replace") {
            setArchive([]);
          }
          upd(next);
          setShowData(false);
          alert(importMode.current === "replace" ? "Data replaced from backup." : "Backup merged in.");
        };
        reader.readAsText(f);
      };

      // ── actions ──
      const quickCapture = () => {
        if (!capture.trim()) return;
        captureThought(capture);
        setCapture("");
      };

      const addItem = () => {
        if (!form.title.trim()) return;
        // "[Project] action" typed into Next/Waiting links to that project by id
        const linked = (active==="next"||active==="waiting") ? linkByPrefix(form.title, items) : { title:form.title.trim(), projectId:"" };
        const item = { ...mk(linked.title), projectId:linked.projectId, context:form.context, dueDate:form.dueDate, dueTime:form.dueDate?form.dueTime:"", startDate:form.startDate, waitingFor:form.waitingFor, energy:active==="next"?form.energy:"", time:active==="next"?form.time:"" };
        upd({ ...items, [active]:[item,...items[active]] });
        setForm({title:"",context:"@anywhere",dueDate:"",dueTime:"",startDate:"",waitingFor:"",energy:"",time:""}); setShowForm(false);
      };

      const move = (from, id, to, patch={}) => {
        const item = items[from].find(i=>i.id===id); if (!item) return;
        upd({ ...items, [from]:items[from].filter(i=>i.id!==id), [to]:[{...item,...patch},...items[to]] });
        setProcItem(null);
      };

      // Permanent delete — tombstoned so the deletion propagates through merge
      // instead of the item resurrecting from another device. (Ctrl+Z still
      // undoes it: the restore is re-stamped newer than the tombstone.)
      const del = (list, id) => upd({ ...items, [list]:items[list].filter(i=>i.id!==id),
                                      tombstones:{ ...items.tombstones, [id]: Date.now() } });

      // Edit an item's own fields in place. Project↔action links are by id since
      // schema v2, so renaming a project needs no cascade — links can't go stale.
      const applyEdit = (list, item, patch) => {
        if (list==="projects") {
          upd({ ...items, projects: items.projects.map(p => p.id===item.id
            ? {...p, title:patch.title, dueDate:patch.dueDate, dueTime:patch.dueTime, startDate:patch.startDate} : p) });
          return;
        }
        // base the merge on the STORED item (not the passed one) — Today/Calendar pass a
        // view object carrying _list/_kind that must not leak into persisted state.
        upd({ ...items, [list]: items[list].map(i => i.id===item.id
          ? { ...i, title:patch.title, projectId:patch.projectId!==undefined?patch.projectId:i.projectId,
              context:patch.context, dueDate:patch.dueDate, dueTime:patch.dueTime, startDate:patch.startDate,
              waitingFor:patch.waitingFor, energy:patch.energy, time:patch.time }
          : i) });
      };

      // Star/un-star a Next Action as today's focus (ephemeral, dated — see TodayView).
      const toggleFocus = id => {
        const t = isoDate(new Date());
        upd({ ...items, next: items.next.map(i => i.id===id ? { ...i, focusDate: i.focusDate===t ? "" : t } : i) });
      };

      const handleStalledDecision = (decision, proj, extra) => {
        let n = { ...items };
        if (decision==="next" && extra) {
          const a = { ...mk(extra.title), projectId:proj.id, context:extra.context, dueDate:extra.dueDate };
          n = { ...n, next:[a,...n.next] };
        }
        if (decision==="waiting" && extra) {
          // GTD: a delegated step IS the project's next move — the project stays
          // active (and no longer counts as stalled) with a linked Waiting For.
          const w = { ...mk(extra.waitingFor), waitingFor:extra.waitingFor, projectId:proj.id };
          n = { ...n, waiting:[w,...n.waiting] };
        }
        if (decision==="someday")
          n = { ...n, projects:n.projects.filter(p=>p.id!==proj.id), someday:[proj,...n.someday] };
        if (decision==="close")
          n = { ...n, projects:n.projects.filter(p=>p.id!==proj.id), done:[{...proj,doneAt:ts()},...n.done] };
        upd(n);
      };

      const confirmComplete = (list, id, decision, nextAct) => {
        const item = items[list].find(i=>i.id===id); if (!item) return;
        const pid = item.projectId || "";
        let n = { ...items, [list]:items[list].filter(i=>i.id!==id), done:[{...item,doneAt:ts()},...items.done] };
        if (decision==="next" && nextAct) n = { ...n, next:[nextAct,...n.next] };
        if (decision==="close" && pid) {
          const p = n.projects.find(p=>p.id===pid);
          if (p) n = { ...n, projects:n.projects.filter(x=>x.id!==pid), done:[{...p,doneAt:ts()},...n.done] };
        }
        if (decision==="waiting" && nextAct && pid) {
          const waitItem = { ...mk(nextAct.waitingFor), waitingFor:nextAct.waitingFor, projectId:pid };
          n = { ...n, waiting:[waitItem,...n.waiting] };
        }
        if (decision==="someday" && pid) {
          const p = n.projects.find(p=>p.id===pid);
          if (p) n = { ...n, projects:n.projects.filter(x=>x.id!==pid), someday:[p,...n.someday] };
          // remaining next actions of a deferred project step back too (tombstoned
          // so the removal propagates; the project keeps its outcome in Someday)
          const dropIds = n.next.filter(a=>a.projectId===pid).map(a=>a.id);
          n = { ...n, next:n.next.filter(a=>a.projectId!==pid),
                tombstones:{ ...n.tombstones, ...Object.fromEntries(dropIds.map(x=>[x, Date.now()])) } };
        }
        upd(n); setComplCand(null);
      };

      // ── Floating Today (Document Picture-in-Picture) ──────────────
      // Chromium-only: opens a real always-on-top OS window for a compact, live Today
      // glance + Inbox quick-capture while working in other apps. It runs in its OWN
      // React root (separate document — so React's event delegation actually fires
      // there); App re-renders it via the effect below whenever `items` change.
      const pipSupported = typeof window!=="undefined" && "documentPictureInPicture" in window;
      const renderChat = compact => (
        <ChatView compact={compact} agent={agent} model={aiModel} onModel={pickModel} items={items} todayISO={isoDate(new Date())} onApply={applyAi}
          onSaveContext={text=>upd({ ...itemsRef.current, agentContext:text })}/>
      );
      const renderReview = onGoto => {
        const at = items._reviewedAt || 0;
        return (
          <WeeklyReview items={items} todayISO={isoDate(new Date())} reviewedAt={at}
            daysSinceReview={at ? Math.floor((Date.now()-at)/86400000) : null}
            reviewDay={items._reviewDay==null ? 6 : items._reviewDay} onSetReviewDay={d=>upd({ ...items, _reviewDay:d })}
            onComplete={()=>upd({ ...items, _reviewedAt:Date.now() })} onGoto={onGoto}
            ai={aiOn ? { ...aiPanel("review"), onRun: facts => runAi("review", facts) } : null}/>
        );
      };
      // A reload closes the float, and only a click can reopen it, so ?float=1 lands on the one-click launcher.
      const reloadApp = () => {
        if (!pipWinRef.current) { window.location.reload(); return; }
        window.focus();
        window.location.assign("?float=1");
      };
      const closePip = () => {
        try { pipRootRef.current && pipRootRef.current.unmount(); } catch(e){}
        pipRootRef.current = null;
        const w = pipWinRef.current; pipWinRef.current = null;
        try { w && w.close(); } catch(e){}
        setPipOn(false);
      };
      const openPip = async () => {
        if (!pipSupported || pipWinRef.current) return;
        let w;
        try { w = await window.documentPictureInPicture.requestWindow({ width:380, height:280 }); }
        catch(e){ return; }   // user dismissed, or not allowed
        // PiP windows inherit no styles — clone the app's <style>/<link> so the design
        // system (.btn/.ibtn/.chip/.in, :root vars) is available inside the float.
        document.querySelectorAll('style,link[rel="stylesheet"]').forEach(n=>w.document.head.appendChild(n.cloneNode(true)));
        w.document.title = "GTD";
        Object.assign(w.document.body.style, { margin:"0", fontFamily:"'Inter',system-ui,sans-serif", background:"#f1f5f9", color:"#1e293b" });
        w.addEventListener("pagehide", closePip);   // user closed the float window
        // With the main window out of sight, using the float is the moment to look for a new build.
        w.addEventListener("focus", () => { if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
        pipWinRef.current  = w;
        pipRootRef.current = ReactDOM.createRoot(w.document.body);
        setPipOn(true);
      };
      // Keep the floating window live — re-render its root on every state change
      // (handlers below close over the current `items`).
      React.useEffect(() => {
        if (!pipOn || !pipRootRef.current || !items) return;
        const today = isoDate(new Date());
        const pm    = projIndex(items);
        pipRootRef.current.render(
          <FloatToday items={items} todayISO={today} pnameOf={i=>(i&&i.projectId&&pm.get(i.projectId))||null}
            onComplete={(list,it)=>confirmComplete(list,it.id,"later",null)}
            onToggleFocus={toggleFocus}
            canUndo={history.length>0} onUndo={undo}
            onOpen={v=>{ setActive(v); setCtx("all"); setShowForm(false); window.focus(); }}
            onCapture={captureThought}
            onStartPomo={canStartPomo ? startPomo : null} pomoBar={renderPomoBar(null)}
            updateReady={updateReady} onReload={reloadApp}
            inbox={{
              next:  (it,title) => move("inbox",it.id,"next",{ title, context:"@anywhere" }),
              start: canStartPomo ? (it,title) => { move("inbox",it.id,"next",{ title, context:"@anywhere" }); startPomo({ id:it.id, title }); } : null,
              to:    (it,list,patch) => move("inbox",it.id,list,patch),
              trash: it => del("inbox",it.id),
              more:  it => { setProcItem(it); window.focus(); },
              sort:  aiOn ? () => agent.send(AGENT_SORT_INBOX) : null,
            }}
            renderView={(v, onGoto) => v==="chat" ? renderChat(true)
              : v==="review" ? renderReview(onGoto)
              : v==="calendar" ? (
                <CalendarView compact items={items} pnameOf={i=>(i&&i.projectId&&pm.get(i.projectId))||null}
                  onComplete={(list,it)=>confirmComplete(list,it.id,"later",null)}
                  onEdit={(list,item)=>{ setEditCand({list,item}); window.focus(); }} onGoto={onGoto}/>
              ) : null}
            onClose={closePip}/>
        );
      }, [pipOn, items, pomo, history, archive, updateReady, aiOn, aiModel, aiJob, agent.msgs, agent.busy, agent.step, agent.error, agent.cost, agent.proposal]);

      // `?float=1` — the laptop widget shortcut. Document-PiP requires a user gesture,
      // so the automatic attempt is usually refused; when it is we fall back to a bare
      // launcher screen: one click and the floating window is up.
      const [floatWanted, setFloatWanted] = useState(LAUNCH.float && pipSupported);
      const floatTriedRef = React.useRef(false);
      React.useEffect(() => {
        if (!floatWanted || pipOn || floatTriedRef.current || !items) return;
        floatTriedRef.current = true;
        openPip();
      }, [floatWanted, pipOn, items]);
      React.useEffect(() => { if (pipOn) setFloatWanted(false); }, [pipOn]);

      // `?capture=1` — home-screen "quick capture" shortcut lands with the box focused
      const captureRef = React.useRef(null);
      React.useEffect(() => {
        if (!LAUNCH.focusCapture) return;
        const t = setTimeout(() => { try { captureRef.current && captureRef.current.focus(); } catch(e){} }, 60);
        return () => clearTimeout(t);
      }, []);

      if (!items) return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#64748b",fontSize:14}}>
          Loading…
        </div>
      );

      // launcher stub for the `?float=1` shortcut (see above) — supplies the click that
      // Document-PiP demands, then gets out of the way once the float is open.
      if (floatWanted) return (
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,height:"100vh"}}>
          <div style={{fontSize:34}}>🎯</div>
          <button onClick={openPip} className="btn btn-pri">⤢ Open the float</button>
          <button onClick={()=>setFloatWanted(false)} className="btn btn-ghost btn-sm">Open the full app instead</button>
        </div>
      );

      const raw   = items[active] || [];
      const shown = active==="next"
        ? raw.filter(i => (ctx==="all"||i.context===ctx) && (enerF==="all"||i.energy===enerF) && (timeF==="all"||i.time===timeF))
        : raw;
      const counts = Object.fromEntries(LISTS.map(l=>[l,(items[l]||[]).length]));
      const todayStart = new Date(); todayStart.setHours(0,0,0,0);
      const todayDone  = (items.done||[]).filter(i=>new Date(i.doneAt||i.created)>=todayStart).length;
      const plannedCount = DATED.reduce((n,l)=>n+(items[l]||[]).filter(i=>i.dueDate).length,0);
      const todayISO = isoDate(new Date());
      // GTD tickler: in the act-now lists, hide actions whose start date is still in the
      // future — they live in a collapsed "Scheduled to start later" section and resurface
      // automatically on their start day.
      const canDefer     = active==="next" || active==="waiting";
      const liveShown    = canDefer ? shown.filter(i=>!isDeferred(i,todayISO)) : shown;
      const deferredShown = canDefer
        ? shown.filter(i=>isDeferred(i,todayISO)).sort((a,b)=>a.startDate.localeCompare(b.startDate))
        : [];
      // sidebar badge — same derivation as the Today view, so the two always agree
      const todayList  = todayRows(items, todayISO);
      const todayFocus = { count: todayList.length, overdue: todayList.some(r=>r._kind==="overdue") };
      // Project link helpers (id-based since schema v2)
      const pmap    = projIndex(items);                                            // id → project title
      const pnameOf = i => (i && i.projectId && pmap.get(i.projectId)) || null;    // for chips/grouping
      const ctxs    = (items.contexts && items.contexts.length) ? items.contexts : CONTEXTS;
      const projActions = {};   // projectId → linked next actions
      const projWaiting = {};   // projectId → linked waiting-for items
      (items.next||[]).forEach(a=>{ if(a.projectId) (projActions[a.projectId]=projActions[a.projectId]||[]).push(a); });
      (items.waiting||[]).forEach(a=>{ if(a.projectId) (projWaiting[a.projectId]=projWaiting[a.projectId]||[]).push(a); });

      // Weekly Review cadence (GTD's keystone Reflect habit). _reviewedAt is a synced
      // state timestamp; _reviewDay is the chosen review weekday (0=Sun … 6=Sat, default
      // Saturday). It's only flagged "due" from that weekday onward each week (not a rolling
      // 7-day timer) until done — so the nudge lands on your review day, then clears.
      const reviewedAt      = items._reviewedAt || 0;
      const reviewDay       = items._reviewDay==null ? 6 : items._reviewDay;
      const daysSinceReview = reviewedAt ? Math.floor((Date.now()-reviewedAt)/86400000) : null;
      const reviewWindowStart = (() => {
        const d = new Date(); d.setHours(0,0,0,0);
        d.setDate(d.getDate() - ((d.getDay()-reviewDay+7)%7));   // most recent reviewDay (today if it is one)
        return d.getTime();
      })();
      const reviewDue       = reviewedAt < reviewWindowStart;     // not reviewed since this week's review day

      // cloud sync status (syncTick forces this to re-evaluate after each sync)
      void syncTick;
      const odReady   = Drive.available();
      const odOn      = odReady && Drive.enabled() && !!odAccount;
      const syncLabel = !odReady   ? null
                      : !odOn      ? "☁ Connect OneDrive"
                      : syncing    ? "☁ Syncing…"
                      : (typeof navigator!=="undefined" && navigator.onLine===false) ? "☁ Offline"
                      : lastSyncRef.current ? `☁ Synced ${relTime(lastSyncRef.current)}` : "☁ Connected";

      return (
        <div className="app-shell" style={{fontFamily:"'Inter',system-ui,sans-serif",background:"#f1f5f9",color:"#1e293b"}}>

          {/* backdrop behind the mobile drawer — tap to close */}
          <div className={"nav-backdrop"+(navOpen?" show":"")} onClick={()=>setNavOpen(false)}/>

          {/* ── Sidebar ── */}
          <aside className={"app-sidebar"+(navOpen?" open":"")}>
            <div style={{padding:"18px 16px 12px",borderBottom:"1px solid rgba(255,255,255,.06)"}}>
              <div style={{fontWeight:800,fontSize:15,color:"#f1f5f9",letterSpacing:"-.3px"}}>GTD System</div>
              <div style={{fontSize:10,color:"#475569",marginTop:2}}>David Allen methodology</div>
            </div>
            <div style={{padding:"10px 12px",borderBottom:"1px solid rgba(255,255,255,.06)"}}>
              <div style={{fontSize:9,color:"#475569",textTransform:"uppercase",letterSpacing:"1px",marginBottom:5}}>Quick Capture</div>
              <div style={{display:"flex",gap:5}}>
                <input ref={captureRef} value={capture} onChange={e=>setCapture(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&quickCapture()} placeholder="Capture a thought…"
                  style={{flex:1,padding:"6px 8px",background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,color:"#f1f5f9",fontSize:11,outline:"none"}}/>
                <button onClick={quickCapture}
                  style={{padding:"6px 9px",background:"#6366f1",border:"none",borderRadius:6,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:14,lineHeight:1}}>+</button>
              </div>
            </div>
            <nav style={{flex:1,padding:"6px 8px"}}>
              {NAV.filter(l => l!=="chat" || aiOn).map(l => {
                const m=META[l], on=active===l;
                const reviewPill = l==="review" && reviewDue;
                const badge = l==="done" ? todayDone : l==="calendar" ? plannedCount : l==="today" ? todayFocus.count
                            : (l==="review"||l==="chat") ? 0 : counts[l];
                return (
                  <button key={l} onClick={()=>{setActive(l);setCtx("all");setShowForm(false);setNavOpen(false);}}
                    style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",padding:"8px 10px",background:on?"rgba(99,102,241,.18)":"transparent",border:"none",borderRadius:7,cursor:"pointer",color:on?"#a5b4fc":"#64748b",fontSize:12,fontWeight:on?600:400,textAlign:"left",marginBottom:1}}>
                    <span>{m.icon} {m.label}</span>
                    {reviewPill ? (
                      <span style={{background:"#f59e0b",color:"#fff",fontSize:9,padding:"1px 6px",borderRadius:20,fontWeight:700}}>due</span>
                    ) : badge > 0 && (
                      <span style={{background:l==="inbox"?"#ef4444":l==="done"?"#10b981":l==="calendar"?"#6366f1":l==="today"?(todayFocus.overdue?"#ef4444":"#6366f1"):"#1e293b",color:"#fff",fontSize:9,padding:"1px 6px",borderRadius:20,fontWeight:700}}>
                        {badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>
            <div style={{padding:"8px 10px",borderTop:"1px solid rgba(255,255,255,.06)"}}>
              <button onClick={()=>{setShowData(true);setNavOpen(false);}}
                style={{display:"flex",alignItems:"center",gap:7,width:"100%",padding:"8px 10px",background:"transparent",border:"1px solid rgba(255,255,255,.1)",borderRadius:7,color:"#64748b",cursor:"pointer",fontSize:11,fontWeight:600,textAlign:"left"}}
                onMouseEnter={e=>e.currentTarget.style.color="#a5b4fc"}
                onMouseLeave={e=>e.currentTarget.style.color="#64748b"}>
                ⇅ Sync &amp; Backup
              </button>
              {syncLabel && (
                <button onClick={()=>setShowData(true)}
                  style={{display:"block",width:"100%",marginTop:5,padding:"0 2px",background:"none",border:"none",color:odOn?"#475569":"#6366f1",cursor:"pointer",fontSize:10,textAlign:"left"}}>
                  {syncLabel}
                </button>
              )}
            </div>
            <div style={{padding:"8px 16px",borderTop:"1px solid rgba(255,255,255,.04)"}}>
              <div style={{fontSize:9,color:"#1e293b"}}>Capture → Clarify → Organize → Reflect → Engage</div>
              <div style={{fontSize:9,color:"#475569",marginTop:3}}>GTD {APP_VERSION}</div>
            </div>
          </aside>

          {/* ── Main ── */}
          <div className="app-main">
            <div style={{padding:"14px 22px",background:"#fff",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,gap:10}}>
              <div style={{display:"flex",alignItems:"center",gap:12,minWidth:0}}>
                <button className="nav-toggle" onClick={()=>setNavOpen(true)} title="Menu" aria-label="Open menu"
                  style={{width:38,height:38,flexShrink:0,background:"#fff",border:"1px solid #e2e8f0",borderRadius:9,cursor:"pointer",fontSize:17,color:"#475569",lineHeight:1}}>☰</button>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:17,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{META[active].icon} {META[active].label}</div>
                  <div style={{fontSize:11,color:"#64748b",marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{META[active].hint}</div>
                </div>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                {history.length > 0 && (
                  <button onClick={undo} title="Undo (Ctrl+Z)" className="btn btn-ghost btn-sm">↩ Undo</button>
                )}
                {canStartPomo && active!=="today" && (
                  <button onClick={()=>startPomo({ id:null, title:active==="next"&&ctx!=="all" ? `Batch ${ctx}` : META[active].label })}
                    title="Start a pomodoro on this view — clear the Inbox, run the review, or batch small actions in one context" aria-label="Start a pomodoro on this view" className="btn btn-ghost btn-sm">🍅</button>
                )}
                {pipSupported && (
                  <button onClick={pipOn?closePip:openPip} title={pipOn?"Close the floating window":"Pop out a floating, always-on-top Today window"}
                    className={"btn btn-sm "+(pipOn?"btn-pri":"btn-ghost")}>⤢ {pipOn?"Floating":"Float"}</button>
                )}
                {active!=="done" && active!=="calendar" && active!=="today" && active!=="review" && active!=="chat" && (
                  <button onClick={()=>setShowForm(s=>!s)} className="btn btn-pri btn-sm">{showForm?"Cancel":"+ Add"}</button>
                )}
              </div>
            </div>

            {renderPomoBar(captureThought)}

            {active==="next" && (
              <div style={{padding:"8px 22px",background:"#fff",borderBottom:"1px solid var(--line)",display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",flexShrink:0}}>
                {["all",...ctxs].map(c=>(
                  <button key={c} onClick={()=>setCtx(c)} className={"chip"+(ctx===c?" on":"")}>
                    {c==="all"?"All":c}
                  </button>
                ))}
                <span style={{width:1,height:18,background:"var(--line)",margin:"0 3px"}}/>
                <select value={enerF} onChange={e=>setEnerF(e.target.value)} title="Filter by energy available"
                  className={"chip"+(enerF!=="all"?" on":"")} style={{padding:"3px 8px"}}>
                  <option value="all">🔋 Any energy</option>
                  {ENERGIES.map(e=><option key={e} value={e}>🔋 {e}</option>)}
                </select>
                <select value={timeF} onChange={e=>setTimeF(e.target.value)} title="Filter by time available"
                  className={"chip"+(timeF!=="all"?" on":"")} style={{padding:"3px 8px"}}>
                  <option value="all">⏱ Any time</option>
                  {TIMES.map(t=><option key={t} value={t}>⏱ {t}</option>)}
                </select>
              </div>
            )}

            {showForm && active!=="done" && (
              <div style={{padding:"12px 22px",background:"var(--bg-form)",borderBottom:"1px solid var(--line)",flexShrink:0}}>
                {/* row 1 — the thing itself */}
                <div style={{display:"flex",gap:8}}>
                  <input autoFocus className="in" style={{flex:1}} value={form.title}
                    onChange={e=>setForm({...form,title:e.target.value})}
                    onKeyDown={e=>e.key==="Enter"&&addItem()} placeholder={placeFor(active)}/>
                  <button className="btn btn-pri" onClick={addItem}>Add</button>
                </div>
                {/* row 2 — its attributes (only lists that have any) */}
                {["next","projects","waiting"].includes(active) && (
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end",marginTop:9}}>
                    {active==="next" && (
                      <label className="fld"><span>Context</span>
                        <select className="in in-sm" value={form.context} onChange={e=>setForm({...form,context:e.target.value})}>
                          {ctxs.map(c=><option key={c}>{c}</option>)}
                        </select>
                      </label>
                    )}
                    {active==="waiting" && (
                      <label className="fld" style={{flex:"1 1 160px"}}><span>From whom</span>
                        <input className="in in-sm" value={form.waitingFor} onChange={e=>setForm({...form,waitingFor:e.target.value})} placeholder="Person / source"/>
                      </label>
                    )}
                    {active==="next" && (
                      <React.Fragment>
                        <label className="fld"><span>Energy</span>
                          <select className="in in-sm" value={form.energy} onChange={e=>setForm({...form,energy:e.target.value})}>
                            <option value="">—</option>
                            {ENERGIES.map(en=><option key={en} value={en}>{en}</option>)}
                          </select>
                        </label>
                        <label className="fld"><span>Time</span>
                          <select className="in in-sm" value={form.time} onChange={e=>setForm({...form,time:e.target.value})}>
                            <option value="">—</option>
                            {TIMES.map(t=><option key={t} value={t}>{t}</option>)}
                          </select>
                        </label>
                      </React.Fragment>
                    )}
                    <label className="fld"><span>Start</span>
                      <input className="in in-sm" type="date" value={form.startDate} onChange={e=>setForm({...form,startDate:e.target.value})}/>
                    </label>
                    <label className="fld"><span>Due</span>
                      <input className="in in-sm" type="date" value={form.dueDate} onChange={e=>setForm({...form,dueDate:e.target.value,dueTime:e.target.value?form.dueTime:""})}/>
                    </label>
                    {form.dueDate && (
                      <label className="fld" title="Optional — set a time only for a real appointment"><span>Time</span>
                        <input className="in in-sm" type="time" value={form.dueTime} onChange={e=>setForm({...form,dueTime:e.target.value})}/>
                      </label>
                    )}
                  </div>
                )}
              </div>
            )}

            <div style={{flex:1,overflowY:"auto",padding:"14px 22px"}}>
              {active==="today" ? (
                <TodayView items={items} todayISO={todayISO} pnameOf={pnameOf} reviewDue={reviewDue} daysSinceReview={daysSinceReview}
                  onComplete={(list,item)=>setComplCand({list,item})}
                  onToggleFocus={toggleFocus} onStartPomo={canStartPomo ? startPomo : null}
                  onEdit={(list,item)=>setEditCand({list,item})}
                  onGoto={list=>{setActive(list);setCtx("all");setNavOpen(false);}}/>
              ) : active==="calendar" ? (
                <CalendarView items={items} pnameOf={pnameOf}
                  onComplete={(list,item)=>setComplCand({list,item})}
                  onEdit={(list,item)=>setEditCand({list,item})}
                  onGoto={list=>{setActive(list);setCtx("all");setNavOpen(false);}}/>
              ) : active==="chat" ? (
                renderChat(false)
              ) : active==="review" ? (
                renderReview(list=>{setActive(list);setCtx("all");setNavOpen(false);})
              ) : active==="projects" ? (
                shown.length===0
                  ? <EmptyState list="projects"/>
                  : shown.map(p=>(
                      <ProjCard key={p.id} proj={p} actions={projActions[p.id]||[]} waiting={projWaiting[p.id]||[]} ctxs={ctxs}
                        onDelete={()=>del("projects",p.id)}
                        onEdit={()=>setEditCand({list:"projects",item:p})}
                        onCompleteAction={(l,id)=>setComplCand({list:l,item:(items[l]||[]).find(i=>i.id===id)})}
                        onDeleteAction={(l,id)=>del(l,id)}
                        onStalledDecision={handleStalledDecision}
                        onAiBreakdown={aiOn ? (pr=>runAi("breakdown", pr)) : null}/>
                    ))
              ) : active==="done" ? (
                <DoneView items={shown} pnameOf={pnameOf} archiveCount={archive.length} move={move} del={del}/>
              ) : active==="inbox" ? (
                shown.length===0
                  ? <EmptyState list="inbox"/>
                  : <InboxFocus item={shown[shown.length-1]} total={shown.length}
                      onProcess={()=>setProcItem(shown[shown.length-1])}
                      onSort={aiOn ? ()=>{ agent.send(AGENT_SORT_INBOX); setActive("chat"); } : null}/>
              ) : (liveShown.length===0 && deferredShown.length===0) ? (
                <EmptyState list={active} ctx={ctx}/>
              ) : (
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {liveShown.map(item=>(
                    <ItemCard key={item.id} item={item} list={active} pname={pnameOf(item)}
                      onComplete={()=>setComplCand({list:active,item})}
                      onDelete={()=>del(active,item.id)}
                      onProcess={null}
                      onRestore={active==="done"?()=>move("done",item.id,"next",{doneAt:undefined}):null}
                      onMove={["next","waiting","someday","projects","reference"].includes(active)
                        ? to=>upd({...items,[active]:items[active].filter(i=>i.id!==item.id),[to]:[item,...(items[to]||[])]})
                        : null}
                      onPromote={active==="next" ? ()=>setPromoteCand(item) : null}
                      onEdit={["next","waiting","someday","reference"].includes(active) ? ()=>setEditCand({list:active,item}) : null}
                      onToggleFocus={active==="next" ? ()=>toggleFocus(item.id) : null}
                      focused={active==="next" && item.focusDate===todayISO}
                      onStartPomo={active==="next" && canStartPomo ? ()=>startPomo(item) : null}
                      currentList={active}/>
                  ))}
                  {deferredShown.length>0 && (
                    <DeferredSection count={deferredShown.length}>
                      {deferredShown.map(item=>(
                        <ItemCard key={item.id} item={item} list={active} pname={pnameOf(item)}
                          onComplete={()=>setComplCand({list:active,item})}
                          onDelete={()=>del(active,item.id)}
                          onProcess={null}
                          onRestore={null}
                          onMove={to=>upd({...items,[active]:items[active].filter(i=>i.id!==item.id),[to]:[item,...(items[to]||[])]})}
                          onPromote={active==="next" ? ()=>setPromoteCand(item) : null}
                          onEdit={()=>setEditCand({list:active,item})}
                          onToggleFocus={null}
                          focused={false}
                          currentList={active}/>
                      ))}
                    </DeferredSection>
                  )}
                </div>
              )}
            </div>
          </div>

          {/* hidden picker used by both Import buttons */}
          <input ref={fileInputRef} type="file" accept="application/json,.json"
            onChange={onImportFile} style={{display:"none"}}/>

          {showData && (
            <DataModal counts={counts} archiveCount={archive.length}
              contexts={ctxs}
              onAddContext={c=>{ let x=(c||"").trim(); if(!x) return; if(!x.startsWith("@")) x="@"+x;
                                 if(items.contexts.some(e=>e.toLowerCase()===x.toLowerCase())) return;
                                 upd({ ...items, contexts:[...items.contexts, x] }); }}
              onDelContext={c=>{ if(c==="@anywhere") return;   // the neutral default stays
                                 upd({ ...items, contexts:items.contexts.filter(x=>x!==c) }); }}
              onExport={()=>exportData({ ...items, archive })}
              onImport={triggerImport}
              cloud={{
                ready: odReady, configured: !!MS_CLIENT_ID,
                account: odAccount, syncing,
                lastSynced: lastSyncRef.current,
                onConnect: connectDrive, onDisconnect: disconnectDrive, onSyncNow: syncNow,
              }}
              ai={{
                hasKey: aiOn, masked: Ai.masked(), model: aiModel, onModel: pickModel, online: aiOnline,
                test: aiTest, onSave: saveAiKey, onClear: ()=>saveAiKey(""), onTest: testAiKey,
              }}
              onClose={()=>setShowData(false)}/>
          )}

          {complCand && complCand.item && (
            <CompleteModal item={complCand.item} list={complCand.list}
              pname={pnameOf(complCand.item)} ctxs={ctxs}
              onConfirm={(d,a)=>confirmComplete(complCand.list,complCand.item.id,d,a)}
              onClose={()=>setComplCand(null)}/>
          )}

          {promoteCand && (
            <PromoteModal item={promoteCand}
              onConfirm={outcome=>{
                const proj = {...mk(outcome), dueDate:promoteCand.dueDate||""};
                upd({
                  ...items,
                  next: items.next.map(a=>a.id===promoteCand.id?{...a, projectId:proj.id}:a),
                  projects: [proj, ...items.projects],
                });
                setPromoteCand(null);
              }}
              onClose={()=>setPromoteCand(null)}/>
          )}
          {editCand && (
            <EditModal item={editCand.item} list={editCand.list} ctxs={ctxs} projects={items.projects}
              onConfirm={patch => { applyEdit(editCand.list, editCand.item, patch); setEditCand(null); }}
              onClose={()=>setEditCand(null)}/>
          )}
          {aiJob && aiJob.kind==="breakdown" && (
            <AiModal title="✨ Break down a project" subtitle={aiJob.target ? aiJob.target.title : ""}
              ai={{ ...aiPanel("breakdown"), onRun: ()=>runAi("breakdown", aiJob.target) }}/>
          )}
          {procItem && (
            <ProcessModal item={procItem} ctxs={ctxs}
              ai={aiOn ? { ...aiPanel("clarify"), onRun: ()=>runAi("clarify", procItem) } : null}
              onMove={(to,patch)=>move("inbox",procItem.id,to,patch)}
              onMoveAsProject={(patch, first) => {
                const src = items.inbox.find(i=>i.id===procItem.id); if (!src) return;
                let n = {...items, inbox:items.inbox.filter(i=>i.id!==procItem.id), projects:[{...src,...patch},...items.projects]};
                if (first.type==="next") {
                  const a = {...mk(first.title), projectId:src.id, context:first.context, dueDate:first.dueDate, dueTime:first.dueTime||"", startDate:first.startDate};
                  n = {...n, next:[a,...n.next]};
                } else {
                  const w = {...mk(first.waitingFor), waitingFor:first.waitingFor, projectId:src.id};
                  n = {...n, waiting:[w,...n.waiting]};
                }
                upd(n); setProcItem(null);
              }}
              onTrash={()=>{del("inbox",procItem.id);setProcItem(null);}}
              onClose={()=>setProcItem(null)}/>
          )}

          {updateReady && (
            <div style={{position:"fixed",left:"50%",bottom:18,transform:"translateX(-50%)",zIndex:400,
                         display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:"#1e293b",color:"#f1f5f9",
                         borderRadius:10,boxShadow:"0 10px 30px rgba(0,0,0,.3)",fontSize:12,maxWidth:"92vw"}}>
              <span>🔄 A new version is ready.</span>
              <button onClick={reloadApp}
                style={{padding:"5px 12px",background:"#6366f1",color:"#fff",border:"none",borderRadius:7,cursor:"pointer",fontSize:12,fontWeight:700}}>
                Reload
              </button>
              <button onClick={()=>setUpdateReady(false)} title="Dismiss"
                style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:16,lineHeight:1,padding:"0 2px"}}>×</button>
            </div>
          )}
        </div>
      );
    }

    // ── DoneView / DoneGroup ──────────────────────────────────────
    function DoneView({ items, pnameOf, archiveCount, move, del }) {
      const [groupBy, setGroupBy] = useState("time");
      const archiveNote = archiveCount > 0 && (
        <div style={{fontSize:11,color:"#94a3b8",padding:"10px 2px 0"}}>
          🗄 {archiveCount} older item{archiveCount!==1?"s":""} in the archive (rotated out after {ARCHIVE_DAYS} days — included in backup files).
        </div>
      );
      if (items.length === 0) return <div><EmptyState list="done"/>{archiveNote}</div>;
      const groups = groupBy==="time" ? doneByTime(items) : doneByProject(items, pnameOf);
      return (
        <div>
          <div style={{display:"flex",gap:5,marginBottom:12}}>
            {[["time","By date"],["project","By project"]].map(([g,lbl])=>(
              <button key={g} onClick={()=>setGroupBy(g)} className={"chip"+(groupBy===g?" on":"")}>{lbl}</button>
            ))}
          </div>
          {groups.map(g=>(
            <DoneGroup key={g.label} group={g} pnameOf={pnameOf}
              onRestore={id=>move("done",id,"next",{doneAt:undefined})}
              onDelete={id=>del("done",id)}/>
          ))}
          {archiveNote}
        </div>
      );
    }

    function DoneGroup({ group, pnameOf, onRestore, onDelete }) {
      const [open, setOpen] = useState(group.defaultOpen);
      return (
        <div style={{marginBottom:8}}>
          <button onClick={()=>setOpen(o=>!o)}
            style={{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"7px 12px",
                    background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:8,
                    cursor:"pointer",textAlign:"left",marginBottom:open?6:0}}>
            <span style={{flex:1,fontSize:11,fontWeight:700,color:"#475569"}}>{group.label}</span>
            <span style={{fontSize:10,color:"#94a3b8"}}>{group.items.length} item{group.items.length!==1?"s":""}</span>
            <span style={{fontSize:9,color:"#94a3b8",display:"inline-block",transition:"transform .15s",transform:open?"rotate(180deg)":"none"}}>▼</span>
          </button>
          {open&&(
            <div style={{display:"flex",flexDirection:"column",gap:5,paddingLeft:4}}>
              {group.items.map(item=>(
                <ItemCard key={item.id} item={item} list="done" pname={pnameOf?pnameOf(item):null}
                  onRestore={()=>onRestore(item.id)}
                  onDelete={()=>onDelete(item.id)}/>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ── ProjCard ──────────────────────────────────────────────────
    function ProjCard({ proj, actions, waiting, ctxs, onDelete, onEdit, onCompleteAction, onDeleteAction, onStalledDecision, onAiBreakdown }) {
      const [open, setOpen]           = useState(false);
      const [stalledPhase, setStalledPhase] = useState(null); // null | "define" | "waiting"
      const [naTitle, setNaTitle]     = useState("");
      const [naCtx,   setNaCtx]       = useState("@anywhere");
      const [naDue,   setNaDue]       = useState("");
      const [waitTxt, setWaitTxt]     = useState("");
      // A project with a linked Waiting For isn't stalled — the ball is in someone
      // else's court, which is a legitimate GTD "next move".
      const stalled = actions.length===0 && waiting.length===0;
      const delegated = actions.length===0 && waiting.length>0;

      const resetStalled = () => { setStalledPhase(null); setNaTitle(""); setNaDue(""); setWaitTxt(""); };

      return (
        <div style={{border:`1px solid ${stalled?"#fcd34d":"#e2e8f0"}`,borderRadius:10,overflow:"hidden",marginBottom:8,background:"#fff"}}>
          <div onClick={()=>setOpen(o=>!o)}
            style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",background:stalled?"#fffbeb":"#f8fafc",cursor:"pointer",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:13,display:"flex",alignItems:"center",gap:7}}>
                📋 {proj.title}
                {stalled && <span style={{fontSize:10,background:"#fef9c3",color:"#92400e",padding:"1px 7px",borderRadius:20,fontWeight:700}}>⚠️ stalled</span>}
                {delegated && <span style={{fontSize:10,background:"#eff6ff",color:"#1e40af",padding:"1px 7px",borderRadius:20,fontWeight:700}}>⏳ waiting</span>}
              </div>
              <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{actions.length} active action{actions.length!==1?"s":""}{waiting.length?` · ${waiting.length} waiting`:""}{proj.dueDate?` · 📅 ${proj.dueDate}`:""}</div>
            </div>
            {onAiBreakdown&&(
              <button onClick={e=>{e.stopPropagation();onAiBreakdown(proj);}} title="Ask Claude for the next action"
                className="ibtn" style={{fontSize:13}}>✨</button>
            )}
            {onEdit&&(
              <button onClick={e=>{e.stopPropagation();onEdit();}} title="Edit" className="ibtn" style={{fontSize:13}}>✎</button>
            )}
            <span style={{fontSize:11,color:"#94a3b8",transform:open?"rotate(180deg)":"none",transition:"transform .15s"}}>▼</span>
          </div>
          {open && (
            <div style={{padding:"10px 14px",borderTop:"1px solid #e2e8f0"}}>
              {stalled ? (
                <div>
                  <div style={{fontSize:11,color:"#92400e",background:"#fffbeb",padding:"7px 10px",borderRadius:7,marginBottom:10}}>
                    No active next action — how do you want to handle this project?
                  </div>

                  {stalledPhase===null && (
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
                      <button onClick={()=>setStalledPhase("define")}
                        style={{padding:"9px 10px",background:"#f5f3ff",border:"1.5px solid #6366f1",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:600,color:"#4338ca",textAlign:"left"}}>
                        ⚡ Define next action
                        <div style={{fontSize:10,fontWeight:400,color:"#6366f1",marginTop:1}}>Keep it moving</div>
                      </button>
                      <button onClick={()=>{ onStalledDecision("close",proj,null); }}
                        style={{padding:"9px 10px",background:"#f0fdf4",border:"1.5px solid #10b981",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:600,color:"#065f46",textAlign:"left"}}>
                        🎉 Mark complete
                        <div style={{fontSize:10,fontWeight:400,color:"#10b981",marginTop:1}}>Outcome achieved</div>
                      </button>
                      {onAiBreakdown && (
                        <button onClick={()=>onAiBreakdown(proj)}
                          style={{padding:"9px 10px",background:"#faf5ff",border:"1.5px solid #c4b5fd",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:600,color:"#5b21b6",textAlign:"left"}}>
                          ✨ Ask Claude
                          <div style={{fontSize:10,fontWeight:400,color:"#8b5cf6",marginTop:1}}>Name the very next action</div>
                        </button>
                      )}
                      <button onClick={()=>setStalledPhase("waiting")}
                        style={{padding:"9px 10px",background:"#eff6ff",border:"1.5px solid #93c5fd",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:600,color:"#1e40af",textAlign:"left"}}>
                        ⏳ Waiting for…
                        <div style={{fontSize:10,fontWeight:400,color:"#3b82f6",marginTop:1}}>Ball is in someone else's court</div>
                      </button>
                      <button onClick={()=>{ onStalledDecision("someday",proj,null); }}
                        style={{padding:"9px 10px",background:"#f8fafc",border:"1.5px solid #94a3b8",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:600,color:"#475569",textAlign:"left"}}>
                        💤 Someday/Maybe
                        <div style={{fontSize:10,fontWeight:400,color:"#64748b",marginTop:1}}>Not a priority now</div>
                      </button>
                    </div>
                  )}

                  {stalledPhase==="define" && (
                    <div style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:8,padding:"10px 12px",marginBottom:8}}>
                      <div style={{fontSize:11,fontWeight:600,color:"#4338ca",marginBottom:6}}>
                        Next action for <em>{proj.title}</em>
                      </div>
                      <input autoFocus value={naTitle} onChange={e=>setNaTitle(e.target.value)}
                        onKeyDown={e=>{ if(e.key==="Enter"&&naTitle.trim()){ onStalledDecision("next",proj,{title:naTitle.trim(),context:naCtx,dueDate:naDue}); resetStalled(); }}}
                        placeholder="What is the very next physical action?"
                        style={{width:"100%",padding:"7px 9px",border:"1px solid #c4b5fd",borderRadius:7,fontSize:12,outline:"none",marginBottom:6}}/>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
                        <select value={naCtx} onChange={e=>setNaCtx(e.target.value)}
                          style={{padding:"6px 8px",border:"1px solid #c4b5fd",borderRadius:7,fontSize:11,background:"#fff"}}>
                          {ctxs.map(c=><option key={c}>{c}</option>)}
                        </select>
                        <input type="date" value={naDue} onChange={e=>setNaDue(e.target.value)}
                          style={{padding:"6px 8px",border:"1px solid #c4b5fd",borderRadius:7,fontSize:11}}/>
                      </div>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>{ if(naTitle.trim()){ onStalledDecision("next",proj,{title:naTitle.trim(),context:naCtx,dueDate:naDue}); resetStalled(); }}}
                          disabled={!naTitle.trim()}
                          style={{flex:1,padding:"7px",background:naTitle.trim()?"#6366f1":"#e2e8f0",color:naTitle.trim()?"#fff":"#94a3b8",border:"none",borderRadius:7,cursor:naTitle.trim()?"pointer":"default",fontSize:12,fontWeight:600}}>
                          ✓ Add action
                        </button>
                        <button onClick={resetStalled}
                          style={{padding:"7px 12px",background:"transparent",border:"1px solid #ddd6fe",borderRadius:7,cursor:"pointer",fontSize:12,color:"#6366f1"}}>
                          Cancel
                        </button>
                      </div>
                    </div>
                  )}

                  {stalledPhase==="waiting" && (
                    <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"10px 12px",marginBottom:8}}>
                      <div style={{fontSize:11,fontWeight:600,color:"#1e40af",marginBottom:6}}>
                        What are you waiting for?
                      </div>
                      <input autoFocus value={waitTxt} onChange={e=>setWaitTxt(e.target.value)}
                        onKeyDown={e=>{ if(e.key==="Enter"&&waitTxt.trim()){ onStalledDecision("waiting",proj,{waitingFor:waitTxt.trim()}); resetStalled(); }}}
                        placeholder="e.g. John's approval on the proposal"
                        style={{width:"100%",padding:"7px 9px",border:"1px solid #93c5fd",borderRadius:7,fontSize:12,outline:"none",marginBottom:8}}/>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>{ if(waitTxt.trim()){ onStalledDecision("waiting",proj,{waitingFor:waitTxt.trim()}); resetStalled(); }}}
                          disabled={!waitTxt.trim()}
                          style={{flex:1,padding:"7px",background:waitTxt.trim()?"#3b82f6":"#e2e8f0",color:waitTxt.trim()?"#fff":"#94a3b8",border:"none",borderRadius:7,cursor:waitTxt.trim()?"pointer":"default",fontSize:12,fontWeight:600}}>
                          ⏳ Add to Waiting For
                        </button>
                        <button onClick={resetStalled}
                          style={{padding:"7px 12px",background:"transparent",border:"1px solid #bfdbfe",borderRadius:7,cursor:"pointer",fontSize:12,color:"#3b82f6"}}>
                          Cancel
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                <div style={{display:"flex",flexDirection:"column",gap:5}}>
                  {actions.map(a=>(
                    <div key={a.id} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"7px 8px",background:"#f8fafc",borderRadius:7,border:"1px solid #e2e8f0"}}>
                      <button onClick={()=>onCompleteAction("next",a.id)}
                        style={{width:17,height:17,borderRadius:"50%",border:"2px solid #cbd5e1",background:"#fff",cursor:"pointer",flexShrink:0,marginTop:1}}
                        onMouseEnter={e=>e.target.style.borderColor="#6366f1"}
                        onMouseLeave={e=>e.target.style.borderColor="#cbd5e1"}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:500,wordBreak:"break-word"}}>
                          {a.title}
                        </div>
                        <div style={{display:"flex",gap:5,marginTop:3,flexWrap:"wrap"}}>
                          {a.context&&a.context!=="@anywhere"&&<Tag bg="#ede9fe" c="#5b21b6">{a.context}</Tag>}
                          {a.dueDate&&<Tag bg={isOver(a.dueDate)?"#fef2f2":"#f0fdf4"} c={isOver(a.dueDate)?"#b91c1c":"#166534"}>{isOver(a.dueDate)?"⚠️ ":"📅 "}{dueLabel(a.dueDate,a.dueTime)}</Tag>}
                        </div>
                      </div>
                      <button onClick={()=>onDeleteAction("next",a.id)}
                        style={{background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",fontSize:15,lineHeight:1}}
                        onMouseEnter={e=>e.target.style.color="#ef4444"}
                        onMouseLeave={e=>e.target.style.color="#cbd5e1"}>×</button>
                    </div>
                  ))}
                  {waiting.map(w=>(
                    <div key={w.id} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"7px 8px",background:"#fffbeb",borderRadius:7,border:"1px solid #fde68a"}}>
                      <button onClick={()=>onCompleteAction("waiting",w.id)} title="Received / resolved"
