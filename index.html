<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>GTD – Getting Things Done</title>

  <!-- PWA: installable on Android home screen & Windows; works offline -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="static/icons/icon.svg">
  <link rel="apple-touch-icon" href="static/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GTD">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Microsoft Authentication Library — used only for the OPTIONAL OneDrive cloud sync.
       Served from unpkg (same CDN as React) — Microsoft's own alcdn host is unreliable. -->
  <script src="https://unpkg.com/@azure/msal-browser@2.38.4/lib/msal-browser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; }

    /* ── Responsive app shell ──
       Layout structure lives here (not inline) so it can adapt to viewport.
       Wide screens: persistent sidebar beside the content (works in landscape).
       Narrow screens: sidebar becomes an off-canvas drawer toggled by a button. */
    .app-shell   { display:flex; height:100vh; height:100dvh; overflow:hidden; }
    .app-sidebar { width:210px; flex-shrink:0; display:flex; flex-direction:column;
                   overflow-y:auto; background:#0f172a; }
    .app-main    { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
    .nav-toggle  { display:none; }          /* hamburger: hidden on wide screens */
    .nav-backdrop{ display:none; }

    /* Phones / very narrow windows — drawer sidebar over full-width content.
       Targets portrait phones AND short landscape phones (max-height) so the
       sidebar never eats the content area. */
    @media (max-width: 760px), (max-height: 460px) and (max-width: 960px) {
      .nav-toggle { display:inline-flex; align-items:center; justify-content:center; }
      .app-sidebar {
        position:fixed; top:0; left:0; bottom:0; height:100%;
        width:78vw; max-width:300px; z-index:120;
        transform:translateX(-100%);
        transition:transform .22s ease;
        box-shadow:0 0 40px rgba(0,0,0,.55);
        padding-top:env(safe-area-inset-top);
      }
      .app-sidebar.open { transform:translateX(0); }
      .nav-backdrop.show {
        display:block; position:fixed; inset:0;
        background:rgba(0,0,0,.5); z-index:110;
      }
    }

    /* ── Design system ──
       Shared tokens + component classes so styling stays consistent and edits
       happen in one place. Hover/focus live here (CSS :hover) instead of inline
       onMouseEnter/Leave handlers. Components reference these via className. */
    :root{
      --indigo:#6366f1; --indigo-d:#4f46e5; --indigo-soft:#eef2ff; --indigo-ink:#4338ca;
      --ink:#1e293b; --muted:#64748b; --faint:#94a3b8;
      --line:#e2e8f0; --line-2:#d1d5db; --bg-soft:#f8fafc; --bg-form:#fafaf9;
      --red:#ef4444; --red-ink:#b91c1c; --amber:#f59e0b; --green:#10b981;
    }
    /* inputs & selects */
    .in{ width:100%; padding:8px 10px; border:1px solid var(--line-2); border-radius:8px;
         font-size:13px; outline:none; background:#fff; color:var(--ink); font-family:inherit; }
    .in:focus{ border-color:var(--indigo); }
    .in-sm{ padding:7px 9px; font-size:12px; border-radius:7px; }
    select.in{ cursor:pointer; }
    /* stacked label + control */
    .fld{ display:flex; flex-direction:column; gap:3px; min-width:0; }
    .fld > span{ font-size:9px; font-weight:600; color:var(--faint);
                 text-transform:uppercase; letter-spacing:.4px; }
    /* buttons */
    .btn{ border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
          padding:9px 16px; line-height:1.2; font-family:inherit;
          transition:background .15s, border-color .15s, color .15s; }
    .btn:disabled{ cursor:default; }
    .btn-sm{ padding:6px 12px; font-size:12px; border-radius:7px; }
    .btn-pri{ background:var(--indigo); color:#fff; }
    .btn-pri:hover{ background:var(--indigo-d); }
    .btn-pri:disabled{ background:var(--line); color:var(--faint); }
    .btn-ghost{ background:#fff; color:var(--muted); border:1px solid var(--line); }
    .btn-ghost:hover{ border-color:var(--indigo); color:var(--indigo); }
    /* bare icon button (✎ ↗ ☆ ×) */
    .ibtn{ background:none; border:none; cursor:pointer; color:var(--faint);
           line-height:1; padding:0 2px; transition:color .15s; }
    .ibtn:hover{ color:var(--indigo); }
    /* filter chip */
    .chip{ padding:3px 10px; border-radius:20px; border:1px solid var(--line);
           background:#fff; color:var(--muted); cursor:pointer; font-size:11px; font-family:inherit; }
    .chip:hover{ border-color:var(--indigo); }
    .chip.on{ border-color:var(--indigo); background:var(--indigo); color:#fff; font-weight:600; }
    /* modal chrome */
    .ov{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
         align-items:center; justify-content:center; z-index:200; padding:14px; }
    .mbox{ background:#fff; border-radius:14px; padding:22px; width:420px; max-width:92vw;
           max-height:92vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    /* uppercase section label */
    .slabel{ font-size:10px; font-weight:700; color:var(--faint);
             text-transform:uppercase; letter-spacing:.8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // App build version — keep in sync with CACHE in static/sw.js. Shown in the
    // sidebar footer so you can tell at a glance which build a device is running.
    const APP_VERSION = "v34";

    // Default contexts — seed only. Since schema v2 the live list is state.contexts,
    // editable in-app (Sync & Backup → Contexts); this constant is the fallback/seed.
    const CONTEXTS = ["@anywhere","@calls","@computer","@errands","@home","@office"];
    // GTD's other two "engage" criteria beyond context: energy available and time at hand.
    // Optional on a Next Action; "" = unset. Stored as these literal labels.
    const ENERGIES = ["Low","Med","High"];
    const TIMES    = ["<15m","<1h",">1h"];
    const LISTS    = ["inbox","next","projects","waiting","someday","reference","done"];
    // Sidebar order — GTD workflow order (capture→clarify→organize→reflect→engage):
    // Inbox → the organize lists → Calendar/Weekly Review (reflect) → Done. Today leads
    // as the daily home. `today`/`calendar`/`review` are cross-list views, not stored
    // lists, so they stay out of LISTS to keep data/count logic untouched.
    const NAV      = ["today","inbox","next","waiting","projects","someday","reference","calendar","review","chat","done"];
    // Lists whose items can carry a dueDate and so appear on the Calendar.
    const DATED    = ["next","waiting","projects","someday"];
    // Lists the Today view draws from — actionable work only. Projects are outcomes
    // (you do their next actions, not the project), and Someday is "not now", so neither
    // belongs in "do today"; their dates still show on the Calendar.
    const TODAY_LISTS = ["next","waiting"];
    const META = {
      today:     { icon:"🎯", label:"Today",          hint:"Your focus for today — plan and engage" },
      review:    { icon:"🔄", label:"Weekly Review",   hint:"Reflect: get clear, get current, get creative" },
      inbox:     { icon:"📥", label:"Inbox",         hint:"Capture everything — process later" },
      next:      { icon:"⚡", label:"Next Actions",   hint:"Next physical, visible actions" },
      calendar:  { icon:"📅", label:"Calendar",       hint:"Scheduled items by due date" },
      projects:  { icon:"📋", label:"Projects",       hint:"Outcomes needing more than one step" },
      waiting:   { icon:"⏳", label:"Waiting For",    hint:"Delegated to or expected from others" },
      someday:   { icon:"🌟", label:"Someday/Maybe",  hint:"Ideas to revisit when the time is right" },
      reference: { icon:"📁", label:"Reference",      hint:"Non-actionable — keep for future lookup" },
      chat:      { icon:"✨", label:"Ask Claude",     hint:"Question your own system — read-only" },
      done:      { icon:"✅", label:"Done",           hint:"Completed items" },
    };

    // ── Helpers ───────────────────────────────────────────────────
    const ts      = () => new Date().toISOString();
    const mk      = t  => ({ id: Date.now()+Math.random(), title:t.trim(), created:ts(), projectId:"", context:"@anywhere", dueDate:"", dueTime:"", startDate:"", waitingFor:"", energy:"", time:"", _updatedAt: Date.now() });
    const exProj  = t  => { const m=(t||"").match(/^\[([^\]]+)\]/); return m?m[1]:null; };
    const fmtDate = d  => { try{ return new Date(d).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"}); }catch{return d||"";} };
    // "HH:MM" (24h) → "h:mm AM/PM"; blank stays blank. Optional time turns a due DATE into a
    // true time-specific appointment (GTD hard landscape). A bare date stays day-scale.
    const fmtTime = t  => { if(!t) return ""; const [h,m]=t.split(":").map(Number); const ap=h<12?"AM":"PM"; const h12=h%12||12; return `${h12}:${String(m).padStart(2,"0")} ${ap}`; };
    const dueLabel= (d,tm) => d ? (tm ? `${d} ${fmtTime(tm)}` : d) : "";
    const isoDate = d  => { const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };
    const relTime = t  => { if(!t) return ""; const s=Math.max(0,Math.floor((Date.now()-t)/1000)); if(s<60) return "just now"; const m=Math.floor(s/60); if(m<60) return m+"m ago"; const h=Math.floor(m/60); if(h<24) return h+"h ago"; return Math.floor(h/24)+"d ago"; };
    const isOver  = d  => d && new Date(d+"T23:59") < new Date();
    // GTD tickler: an item with a future start date is "deferred" — hidden from the active
    // Next Actions / Waiting / Today lists until its start day, then it resurfaces.
    const isDeferred = (i, today) => i.startDate && i.startDate > today;
    const fresh   = () => ({ schemaVersion:SCHEMA_VERSION, inbox:[], next:[], projects:[], waiting:[], someday:[], reference:[], done:[],
                             contexts:[...CONTEXTS], tombstones:{}, _reviewedAt:0, _metaUpdatedAt:0, _updatedAt:0 });
    // How we were launched. The OS/launcher starts us at start_url with a query:
    // ?title/&text/&url from the PWA share target, or ?view/&capture/&float/&headless
    // from a home-screen shortcut, the laptop float shortcut or the Android widget.
    // ONE parser on purpose — reading is destructive (the query is stripped right after
    // so a reload can't replay it), so two independent readers would starve each other.
    //   capture      shared text to drop straight into the Inbox ("" = not a share)
    //   view         nav key to open on boot ("" = default)
    //   focusCapture autofocus the quick-capture box
    //   float        pop the always-on-top Today window immediately
    //   headless     offscreen sync run (Android worker) — skip UI-only work
    const readLaunchIntent = () => {
      const out = { capture:"", view:"", focusCapture:false, float:false, headless:false };
      try {
        if (!location.search) return out;
        const p = new URLSearchParams(location.search);
        const parts = [];
        ["title","text","url"].forEach(k => { const v=(p.get(k)||"").trim(); if (v && !parts.includes(v)) parts.push(v); });
        out.capture      = parts.join(" — ");
        const v          = (p.get("view")||"").trim();
        out.view         = NAV.includes(v) ? v : "";
        out.focusCapture = p.get("capture")  === "1";
        out.float        = p.get("float")    === "1";
        out.headless     = p.get("headless") === "1";
        history.replaceState(null, "", location.pathname);
      } catch {}
      return out;
    };
    // ═══ DATA CORE (schema v2) ═══════════════════════════════════
    // Pure data functions — no DOM, no network. tests/test_data_core.js extracts
    // everything from `const CONTEXTS` down to END DATA CORE and runs it in Node;
    // keep this block free of JSX and browser APIs.
    //
    // Schema v2: every item carries its own `_updatedAt` (ms) and an explicit
    // `projectId` link (no more [Project] title prefixes in stored data);
    // the state carries `contexts` (user-editable), `tombstones` {id: deletedAt}
    // so deletions survive merging, and `_metaUpdatedAt` for non-item settings.
    const SCHEMA_VERSION = 2;
    const ARCHIVE_DAYS   = 90;   // done items older than this rotate into the archive store
    const TOMB_DAYS      = 60;   // tombstones are pruned after this (all devices have synced)

    const pickLists      = src => Object.fromEntries(LISTS.map(l => [l, Array.isArray(src[l]) ? src[l] : []]));
    const looksLikeState = d   => d && typeof d === "object" && LISTS.some(l => Array.isArray(d[l]));
    const sameState      = (x, y) => JSON.stringify(x) === JSON.stringify(y);
    const stripPrefix    = t   => (t||"").replace(/^\[[^\]]+\]\s*/, "").trim();

    // id → title for everything that can BE a project (active, deferred, or closed).
    const projIndex = s => {
      const m = new Map();
      ["projects","someday","done"].forEach(l => (s[l]||[]).forEach(p => { if (!m.has(p.id)) m.set(p.id, p.title); }));
      return m;
    };

    // Capture convenience: typing "[Project] action" links the action to an EXISTING
    // project by name (active or someday). No match ⇒ the title stays as typed.
    const linkByPrefix = (title, s) => {
      const p = exProj(title);
      if (p) {
        const key = p.trim().toLowerCase();
        const hit = ["projects","someday"].flatMap(l => s[l]||[]).find(x => (x.title||"").trim().toLowerCase() === key);
        if (hit) return { title: stripPrefix(title), projectId: hit.id };
      }
      return { title: (title||"").trim(), projectId: "" };
    };

    // Upgrade any stored/imported/remote state to schema v2. v1 → v2 stamps every
    // item with the old state-level clock and converts [Project] title prefixes to
    // projectId links (matched case-insensitively against projects/someday/done).
    const migrate = raw => {
      if (!looksLikeState(raw)) return null;
      const s = { ...fresh(), ...pickLists(raw) };
      s._reviewedAt = raw._reviewedAt || 0;
      if (raw._reviewDay != null) s._reviewDay = raw._reviewDay;
      s._updatedAt     = raw._updatedAt || 0;
      s.contexts       = Array.isArray(raw.contexts) && raw.contexts.length ? [...raw.contexts] : [...CONTEXTS];
      s.tombstones     = raw.tombstones && typeof raw.tombstones === "object" ? { ...raw.tombstones } : {};
      s._metaUpdatedAt = raw._metaUpdatedAt || 0;
      if ((raw.schemaVersion || 1) < 2) {
        const stamp  = raw._updatedAt || Date.now();
        const byName = new Map();
        ["projects","someday","done"].forEach(l => (s[l]||[]).forEach(p => {
          const k = (p.title||"").trim().toLowerCase();
          if (k && !byName.has(k)) byName.set(k, p.id);
        }));
        LISTS.forEach(l => { s[l] = (s[l]||[]).map(i => {
          const out = { ...i };
          if (out._updatedAt == null) out._updatedAt = stamp;
          if (out.projectId === undefined) {
            const p  = exProj(out.title);
            const id = p ? byName.get(p.trim().toLowerCase()) : undefined;
            if (id !== undefined && id !== out.id) { out.projectId = id; out.title = stripPrefix(out.title) || out.title; }
            else out.projectId = "";
          }
          return out;
        }); });
        if (!raw._metaUpdatedAt) s._metaUpdatedAt = stamp;
      }
      s.schemaVersion = SCHEMA_VERSION;
      return s;
    };

    // Stamp `_updatedAt` on every item that changed vs `prev` (same-reference items
    // skip instantly, deep-equal copies skip too), bump `_metaUpdatedAt` when the
    // settings (contexts / review day) changed, and advance the state clock.
    // Mutations build plain next-states; `upd` runs them through here — no call
    // site has to remember to stamp anything.
    const stampChanges = (prev, next) => {
      const t   = Date.now();
      const out = { ...next };
      LISTS.forEach(l => {
        const pm = new Map(((prev && prev[l]) || []).map(i => [i.id, i]));
        out[l] = (next[l] || []).map(i => {
          const p = pm.get(i.id);
          if (p === i) return i;
          if (p && JSON.stringify(p) === JSON.stringify(i)) return i;
          return { ...i, _updatedAt: t };
        });
      });
      if (prev && (JSON.stringify(prev.contexts) !== JSON.stringify(next.contexts) || prev._reviewDay !== next._reviewDay))
        out._metaUpdatedAt = t;
      out._updatedAt = t;
      return out;
    };

    // Item-level merge — the heart of multi-device sync. Union across ALL lists
    // keyed by item id; on a clash the copy with the newer `_updatedAt` wins whole
    // (fields AND which list it lives in, so moves propagate). Ties keep `a` —
    // call with local first. A tombstone kills any copy older than the deletion,
    // so deletes propagate instead of resurrecting. Two devices editing DIFFERENT
    // items concurrently now both keep their changes (v1 whole-state LWW lost one).
    const mergeStates = (a, b) => {
      const A = migrate(a) || fresh(), B = migrate(b) || fresh();
      const index = s => { const m = new Map(); LISTS.forEach(l => (s[l]||[]).forEach(i => { if (!m.has(i.id)) m.set(i.id, { i, l }); })); return m; };
      const ia = index(A), ib = index(B);
      const tombs = { ...A.tombstones };
      Object.entries(B.tombstones).forEach(([id, t]) => { if (!(tombs[id] >= t)) tombs[id] = t; });
      const out = fresh();
      const seen = new Set();
      const choose = id => {
        const ea = ia.get(id), eb = ib.get(id);
        const e  = !eb ? ea : !ea ? eb : ((eb.i._updatedAt||0) > (ea.i._updatedAt||0) ? eb : ea);
        if (!(tombs[id] > (e.i._updatedAt||0))) out[e.l].push(e.i);
      };
      LISTS.forEach(l => (A[l]||[]).forEach(i => { if (!seen.has(i.id)) { seen.add(i.id); choose(i.id); } }));
      LISTS.forEach(l => (B[l]||[]).forEach(i => { if (!seen.has(i.id)) { seen.add(i.id); choose(i.id); } }));
      const cutoff = Date.now() - TOMB_DAYS*86400000;
      out.tombstones = Object.fromEntries(Object.entries(tombs).filter(([,t]) => t >= cutoff));
      const meta = (B._metaUpdatedAt||0) > (A._metaUpdatedAt||0) ? B : A;
      out.contexts = Array.isArray(meta.contexts) && meta.contexts.length ? [...meta.contexts] : [...CONTEXTS];
      if (meta._reviewDay != null) out._reviewDay = meta._reviewDay;
      out._metaUpdatedAt = Math.max(A._metaUpdatedAt||0, B._metaUpdatedAt||0);
      out._reviewedAt    = Math.max(A._reviewedAt||0,    B._reviewedAt||0);
      out._updatedAt     = Math.max(A._updatedAt||0,     B._updatedAt||0);
      return out;
    };

    // Archive store (separate from live state so day-to-day sync stays small):
    // append-only union by id, newest first.
    const mergeArchive = (a, b) => {
      const m = new Map();
      [...(Array.isArray(a)?a:[]), ...(Array.isArray(b)?b:[])].forEach(i => { if (i && !m.has(i.id)) m.set(i.id, i); });
      return Array.from(m.values()).sort((x, y) => String(y.doneAt||y.created||"").localeCompare(String(x.doneAt||x.created||"")));
    };

    // Rotate done items older than ARCHIVE_DAYS into the archive. They're
    // tombstoned in the live state so other devices retire their copies through
    // the normal merge instead of resurrecting them. Returns null when nothing
    // needs to move.
    const splitArchive = (state, archive) => {
      const cut = new Date(Date.now() - ARCHIVE_DAYS*86400000).toISOString();
      const stay = [], go = [];
      (state.done||[]).forEach(i => ((i.doneAt||i.created||"") < cut ? go : stay).push(i));
      if (!go.length) return null;
      const t = Date.now();
      const tombs = { ...state.tombstones };
      go.forEach(i => { tombs[i.id] = t; });
      return { state: { ...state, done: stay, tombstones: tombs, _updatedAt: t },
               archive: mergeArchive(archive, go) };
    };

    // Today = a derived cross-list view, never a stored list: the actionable items
    // from TODAY_LISTS that want attention now, deduped by id with priority
    // overdue > focus > due > started, ties broken by dueTime (timed appointments
    // first). Each row carries `_list` (where it actually lives) and `_kind`.
    // Shared by TodayView, FloatToday, the sidebar badge and the Android widget
    // snapshot so the four can never drift apart.
    const TODAY_RANK = { overdue:0, focus:1, due:2, started:3 };
    const todayRows = (state, todayISO) => {
      const seen = new Set(), rows = [];
      TODAY_LISTS.forEach(l => (state[l]||[]).forEach(i => {
        if (seen.has(i.id) || isDeferred(i, todayISO)) return;   // tickler: not actionable yet
        const od    = !!(i.dueDate && i.dueDate < todayISO);
        const due   = i.dueDate === todayISO;
        const foc   = l === "next" && i.focusDate === todayISO;
        // tickler fired: its start date has arrived — surface it as on-deck
        const start = !!(i.startDate && i.startDate <= todayISO);
        if (!(od || due || foc || start)) return;
        seen.add(i.id);
        rows.push({ ...i, _list:l, _kind: od ? "overdue" : foc ? "focus" : due ? "due" : "started" });
      }));
      return rows.sort((a, b) => (TODAY_RANK[a._kind] - TODAY_RANK[b._kind])
                              || ((a.dueTime||"24:00").localeCompare(b.dueTime||"24:00")));
    };

    // ── AI ops ────────────────────────────────────────────────────
    // Claude never sees a real item id (they're floats — costly to serialize, easy to
    // mangle) and never mutates anything itself. aiProjection mints short aliases
    // (n3, p1, w2) and hands back the alias→id map; the model proposes ops against
    // those aliases; applyAiOps resolves them and folds the whole batch into ONE plain
    // next state. Stamping stays with `upd` — same division of labour as drainWidgetOps.
    const AI_OPS       = ["add","update","move","link","focus","complete","trash"];
    const AI_OPS_MAX   = 40;                                 // a runaway model may not rewrite the system
    const AI_ADD_LISTS = LISTS.filter(l => l !== "done");    // reaching done is `complete`, not `add`
    const AI_PATCH     = ["title","context","dueDate","dueTime","startDate","waitingFor","energy","time"];
    const AI_LETTER    = { inbox:"i", next:"n", projects:"p", waiting:"w", someday:"s", reference:"r", done:"d" };
    const aiIsDate     = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v||""));
    const aiIsTime     = v => /^\d{2}:\d{2}$/.test(String(v||""));

    // The one rendering of state for a prompt, and the one alias scheme. Line-oriented
    // (≈40% fewer tokens than JSON for the same fields); empty fields are omitted.
    // No raw item id ever appears in `text` — that is the point, and it is asserted.
    //   opts = { lists?, max?, doneDays?, fields?:"title" }
    const aiProjection = (state, todayISO, opts) => {
      const o     = opts || {};
      const lists = Array.isArray(o.lists) && o.lists.length ? o.lists : ["inbox","next","waiting","projects","someday"];
      const max   = o.max > 0 ? o.max : 120;
      const brief = o.fields === "title";
      const names = projIndex(state);
      const refs = {}, counts = {}, out = [];
      let truncated = false;
      const src = {};
      lists.forEach(l => {
        let all = state[l] || [];
        if (l === "done" && o.doneDays > 0) {
          const cut = Date.now() - o.doneDays * 86400000;
          all = all.filter(i => i.doneAt && new Date(i.doneAt).getTime() >= cut);
        }
        counts[l] = all.length;
        if (all.length > max) truncated = true;
        src[l] = all.slice(0, max);
      });
      // alias every shown item first, so a linked action can point at its project's alias
      const alias = new Map();
      lists.forEach(l => src[l].forEach((i, k) => { if (!alias.has(i.id)) alias.set(i.id, (AI_LETTER[l]||"x") + (k+1)); }));
      lists.forEach(l => {
        if (!src[l].length) return;
        out.push("## " + l + (counts[l] > src[l].length ? ` (showing ${src[l].length} of ${counts[l]})` : ""));
        src[l].forEach((i, k) => {
          const a = (AI_LETTER[l]||"x") + (k+1);
          refs[a] = i.id;
          const f = [a, (i.title||"").trim()];
          if (!brief) {
            if (i.context && i.context !== "@anywhere") f.push(i.context);
            if (i.dueDate)    f.push("due " + i.dueDate + (i.dueTime ? " " + i.dueTime : ""));
            if (i.startDate)  f.push("start " + i.startDate);
            if (i.waitingFor) f.push("for:" + i.waitingFor);
            if (todayISO && i.focusDate === todayISO) f.push("focus");
            if (i.projectId)  f.push("proj " + (alias.get(i.projectId) || names.get(i.projectId) || "?"));
            const et = [i.energy ? "E:"+i.energy : "", i.time ? "T:"+i.time : ""].filter(Boolean).join(" ");
            if (et) f.push(et);
          }
          out.push(f.join(" | "));
        });
      });
      return { refs, text: out.join("\n"), counts, truncated };
    };

    // Fold a batch of model-proposed ops into ONE plain next state. Unknown or
    // unapplicable ops are SKIPPED with a reason — nothing throws, so a half-wrong
    // batch still applies its good half. A batch that changes nothing returns the
    // input state BY REFERENCE, so the caller can skip upd (the `n === cur` idiom).
    //   opts = { refs:{alias:id}, todayISO }
    // → { state, results:[{i, op, ok, reason?, effect?, clamped}], applied, skipped }
    const applyAiOps = (state, ops, opts) => {
      const o       = opts || {};
      const today   = o.todayISO || "";
      const refs    = { ...(o.refs || {}) };       // working map — `as` registers new items
      const results = [];
      if (!Array.isArray(ops)) return { state, results, applied:0, skipped:0 };
      let n = state;

      const ctxOf = raw => {
        const list = Array.isArray(state.contexts) && state.contexts.length ? state.contexts : CONTEXTS;
        const key  = String(raw||"").trim().toLowerCase();
        return list.find(c => String(c).toLowerCase() === key) || "";
      };
      // alias first, then a raw-id string match — the same string comparison the
      // Kotlin widget bridge uses, because ids cross both boundaries as strings.
      const find = ref => {
        const key = String(ref == null ? "" : ref);
        if (!key) return null;
        const id  = refs[key];
        for (const l of LISTS) {
          const arr = n[l] || [];
          const k = id !== undefined ? arr.findIndex(x => x.id === id)
                                     : arr.findIndex(x => String(x.id) === key);
          if (k >= 0) return { list:l, idx:k, item:arr[k] };
        }
        return null;
      };
      const projOf = (raw, clamped) => {
        if (raw === "" || raw == null) return "";                      // explicit unlink
        const hit = find(raw);
        if (hit && (hit.list === "projects" || hit.list === "someday")) return hit.item.id;
        const key = String(raw).trim().toLowerCase();
        const m   = ["projects","someday"].reduce((a,l) => a.concat(n[l]||[]), [])
                      .find(x => (x.title||"").trim().toLowerCase() === key);
        if (m) return m.id;
        clamped.push("project");
        return null;                                                   // unresolved is not the same as unlink
      };
      // Copy whitelisted fields across, dropping anything malformed instead of
      // rejecting the whole op — a bad date should not cost you a good action.
      const patch = (src, into, clamped) => {
        AI_PATCH.forEach(f => {
          if (!(f in src)) return;
          let v = src[f];
          if (f === "title")        { v = String(v||"").trim().slice(0,200); if (!v) return; }
          else if (f === "context") { const c = ctxOf(v); if (!c) { clamped.push("context"); return; } v = c; }
          else if (f === "dueDate" || f === "startDate") { v = String(v||""); if (v && !aiIsDate(v)) { clamped.push(f); return; } }
          else if (f === "dueTime") { v = String(v||""); if (v && !aiIsTime(v)) { clamped.push(f); return; } }
          else if (f === "energy")  { v = String(v||""); if (v && ENERGIES.indexOf(v) < 0) { clamped.push(f); return; } }
          else if (f === "time")    { v = String(v||""); if (v && TIMES.indexOf(v) < 0)    { clamped.push(f); return; } }
          else v = String(v||"");
          into[f] = v;
        });
        if (!into.dueDate) into.dueTime = "";     // a bare time is meaningless (mirrors the add form)
      };
      const put  = (list, idx, item) => { const a = [...(n[list]||[])]; a[idx] = item; n = { ...n, [list]: a }; };
      const pull = (list, idx)       => { n = { ...n, [list]: (n[list]||[]).filter((_,k) => k !== idx) }; };

      ops.forEach((op, i) => {
        const clamped = [];
        const skip = reason => { results.push({ i, op:(op && op.op) || "", ok:false, reason, clamped }); };
        const done = effect => { results.push({ i, op:op.op, ok:true, effect, clamped }); };
        if (i >= AI_OPS_MAX)                              return skip("too-many");
        if (!op || typeof op !== "object" || typeof op.op !== "string") return skip("bad-shape");
        if (AI_OPS.indexOf(op.op) < 0)                    return skip("unknown-op");

        if (op.op === "add") {
          const list = AI_ADD_LISTS.indexOf(String(op.list||"")) >= 0 ? String(op.list) : "";
          if (!list) return skip("no-such-list");
          const title = String(op.title||"").trim().slice(0,200);
          if (!title) return skip("empty-title");
          const it = mk(title);
          patch(op, it, clamped);
          it.title = title;
          if ("project" in op) { const p = projOf(op.project, clamped); it.projectId = p == null ? "" : p; }
          n = { ...n, [list]: [it, ...(n[list]||[])] };
          if (op.as) refs[String(op.as)] = it.id;          // later ops in this batch can reference it
          return done(`add → ${list}: ${title}`);
        }

        const hit = find(op.ref);
        if (!hit) return skip("no-such-item");
        const was = hit.item, name = (was.title||"").trim();

        if (op.op === "trash") {
          pull(hit.list, hit.idx);
          n = { ...n, tombstones: { ...n.tombstones, [was.id]: Date.now() } };   // or it resurrects from a peer
          return done(`trash: ${name}`);
        }
        if (op.op === "complete") {
          if (hit.list === "done") return skip("noop");
          pull(hit.list, hit.idx);
          n = { ...n, done: [{ ...was, doneAt: ts() }, ...(n.done||[])] };
          return done(`complete: ${name}`);
        }
        if (op.op === "focus") {
          if (hit.list !== "next") return skip("wrong-list");
          const want = op.on === false ? "" : today;
          if ((was.focusDate||"") === want) return skip("noop");
          put(hit.list, hit.idx, { ...was, focusDate: want });
          return done(want ? `focus today: ${name}` : `unfocus: ${name}`);
        }
        if (op.op === "link") {
          const p = projOf(op.project, clamped);
          if (p == null) return skip("no-such-project");
          if ((was.projectId||"") === (p||"")) return skip("noop");
          put(hit.list, hit.idx, { ...was, projectId: p });
          return done(p ? `link: ${name} → ${projIndex(n).get(p) || "project"}` : `unlink: ${name}`);
        }

        const next = { ...was };
        patch(op, next, clamped);
        if ("project" in op) { const p = projOf(op.project, clamped); if (p != null) next.projectId = p; }
        if (op.op === "update") {
          if (sameState(next, was)) return skip("noop");
          put(hit.list, hit.idx, next);
          return done(`update: ${(next.title||"").trim()}`);
        }
        // move
        const to = LISTS.indexOf(String(op.to||"")) >= 0 ? String(op.to) : "";
        if (!to) return skip("no-such-list");
        if (to === hit.list) {
          if (sameState(next, was)) return skip("noop");
          put(hit.list, hit.idx, next);
          return done(`update: ${(next.title||"").trim()}`);
        }
        pull(hit.list, hit.idx);
        if (to === "done") next.doneAt = ts();
        n = { ...n, [to]: [next, ...(n[to]||[])] };
        return done(`${(next.title||"").trim()} → ${to}`);
      });

      const applied = results.filter(r => r.ok).length;
      return { state: n, results, applied, skipped: results.length - applied };
    };
    // ═══ END DATA CORE ═══════════════════════════════════════════

    // ── Storage: offline-first ────────────────────────────────────
    // localStorage is the source of truth on every device (instant, works with
    // no server). The Flask /api/state endpoint is an OPTIONAL sync hub used
    // only when reachable (same PC / LAN / Tailscale). Reconciliation is
    // last-write-wins on a state-level `_updatedAt` timestamp.
    const LS_KEY  = "gtd_state_v1";     // key name is historical; content is migrated to schema v2 on read
    const LS_ARCH = "gtd_archive_v1";
    const Store = {
      loadLocal() {
        try { const s = localStorage.getItem(LS_KEY); return s ? migrate(JSON.parse(s)) : null; }
        catch { return null; }
      },
      saveLocal(d) {
        try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch {}
      },
      loadArchive() {
        try { const s = localStorage.getItem(LS_ARCH); const a = s ? JSON.parse(s) : []; return Array.isArray(a) ? a : []; }
        catch { return []; }
      },
      saveArchive(a) {
        try { localStorage.setItem(LS_ARCH, JSON.stringify(a)); } catch {}
      },
      async _get(url, timeout=2000) {
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), timeout);
          const r = await fetch(url, { signal: ctrl.signal });
          clearTimeout(t);
          if (!r.ok) return null;
          return await r.json();
        } catch { return null; }
      },
      _post(url, d) {
        try {
          fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(d),
            keepalive: true,
          }).catch(() => {});
        } catch {}
      },
      async fetchServer(timeout=2000) {
        const d = await this._get("api/state", timeout);
        return (d && Object.keys(d).length) ? migrate(d) : null;
      },
      pushServer(d) { this._post("api/state", d); },
      async fetchServerArchive(timeout=2000) {
        const d = await this._get("api/archive", timeout);
        return Array.isArray(d) ? d : null;
      },
      pushServerArchive(a) { this._post("api/archive", a); },
    };
    // ── OneDrive (Microsoft Graph) — optional cloud remote ───────
    // Lets every device (incl. the phone) sync the same gtd_state.json straight
    // to the user's personal OneDrive with NO server, via the Graph API. Paste
    // your Azure SPA "Application (client) ID" below — it's a PUBLIC SPA client
    // id (not a secret), safe to commit/deploy. Blank ⇒ cloud sync stays off and
    // the app behaves exactly as before. One-time app registration: see README.
    const MS_CLIENT_ID = "32ffb869-e304-4742-829e-867300ff0818";
    const MS_AUTHORITY = "https://login.microsoftonline.com/consumers";  // personal MS accounts
    const MS_SCOPES    = ["Files.ReadWrite.AppFolder"];                  // only the app's own folder
    const OD_FLAG      = "gtd_onedrive_enabled";
    const GRAPH_ITEM   = "https://graph.microsoft.com/v1.0/me/drive/special/approot:/gtd_state.json";
    const GRAPH_ARCH   = "https://graph.microsoft.com/v1.0/me/drive/special/approot:/gtd_archive.json";

    const Drive = {
      _msal: null,
      _etag: null,       // gtd_state.json
      _archEtag: null,   // gtd_archive.json
      available() { return !!MS_CLIENT_ID && typeof msal !== "undefined"; },
      enabled()   { try { return localStorage.getItem(OD_FLAG) === "1"; } catch { return false; } },
      init() {
        if (this._msal || !this.available()) return this._msal;
        this._msal = new msal.PublicClientApplication({
          auth:  { clientId: MS_CLIENT_ID, authority: MS_AUTHORITY, redirectUri: location.origin + location.pathname },
          cache: { cacheLocation: "localStorage" },
        });
        return this._msal;
      },
      account() {
        const m = this.init(); if (!m) return null;
        const all = m.getAllAccounts();
        return all && all.length ? all[0] : null;
      },
      async connect() {
        const m = this.init(); if (!m) return null;
        const res = await m.loginPopup({ scopes: MS_SCOPES, prompt: "select_account" });
        if (res && res.account) { m.setActiveAccount(res.account); try { localStorage.setItem(OD_FLAG, "1"); } catch {} }
        return this.account();
      },
      async disconnect() {
        try { localStorage.removeItem(OD_FLAG); } catch {}
        this._etag = null;
        const m = this.init(); const acct = this.account();
        if (m && acct) { try { await m.logoutPopup({ account: acct }); } catch {} }
      },
      async _token() {
        const m = this.init(); const acct = this.account();
        if (!m || !acct) throw new Error("not connected");
        try   { return (await m.acquireTokenSilent({ scopes: MS_SCOPES, account: acct })).accessToken; }
        catch { return (await m.acquireTokenPopup ({ scopes: MS_SCOPES, account: acct })).accessToken; }
      },
      // → { data, etag }; data null when the file doesn't exist yet. null on any failure.
      async _pullFile(url, etagKey) {
        if (!this.available() || !this.enabled() || !this.account()) return null;
        try {
          const tok  = await this._token();
          const auth = { Authorization: "Bearer " + tok };
          const meta = await fetch(url, { headers: auth });
          if (meta.status === 404) { this[etagKey] = null; return { data: null, etag: null }; }
          if (!meta.ok) return null;
          const item = await meta.json();
          this[etagKey] = item.eTag || null;
          const body = await fetch(url + ":/content", { headers: auth });
          if (!body.ok) return null;
          const data = await body.json();
          return { data, etag: this[etagKey] };
        } catch { return null; }
      },
      async _putFile(url, etagKey, d) {
        const tok = await this._token();
        const headers = { Authorization: "Bearer " + tok, "Content-Type": "application/json" };
        if (this[etagKey]) headers["If-Match"] = this[etagKey];
        const r = await fetch(url + ":/content", { method: "PUT", headers, body: JSON.stringify(d) });
        if (r.ok) { const item = await r.json(); this[etagKey] = item.eTag || this[etagKey]; }
        return r;
      },
      async pull() {
        const res = await this._pullFile(GRAPH_ITEM, "_etag");
        if (!res) return null;
        return { data: migrate(res.data), etag: res.etag };
      },
      async pullArchive() {
        const res = await this._pullFile(GRAPH_ARCH, "_archEtag");
        if (!res) return null;
        return { data: Array.isArray(res.data) ? res.data : null, etag: res.etag };
      },
      // Conflict-safe write (If-Match on eTag). On 412 (someone wrote first) the
      // remote is pulled, MERGED item-by-item with ours, and the merge is written
      // back — nobody's edits are lost. → { ok, merged? }: `merged` is set when a
      // conflict merge produced a state the caller should adopt locally.
      async push(d, retry = true) {
        if (!this.available() || !this.enabled() || !this.account()) return { ok: false };
        try {
          // NEVER blind-write. No eTag means we have not read the remote in this
          // session, so _putFile would send no If-Match and unconditionally clobber
          // whatever is there — which is how a freshly installed device (empty
          // localStorage, nothing pulled yet) can erase every other device's data.
          // Read first, merge, then write. A read failure means we refuse to write.
          if (!this._etag && retry) {
            const remote = await this.pull();
            if (!remote) return { ok: false };            // couldn't read → don't risk it
            // Merge unconditionally, never branching on the eTag: when the file is
            // absent pull() hands back a fresh() doc and the union is just `d`, so
            // creating it still destroys nothing — and a file that exists but reports
            // no eTag can't slip through into a blind overwrite.
            const merged = mergeStates(d, remote.data);
            const res    = await this.push(merged, false);
            return res.ok ? { ok: true, merged } : { ok: false };
          }
          const r = await this._putFile(GRAPH_ITEM, "_etag", d);
          if (r.status === 412 && retry) {
            const remote = await this.pull();              // refreshes this._etag
            const merged = remote && remote.data ? mergeStates(d, remote.data) : d;
            const res    = await this.push(merged, false);
            return res.ok ? { ok: true, merged } : { ok: false };
          }
          return { ok: r.ok };
        } catch { return { ok: false }; }
      },
      async pushArchive(a, retry = true) {
        if (!this.available() || !this.enabled() || !this.account()) return { ok: false };
        try {
          // same no-blind-write rule as push() — the archive is just as clobberable
          if (!this._archEtag && retry) {
            const remote = await this.pullArchive();
            if (!remote) return { ok: false };
            const merged = mergeArchive(a, remote.data);
            const res    = await this.pushArchive(merged, false);
            return res.ok ? { ok: true, merged } : { ok: false };
          }
          const r = await this._putFile(GRAPH_ARCH, "_archEtag", a);
          if (r.status === 412 && retry) {
            const remote = await this.pullArchive();       // refreshes this._archEtag
            const merged = mergeArchive(a, remote && remote.data);
            const res    = await this.pushArchive(merged, false);
            return res.ok ? { ok: true, merged } : { ok: false };
          }
          return { ok: r.ok };
        } catch { return { ok: false }; }
      },
    };

    // ── Android home-screen widget bridge ────────────────────────
    // Present only inside the Android wrapper APK (see android/), which injects an
    // `AndroidWidget` object into the WebView. The widget runs in a different process
    // and cannot read this WebView's localStorage, so the contract is asymmetric:
    //   • we PUBLISH a small read-only snapshot of Today after every state change;
    //   • the widget ENQUEUES intents (complete / capture / focus) which we drain and
    //     apply through the normal mutation path.
    // Kotlin never mutates GTD state — stamping, item-level merge, tombstones and
    // OneDrive sync all stay here, in one place. No-ops in a normal browser.
    const WIDGET_ROWS_MAX = 25;
    const WidgetBridge = {
      available: () => typeof AndroidWidget !== "undefined" && AndroidWidget !== null,
      // ids are floats (Date.now()+Math.random()) — stringify them so Kotlin can round-trip
      // them without losing precision, and compare as strings on the way back.
      snapshot(state, todayISO, pnameOf) {
        const rows = todayRows(state, todayISO);
        return {
          v: 2, at: Date.now(),
          counts: { inbox:   (state.inbox||[]).length,
                    next:    (state.next||[]).length,
                    waiting: (state.waiting||[]).length,
                    today:   rows.length,
                    overdue: rows.filter(r => r._kind === "overdue").length },
          rows: rows.slice(0, WIDGET_ROWS_MAX).map(i => ({
            id: String(i.id), title: (i.title||"").slice(0, 140), kind: i._kind, list: i._list,
            due: dueLabel(i.dueDate, i.dueTime), project: pnameOf(i) || "",
            // only Next Actions carry today's focus star (same rule as TodayView)
            canFocus: i._list === "next",
            focused:  i._list === "next" && i.focusDate === todayISO,
          })),
        };
      },
      publish(state, todayISO, pnameOf) {
        if (!this.available()) return;
        try { AndroidWidget.publish(JSON.stringify(this.snapshot(state, todayISO, pnameOf))); } catch {}
      },
      // → [{op:"complete"|"capture"|"focus", id?, text?}]; the Kotlin side clears the queue
      drain() {
        if (!this.available()) return [];
        try { const a = JSON.parse(AndroidWidget.takePending() || "[]"); return Array.isArray(a) ? a : []; }
        catch { return []; }
      },
      // lets HeadlessSyncWorker tear its offscreen WebView down as soon as we're synced
      ready() { if (this.available()) { try { AndroidWidget.notifyReady(); } catch {} } },
    };

    // ── Claude (Anthropic Messages API) — optional, browser-direct ───────────
    // Same shape as Drive: the browser talks to the vendor API itself so the phone
    // and the GitHub Pages mirror work with no server. `anthropic-dangerous-direct-
    // browser-access` is what opts the API into sending CORS headers — without it the
    // preflight fails. That means the key lives in THIS DEVICE's localStorage, so it
    // is deliberately kept out of `items`: gtd_state_v1 goes to OneDrive, to the hub,
    // and into every exported backup, and an API key must reach none of those.
    // Use a dedicated key with a spend limit set in the Anthropic Console.
    const AI_KEY_LS  = "gtd_anthropic_key";      // device-local, like OD_FLAG
    const AI_URL     = "https://api.anthropic.com/v1/messages";
    const AI_MODEL   = "claude-opus-5";
    const AI_VERSION = "2023-06-01";
    const AI_TIMEOUT = 90000;

    const Ai = {
      key()     { try { return localStorage.getItem(AI_KEY_LS) || ""; } catch { return ""; } },
      enabled() { return !!this.key(); },
      setKey(k) {
        try { const v = (k||"").trim(); v ? localStorage.setItem(AI_KEY_LS, v) : localStorage.removeItem(AI_KEY_LS); }
        catch {}
      },
      masked()  { const k = this.key(); return k ? k.slice(0,7) + "…" + k.slice(-4) : ""; },
      online()  { return typeof navigator === "undefined" || navigator.onLine !== false; },
      _headers() {
        return {
          "content-type": "application/json",
          "x-api-key": this.key(),
          "anthropic-version": AI_VERSION,
          "anthropic-dangerous-direct-browser-access": "true",
        };
      },
      // Errors never escape into React (same contract as Drive): every failure comes
      // back as {ok:false, code, msg}. `code` is what the UI branches on.
      _fail(code, msg, extra) { return { ok:false, code, msg, ...(extra||{}) }; },
      async _err(res) {
        let detail = "";
        try { const b = await res.json(); detail = (b && b.error && b.error.message) || ""; } catch {}
        if (res.status === 401) return this._fail("auth", "That API key was rejected. Check it in Sync & Backup → Claude.");
        if (res.status === 403) return this._fail("perm", "This key isn't allowed to call the Messages API.");
        if (res.status === 429) {
          const ra = res.headers.get("retry-after");
          return this._fail("rate", ra ? `Rate limited — try again in ${ra}s.` : "Rate limited — try again shortly.", { retryAfter: ra });
        }
        if (res.status === 400) return this._fail("bad-request", detail || "The request was rejected.");
        if (res.status === 529 || res.status === 503) return this._fail("overloaded", "Claude is busy right now — try again shortly.");
        if (res.status >= 500) return this._fail("server", "Anthropic had a server error.");
        return this._fail("http", detail || `Request failed (${res.status}).`);
      },
      // → {ok:true, msg} | {ok:false, code, msg}
      async send(body, o) {
        const opt = o || {};
        if (!this.enabled()) return this._fail("no-key", "No API key set.");
        if (!this.online())  return this._fail("offline", "Offline — Claude needs a connection.");
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), opt.timeout || AI_TIMEOUT);
        const onOuter = () => ctrl.abort();
        if (opt.signal) opt.signal.addEventListener("abort", onOuter);
        try {
          const res = await fetch(AI_URL, { method:"POST", headers:this._headers(), body:JSON.stringify(body), signal:ctrl.signal });
          if (!res.ok) return await this._err(res);
          return { ok:true, msg: await res.json() };
        } catch (e) {
          if (opt.signal && opt.signal.aborted) return this._fail("cancelled", "Cancelled.");
          if (e && e.name === "AbortError")     return this._fail("timeout", "Timed out waiting for Claude.");
          // A stripped CORS preflight (proxy, VPN, content blocker) is indistinguishable
          // from being offline here, so the message has to name both possibilities.
          return this._fail("network", "Couldn't reach the API — offline, or the request was blocked.");
        } finally {
          clearTimeout(timer);
          if (opt.signal) opt.signal.removeEventListener("abort", onOuter);
        }
      },
      // Structured (non-chat) call. Checks stop_reason BEFORE parsing, so a refusal or
      // a truncated answer reports itself instead of surfacing as a bogus JSON error.
      // → {ok:true, data, usage} | {ok:false, code, msg}
      async structured(body, o) {
        const r = await this.send(body, o);
        if (!r.ok) return r;
        const m = r.msg || {};
        if (m.stop_reason === "refusal")    return this._fail("refusal", "Claude declined that request.");
        if (m.stop_reason === "max_tokens") return this._fail("truncated", "The answer was cut off — try a narrower scope.");
        const blocks = Array.isArray(m.content) ? m.content.filter(b => b && b.type === "text") : [];
        const text   = blocks.length ? blocks[blocks.length - 1].text : "";
        try { return { ok:true, data: JSON.parse(text), usage: m.usage || null }; }
        catch { return this._fail("parse", "Claude's answer wasn't valid JSON."); }
      },
      // Streaming chat. Yields {t:"text"} chunks, then one {t:"done"}.
      async *stream(body, o) {
        const opt = o || {};
        if (!this.enabled()) { yield { t:"error", ...this._fail("no-key", "No API key set.") }; return; }
        if (!this.online())  { yield { t:"error", ...this._fail("offline", "Offline — Claude needs a connection.") }; return; }
        let res;
        try {
          res = await fetch(AI_URL, { method:"POST", headers:this._headers(),
                                      body:JSON.stringify({ ...body, stream:true }), signal:opt.signal });
        } catch (e) {
          yield { t:"error", ...(opt.signal && opt.signal.aborted
            ? this._fail("cancelled", "Cancelled.")
            : this._fail("network", "Couldn't reach the API — offline, or the request was blocked.")) };
          return;
        }
        if (!res.ok)   { yield { t:"error", ...(await this._err(res)) }; return; }
        if (!res.body) {                                   // very old WebView: fall back whole
          const r = await this.send(body, opt);
          if (!r.ok) { yield { t:"error", ...r }; return; }
          const b = (r.msg.content||[]).filter(x => x.type === "text");
          if (b.length) yield { t:"text", text: b[b.length-1].text };
          yield { t:"done", stopReason: r.msg.stop_reason, usage: r.msg.usage };
          return;
        }
        const reader = res.body.getReader(), dec = new TextDecoder();
        let buf = "", stopReason = null, usage = null;
        try {
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream:true });
            const lines = buf.split("\n");
            buf = lines.pop();                              // keep the partial line
            for (const line of lines) {
              if (!line.startsWith("data:")) continue;
              const raw = line.slice(5).trim();
              if (!raw || raw === "[DONE]") continue;
              let ev; try { ev = JSON.parse(raw); } catch { continue; }
              if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") {
                yield { t:"text", text: ev.delta.text };    // thinking_delta is ignored on purpose
              } else if (ev.type === "message_delta") {
                stopReason = (ev.delta && ev.delta.stop_reason) || stopReason;
                usage = ev.usage || usage;
              } else if (ev.type === "error") {
                yield { t:"error", ...this._fail("stream", (ev.error && ev.error.message) || "Stream error.") };
                return;
              }
            }
          }
        } catch (e) {
          yield { t:"error", ...(opt.signal && opt.signal.aborted
            ? this._fail("cancelled", "Cancelled.")
            : this._fail("network", "The connection dropped mid-answer.")) };
          return;
        }
        yield { t:"done", stopReason, usage };
      },
      // Cheapest possible round trip — proves the key and the CORS path in one click.
      async ping() {
        const r = await this.send({ model:AI_MODEL, max_tokens:1, thinking:{ type:"disabled" },
                                    output_config:{ effort:"low" },
                                    messages:[{ role:"user", content:"hi" }] }, { timeout:20000 });
        return r.ok ? { ok:true } : r;   // stop_reason max_tokens is expected and fine
      },
    };

    // ── The four AI tasks ────────────────────────────────────────────────────
    // Every structured task returns { ok, data, refs } where `data.ops` is fed to
    // applyAiOps against `refs`. The op enum below is DERIVED from AI_OPS so the
    // schema and the applier cannot drift (there's a test pinning that).
    const AI_OP_SCHEMA = {
      type: "object", additionalProperties: false, required: ["op"],
      properties: {
        op:      { type:"string", enum: AI_OPS },
        ref:     { type:"string", description:"Alias of an existing item (n3, p1, w2). Required for every op except add." },
        as:      { type:"string", description:"Temporary alias for an item you are adding, so a later op in this same batch can reference it." },
        list:    { type:"string", enum: AI_ADD_LISTS, description:"Where an added item goes." },
        to:      { type:"string", enum: LISTS, description:"Destination list for move." },
        title:   { type:"string" },
        project: { type:"string", description:"Alias (p2) or the exact title of an existing project. \"\" unlinks." },
        context: { type:"string", description:"Must be one of the user's existing contexts." },
        dueDate: { type:"string", description:"YYYY-MM-DD. Only a real deadline the user actually stated." },
        dueTime: { type:"string", description:"HH:MM, 24h. Only with dueDate, and only for a true appointment." },
        startDate:{ type:"string", description:"YYYY-MM-DD. Tickler — hides the item until that day." },
        waitingFor:{ type:"string", description:"Who the item is blocked on." },
        energy:  { type:"string", enum: ["", ...ENERGIES] },
        time:    { type:"string", enum: ["", ...TIMES] },
        on:      { type:"boolean", description:"focus on/off" },
        why:     { type:"string", description:"At most 12 words. Shown to the user beside the proposed change." },
      },
    };

    // Structured outputs support only a SUBSET of JSON Schema: no maxItems, maxLength,
    // pattern, minimum/maximum or oneOf, and additionalProperties must be false. A cap
    // therefore lives in `description` (advisory) and in applyAiOps' AI_OPS_MAX (binding).
    // Hoisted to module level so a test can assert no unsupported keyword creeps back in.
    const AI_SCHEMAS = {
      clarify: {
        type:"object", additionalProperties:false, required:["actionable","reasoning","ops"],
        properties: {
          actionable: { type:"boolean" },
          reasoning:  { type:"string", description:"One short sentence, shown to the user." },
          ops:        { type:"array", items: AI_OP_SCHEMA, description:"At most 6 ops." },
        },
      },
      breakdown: {
        type:"object", additionalProperties:false, required:["outcome","nextAction","ops"],
        properties: {
          outcome:    { type:"string", description:"What 'done' looks like, in one sentence." },
          nextAction: { type:"string", description:"The single very next physical action." },
          ops:        { type:"array", items: AI_OP_SCHEMA, description:"At most 12 ops." },
        },
      },
      review: {
        type:"object", additionalProperties:false, required:["headline","observations","ops"],
        properties: {
          headline: { type:"string", description:"One sentence on the health of the system." },
          observations: { type:"array", description:"At most 6 observations.", items: {
            type:"object", additionalProperties:false, required:["phase","text"],
            properties: {
              phase: { type:"string", enum:["clear","current","creative"] },
              text:  { type:"string" },
              refs:  { type:"array", items:{ type:"string" } },
            } } },
          ops: { type:"array", items: AI_OP_SCHEMA, description:"At most 20 ops." },
        },
      },
    };

    // Frozen across calls of the same task — this is the only part worth caching.
    const AI_GTD_RULES = [
      "You are a Getting Things Done (GTD) assistant embedded in the user's own trusted system.",
      "You never change anything yourself: you propose ops, the user reviews them, the app applies them.",
      "",
      "Lists and what they mean:",
      "- inbox: captured, not yet decided. Nothing stays here.",
      "- next: a physical, visible action that can be started right now. Not a topic, not a goal.",
      "- projects: an outcome needing more than one action. A project is not an action.",
      "- waiting: delegated or blocked on someone else. Always set waitingFor.",
      "- someday: worth doing, not now. No due date.",
      "- reference: not actionable, kept for lookup.",
      "",
      "Hard rules:",
      "- Reference existing items ONLY by the aliases you were shown. Never invent one.",
      "- Use only contexts from the user's list. If none fits, omit context.",
      "- Never invent a due date. A due date is a real external deadline, not a wish.",
      "- Start a next action with a verb: 'Email Lan the draft', not 'Lan / draft'.",
      "- Keep `why` under 12 words.",
    ].join("\n");

    const aiSys = (rules, projection, cache) => {
      const blocks = [{ type:"text", text: rules }];
      if (cache) blocks[0].cache_control = { type:"ephemeral" };
      if (projection) blocks.push({ type:"text", text: projection });
      return blocks;
    };
    const aiCtxLine = state => "The user's contexts: " + ((state.contexts||CONTEXTS).join(", "));

    const AiTasks = {
      // 1. Clarify one inbox item into its GTD outcome.
      async clarify(state, item, todayISO, o) {
        const p = aiProjection(state, todayISO, { lists:["projects","someday"], fields:"title" });
        const rules = AI_GTD_RULES + "\n\n" + [
          "TASK: clarify ONE captured item.",
          "Decide what it is, then propose the ops that put it where it belongs.",
          "The outcome is exactly one of: trash it, file it as reference, park it in someday,",
          "make it a single next action, or make it a project WITH exactly one first next action",
          "(add the project with `as`, then add that one action with project set to that alias).",
          "If it is already a fine next action, say so and propose the ops that sharpen it.",
          "Set `actionable` false only when the item needs no action at all.",
        ].join("\n");
        const r = await Ai.structured({
          model: AI_MODEL, max_tokens: 2000,
          thinking: { type:"adaptive" },
          output_config: { effort:"low", format: { type:"json_schema", schema: AI_SCHEMAS.clarify } },
          system: aiSys(rules, aiCtxLine(state) + "\n\nExisting projects:\n" + (p.text || "(none)"), true),
          messages: [{ role:"user", content:
            `Today is ${todayISO}.\nThe captured item is alias ${o.ref}: "${(item.title||"").trim()}"` }],
        }, o);
        return r.ok ? { ...r, refs: { ...p.refs, [o.ref]: item.id } } : r;
      },

      // 2. Break a project down — deliberately ONE next action.
      async breakdown(state, proj, todayISO, o) {
        const linked = LISTS.filter(l => l!=="done")
          .reduce((a,l) => a.concat((state[l]||[]).filter(i => i.projectId === proj.id).map(i => `- [${l}] ${i.title}`)), []);
        const rules = AI_GTD_RULES + "\n\n" + [
          "TASK: get this project moving.",
          "State the outcome, name the single very next physical action, then propose ops.",
          "Emit EXACTLY ONE `add` into `next`, always with project set to the project's alias.",
          "Later steps belong in `someday` linked to the same project, or in the outcome text —",
          "a Next Actions list stuffed with not-yet-actionable steps is the classic GTD failure.",
          "If the project is already blocked on a person, propose a `waiting` item instead.",
        ].join("\n");
        const r = await Ai.structured({
          model: AI_MODEL, max_tokens: 3000,
          thinking: { type:"adaptive" },
          output_config: { effort:"medium", format: { type:"json_schema", schema: AI_SCHEMAS.breakdown } },
          system: aiSys(rules, aiCtxLine(state), false),
          messages: [{ role:"user", content:
            `Today is ${todayISO}.\nProject alias p1: "${(proj.title||"").trim()}"` +
            (proj.dueDate ? `\nDue ${proj.dueDate}` : "") +
            `\n\nAlready linked to it:\n${linked.length ? linked.join("\n") : "(nothing — this project is stalled)"}` }],
        }, o);
        return r.ok ? { ...r, refs: { p1: proj.id } } : r;
      },

      // 3. Weekly Review coach. The app already COUNTED everything — Claude judges.
      async review(state, facts, todayISO, o) {
        const p = aiProjection(state, todayISO, { lists:["inbox","next","waiting","projects","someday"], max:120 });
        const rules = AI_GTD_RULES + "\n\n" + [
          "TASK: coach this Weekly Review.",
          "The counts below were computed by the app and are correct — do not recount them,",
          "and do not simply read them back. Your job is the judgement the numbers can't make:",
          "which stalled project actually matters this week, which next actions are really",
          "projects in disguise, who needs chasing, what should be let go, where to focus.",
          "Every observation must name the aliases it is about.",
          "Propose only ops you are confident about — an unwanted op costs the user more",
          "than a missing one. Zero ops is a perfectly good answer.",
        ].join("\n");
        const r = await Ai.structured({
          model: AI_MODEL, max_tokens: 8000,
          thinking: { type:"adaptive", display:"summarized" },
          output_config: { effort:"high", format: { type:"json_schema", schema: AI_SCHEMAS.review } },
          system: aiSys(rules, aiCtxLine(state) + "\n\n" + p.text, false),
          messages: [{ role:"user", content: `Today is ${todayISO}.\n\nCounts the app computed:\n${facts}` }],
        }, { timeout: 180000, ...(o||{}) });
        return r.ok ? { ...r, refs: p.refs, truncated: p.truncated } : r;
      },

      // 4. Chat — read-only by contract, so no ops and no schema.
      chatBody(state, history, todayISO) {
        const p = aiProjection(state, todayISO, { lists:["inbox","next","waiting","projects","someday"], max:120 });
        const rules = AI_GTD_RULES + "\n\n" + [
          "TASK: answer questions about the user's system.",
          "You CANNOT change anything here. If asked to, name the button to press, or point",
          "them at Clarify (in Process) or Break down (on a project card).",
          "Answer from the data you were given. Say plainly when something isn't in it.",
          "Be short. This is a sidebar, not an essay.",
        ].join("\n");
        return {
          model: AI_MODEL, max_tokens: 4000,
          thinking: { type:"adaptive", display:"summarized" },
          output_config: { effort:"medium" },
          system: aiSys(rules, aiCtxLine(state) + "\n\nToday is " + todayISO + "\n\n" + p.text, true),
          messages: history.slice(-24),
        };
      },
    };

    // ── Data portability: export / import a JSON backup ──────────
    // Offline, server-free way to move data between devices and to back it up.
    // Export → a downloadable (or shareable, on mobile) gtd-backup-*.json file
    // holding the live state PLUS the archive. Import → MERGE or REPLACE.
    const exportData = data => {
      const payload = JSON.stringify(data, null, 2);
      const fname   = `gtd-backup-${new Date().toISOString().slice(0,10)}.json`;
      const blob    = new Blob([payload], { type: "application/json" });
      const file    = (typeof File !== "undefined") ? new File([blob], fname, { type:"application/json" }) : null;
      // Mobile: native share sheet (AirDrop / Nearby / messaging) when it can share files.
      if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
        navigator.share({ files:[file], title:"GTD backup" }).catch(() => {});
        return;
      }
      const url = URL.createObjectURL(blob);
      const a   = document.createElement("a");
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    const placeFor = l => ({ inbox:"Capture…", next:"Next action…  (type [Project] to link one)", projects:"Project outcome…", waiting:"Waiting for…", someday:"Someday idea…", reference:"Reference title…" }[l]||"Add item…");

    const doneByTime = items => {
      const now   = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const week  = new Date(today); week.setDate(today.getDate()-6);
      const month = new Date(today); month.setDate(today.getDate()-29);
      const buckets = [
        { label:"Today",      test:d=>d>=today,             defaultOpen:true  },
        { label:"This week",  test:d=>d>=week&&d<today,     defaultOpen:true  },
        { label:"This month", test:d=>d>=month&&d<week,     defaultOpen:false },
        { label:"Older",      test:d=>d<month,              defaultOpen:false },
      ];
      return buckets
        .map(b => ({ ...b, items: items.filter(i => b.test(new Date(i.doneAt||i.created))) }))
        .filter(b => b.items.length > 0);
    };

    const doneByProject = (items, pnameOf) => {
      const map = {};
      items.forEach(i => { const p=pnameOf(i)||"Standalone"; (map[p]=map[p]||[]).push(i); });
      return Object.entries(map).map(([label,items]) => ({ label, items, defaultOpen:true }));
    };

    // ── App ───────────────────────────────────────────────────────
    // Read once at load, before the first render: the parse strips the query string,
    // so calling it from a component (which React may render twice) would lose it.
    const LAUNCH = readLaunchIntent();

    function App() {
      const [items, setItems]             = useState(null);
      const [active, setActive]           = useState(LAUNCH.view || "today");   // "chat" needs a key — see the guard below
      const [ctx, setCtx]                 = useState("all");
      const [capture, setCapture]         = useState("");
      const [showForm, setShowForm]       = useState(false);
      const [form, setForm]               = useState({title:"",context:"@anywhere",dueDate:"",dueTime:"",startDate:"",waitingFor:"",energy:"",time:""});
      const [enerF, setEnerF]             = useState("all");  // Next Actions engage filters
      const [timeF, setTimeF]             = useState("all");
      const [procItem, setProcItem]       = useState(null);
      const [complCand, setComplCand]     = useState(null);
      const [promoteCand, setPromoteCand] = useState(null);  // next action → project
      const [editCand, setEditCand]       = useState(null);  // {list, item} being edited
      const [history,  setHistory]        = useState([]);
      const [showData, setShowData]       = useState(false);
      const [navOpen,  setNavOpen]        = useState(false);  // mobile drawer
      const [updateReady, setUpdateReady] = useState(false);  // new build deployed → offer reload
      const [pipOn, setPipOn]             = useState(false);  // floating (always-on-top) Today window open
      const pipWinRef  = React.useRef(null);                  // the Document-PiP window
      const pipRootRef = React.useRef(null);                  // its own React root (separate document)
      const fileInputRef = React.useRef(null);
      const importMode   = React.useRef("merge");
      // OneDrive cloud sync (optional)
      const [odAccount, setOdAccount]     = useState(() => Drive.account());
      const [syncing,   setSyncing]       = useState(false);
      // Claude: the key lives in localStorage, not in state, so a save/clear has to
      // nudge React by hand for the AI affordances to appear or vanish without a reload.
      const [aiKeyTick, setAiKeyTick]     = useState(0);
      const [aiTest,    setAiTest]        = useState(null);   // null | "…" | {ok} | {ok:false,msg}
      const [syncTick,  setSyncTick]      = useState(0);   // bump to re-render the "last synced" label
      const [archive, setArchiveState] = useState([]);   // rotated-out old Done items (separate store)
      const itemsRef    = React.useRef(null);
      const archiveRef  = React.useRef([]);
      const lastSyncRef = React.useRef(0);
      const driveTimer  = React.useRef(null);
      const setArchive  = a => { archiveRef.current = a; setArchiveState(a); Store.saveArchive(a); };

      // ── heartbeat — when served by Flask on the PC, lets the server exit
      //    once the browser closes. Harmless (and silently ignored) offline. ──
      useEffect(() => {
        const id = setInterval(() => fetch("api/ping", {method:"POST"}).catch(()=>{}), 5000);
        return () => clearInterval(id);
      }, []);

      // keep a ref of the latest items for async sync callbacks (avoids stale closures)
      useEffect(() => { itemsRef.current = items; }, [items]);

      // mirror a compact Today snapshot out to the Android home-screen widget on every
      // change (no-op in a normal browser). Self-contained so it can sit above the
      // `if (!items)` early return, where the App's own pnameOf isn't in scope yet.
      useEffect(() => {
        if (!items || !WidgetBridge.available()) return;
        const pm = projIndex(items);
        WidgetBridge.publish(items, isoDate(new Date()),
                             i => (i && i.projectId && pm.get(i.projectId)) || null);
      }, [items]);

      // a freshly deployed build took control (see the SW registration script) → prompt to reload
      useEffect(() => {
        const h = () => setUpdateReady(true);
        window.addEventListener("gtd:update-ready", h);
        return () => window.removeEventListener("gtd:update-ready", h);
      }, []);

      // process any pending MSAL redirect response once on load (no-op for popup flow).
      // If we returned from a loginRedirect fallback, finish the connection here.
      useEffect(() => {
        const m = Drive.init(); if (!m) return;
        m.handleRedirectPromise().then(res => {
          if (res && res.account) {
            m.setActiveAccount(res.account);
            try { localStorage.setItem(OD_FLAG, "1"); } catch {}
            setOdAccount(Drive.account());
            syncNow();
          }
        }).catch(() => {});
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);   // mount-only; syncNow is stable (useCallback) and only read inside .then after mount

      // ── adopt a merged state if it differs from what's on screen. The merge is
      //    re-run against the CURRENT items so edits made while a sync was in
      //    flight are never clobbered (merging is idempotent). ──
      const adopt = useCallback(merged => {
        const cur   = itemsRef.current || fresh();
        const final = mergeStates(cur, merged);
        if (!sameState(final, cur)) setItems(final);
        Store.saveLocal(final);
        return final;
      }, []);

      // ── full reconcile with every reachable remote (Flask hub + OneDrive):
      //    pull → item-level merge → adopt → push back whichever remote differs.
      //    Also rotates old Done items into the archive store and syncs it. ──
      const fullSync = useCallback(async () => {
        const cur = itemsRef.current || fresh();
        const [server, drive, sArch, dArch] = await Promise.all([
          Store.fetchServer(), Drive.pull(), Store.fetchServerArchive(), Drive.pullArchive(),
        ]);
        let merged = mergeStates(cur, server);
        if (drive && drive.data) merged = mergeStates(merged, drive.data);
        let arch = mergeArchive(mergeArchive(archiveRef.current, sArch), dArch && dArch.data);
        const rot = splitArchive(merged, arch);
        if (rot) { merged = rot.state; arch = rot.archive; }
        const final = adopt(merged);
        if (!sameState(arch, archiveRef.current) || rot) setArchive(arch);
        if (!sameState(server, final)) Store.pushServer(final);
        if (Drive.enabled() && (!drive || !sameState(drive.data, final))) {
          const res = await Drive.push(final);
          if (res.merged) adopt(res.merged);
        }
        const archOutdated = rem => !Array.isArray(rem) || rem.length !== arch.length;
        if (arch.length && archOutdated(sArch)) Store.pushServerArchive(arch);
        if (Drive.enabled() && arch.length && archOutdated(dArch && dArch.data)) Drive.pushArchive(arch);
        lastSyncRef.current = Date.now();
        setSyncTick(t => t + 1);
      }, [adopt]);
      const fullSyncRef = React.useRef(fullSync);
      useEffect(() => { fullSyncRef.current = fullSync; }, [fullSync]);

      // ── offline-first load: show local immediately (migrated to schema v2),
      //    then run a full reconcile against the optional remotes. ──
      useEffect(() => {
        const local  = Store.loadLocal() || fresh();
        const shared = LAUNCH.capture;        // PWA "share to GTD" → straight into the Inbox
        const seeded = shared ? stampChanges(local, { ...local, inbox:[mk(shared), ...local.inbox] }) : local;
        itemsRef.current = seeded; setItems(seeded); Store.saveLocal(seeded);
        archiveRef.current = Store.loadArchive(); setArchiveState(archiveRef.current);
        fullSyncRef.current();
      }, []);

      // ── poll the remotes for other devices' changes (Graph has no push; the
      //    Flask hub is plain HTTP). Cheap merge — adopts/pushes only on change. ──
      useEffect(() => {
        const id = setInterval(async () => {
          const [server, drive] = await Promise.all([
            Store.fetchServer(),
            Drive.enabled() ? Drive.pull() : Promise.resolve(null),
          ]);
          if (!server && !(drive && drive.data)) return;
          const cur = itemsRef.current || fresh();
          let merged = mergeStates(cur, server);
          if (drive && drive.data) merged = mergeStates(merged, drive.data);
          const final = adopt(merged);
          if (!sameState(final, cur)) { lastSyncRef.current = Date.now(); setSyncTick(t => t + 1); }
          if (server && !sameState(server, final)) Store.pushServer(final);
          if (drive && !sameState(drive.data, final)) {
            const res = await Drive.push(final);
            if (res.merged) adopt(res.merged);
          }
        }, 45000);
        return () => clearInterval(id);
      }, [adopt]);

      // debounced push to OneDrive so rapid edits don't spam Graph
      const drivePush = useCallback(d => {
        if (!Drive.enabled()) return;
        if (driveTimer.current) clearTimeout(driveTimer.current);
        driveTimer.current = setTimeout(() => {
          Drive.push(d).then(res => {
            if (!res.ok) return;
            if (res.merged) adopt(res.merged);
            lastSyncRef.current = Date.now(); setSyncTick(t => t + 1);
          });
        }, 2000);
      }, [adopt]);

      const persist = useCallback(d => {
        Store.saveLocal(d);
        Store.pushServer(d);
        drivePush(d);
      }, [drivePush]);

      // ── manual "Sync now" — the same full reconcile the app runs at load ──
      const syncNow = useCallback(async () => {
        setSyncing(true);
        try { await fullSync(); } finally { setSyncing(false); }
      }, [fullSync]);

      const connectDrive = useCallback(async () => {
        if (typeof msal === "undefined") {        // MSAL CDN didn't load — don't fail silently
          alert("The Microsoft sign-in library couldn't load (network or content blocker). Check your connection and reload, then try again.");
          return;
        }
        // Android wrapper: a WebView has no popup surface, so skip loginPopup entirely
        // and use the full-page redirect (the effect above finishes it on the way back).
        if (WidgetBridge.available()) {
          try { Drive.init(); Drive._msal.loginRedirect({ scopes: MS_SCOPES }); return; } catch {}
        }
        try {
          const a = await Drive.connect();
          setOdAccount(a);
          if (a) await syncNow();
          else alert("Sign-in didn't complete — the popup may have been blocked. Allow popups for this site and try again.");
        } catch (err) {
          const code = err && (err.errorCode || err.name) || "";
          if (/popup/i.test(code) || /popup/i.test(err && err.message || "")) {
            try { Drive.init(); Drive._msal.loginRedirect({ scopes: MS_SCOPES }); return; }  // fall back to full-page redirect
            catch {}
          }
          alert("Could not connect to OneDrive: " + (err && err.message ? err.message : "check your client ID / app registration / redirect URI."));
        }
      }, [syncNow]);

      const disconnectDrive = useCallback(async () => {
        await Drive.disconnect(); setOdAccount(null); setSyncTick(t => t + 1);
      }, []);

      // ── Claude ──
      // No key ⇒ every AI affordance is ABSENT (a configuration state, identical to
      // before the feature existed). Key set but offline ⇒ rendered and disabled
      // (a transient state). The two are deliberately not the same.
      const aiOn     = React.useMemo(() => Ai.enabled(), [aiKeyTick]);
      const aiOnline = Ai.online();
      const saveAiKey = useCallback(k => { Ai.setKey(k); setAiTest(null); setAiKeyTick(t => t + 1); }, []);
