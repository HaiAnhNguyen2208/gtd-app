                        style={{width:17,height:17,borderRadius:"50%",border:"2px solid #fcd34d",background:"#fff",cursor:"pointer",flexShrink:0,marginTop:1}}
                        onMouseEnter={e=>e.target.style.borderColor="#f59e0b"}
                        onMouseLeave={e=>e.target.style.borderColor="#fcd34d"}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:500,wordBreak:"break-word"}}>⏳ {w.title}</div>
                        <div style={{display:"flex",gap:5,marginTop:3,flexWrap:"wrap"}}>
                          {w.waitingFor&&<Tag bg="#fffbeb" c="#b45309">👤 {w.waitingFor}</Tag>}
                          {w.dueDate&&<Tag bg={isOver(w.dueDate)?"#fef2f2":"#f0fdf4"} c={isOver(w.dueDate)?"#b91c1c":"#166534"}>{isOver(w.dueDate)?"⚠️ ":"📅 "}{dueLabel(w.dueDate,w.dueTime)}</Tag>}
                        </div>
                      </div>
                      <button onClick={()=>onDeleteAction("waiting",w.id)}
                        style={{background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",fontSize:15,lineHeight:1}}
                        onMouseEnter={e=>e.target.style.color="#ef4444"}
                        onMouseLeave={e=>e.target.style.color="#cbd5e1"}>×</button>
                    </div>
                  ))}
                </div>
              )}
              <button onClick={onDelete}
                style={{marginTop:10,width:"100%",padding:"6px",background:"transparent",border:"1px dashed #fca5a5",borderRadius:7,cursor:"pointer",fontSize:11,color:"#ef4444"}}>
                Remove project
              </button>
            </div>
          )}
        </div>
      );
    }

    // ── DeferredSection ───────────────────────────────────────────
    // Collapsed drawer (GTD tickler) holding actions whose start date is still in the
    // future. Hidden from the active list until they resurface on their start day.
    function DeferredSection({ count, children }) {
      const [open, setOpen] = useState(false);
      return (
        <div style={{marginTop:4,border:"1px dashed #cbd5e1",borderRadius:9,background:"#fafafa"}}>
          <button onClick={()=>setOpen(o=>!o)}
            style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 12px",background:"none",border:"none",cursor:"pointer",fontSize:11,fontWeight:700,color:"#64748b"}}>
            <span>⏳ Scheduled to start later · {count}</span>
            <span style={{fontSize:9}}>{open?"▲":"▼"}</span>
          </button>
          {open && (
            <div style={{display:"flex",flexDirection:"column",gap:6,padding:"0 10px 10px"}}>
              {children}
            </div>
          )}
        </div>
      );
    }

    // ── ItemCard ──────────────────────────────────────────────────
    function ItemCard({ item, list, pname, onComplete, onDelete, onProcess, onRestore, onMove, onPromote, onToggleFocus, onStartPomo, onEdit, focused, currentList }) {
      const [menuPos, setMenuPos] = useState(null);   // {top|bottom, right} in viewport coords, or null = closed
      const moveRef = React.useRef(null);
      const btnRef  = React.useRef(null);
      const menuRef = React.useRef(null);
      const showMove = !!menuPos;
      // The list area is an overflow:auto scroll container that would clip an
      // in-flow menu. Render it through a portal into <body> with position:fixed
      // (escapes every overflow/transform ancestor) and flip it up near the bottom.
      const openMenu = () => {
        const r = btnRef.current.getBoundingClientRect();
        const right = window.innerWidth - r.right;
        const below = window.innerHeight - r.bottom;
        if (below < 220) setMenuPos({ bottom: window.innerHeight - r.top + 4, right });
        else             setMenuPos({ top: r.bottom + 4, right });
      };
      useEffect(() => {
        if (!showMove) return;
        const close = e => {
          if (moveRef.current && moveRef.current.contains(e.target)) return;
          if (menuRef.current && menuRef.current.contains(e.target)) return;
          setMenuPos(null);
        };
        const dismiss = () => setMenuPos(null);
        document.addEventListener("mousedown", close);
        window.addEventListener("scroll", dismiss, true);   // capture: any ancestor scroll closes it
        window.addEventListener("resize", dismiss);
        return () => {
          document.removeEventListener("mousedown", close);
          window.removeEventListener("scroll", dismiss, true);
          window.removeEventListener("resize", dismiss);
        };
      }, [showMove]);
      const ov = isOver(item.dueDate) && list!=="done";
      const displayTitle = item.title;   // titles are clean since v2 — the project link is a chip, not a prefix
      const MOVE_TARGETS = { next:["waiting","someday","reference"], waiting:["next","someday"], someday:["next","waiting","projects"], projects:["next","waiting","someday"], reference:["next","someday"] };
      const targets = onMove ? (MOVE_TARGETS[currentList]||[]) : [];
      const targetLabel = { next:"Next Actions", waiting:"Waiting For", someday:"Someday/Maybe", projects:"Projects", reference:"Reference" };
      return (
        <div style={{background:"#fff",borderRadius:9,padding:"11px 14px",border:`1px solid ${ov?"#fca5a5":"#e2e8f0"}`,display:"flex",alignItems:"flex-start",gap:10,opacity:list==="done"?.55:1,position:"relative"}}>
          {list!=="inbox"&&list!=="done"&&(
            <button onClick={onComplete}
              style={{width:18,height:18,borderRadius:"50%",border:"2px solid #cbd5e1",background:"#fff",cursor:"pointer",flexShrink:0,marginTop:2}}
              onMouseEnter={e=>e.target.style.borderColor="#6366f1"}
              onMouseLeave={e=>e.target.style.borderColor="#cbd5e1"}/>
          )}
          {list==="inbox"&&<div style={{width:18,flexShrink:0}}/>}
          {list==="done"&&(
            <div style={{width:18,height:18,borderRadius:"50%",background:"#6366f1",flexShrink:0,marginTop:2,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{color:"#fff",fontSize:9}}>✓</span>
            </div>
          )}
          <div style={{flex:1,minWidth:0}}>
            {pname&&list!=="projects"&&(
              <div style={{fontSize:10,color:"#7c3aed",fontWeight:600,marginBottom:2}}>📋 {pname}</div>
            )}
            <div style={{fontSize:13,fontWeight:500,textDecoration:list==="done"?"line-through":"none",color:list==="done"?"#94a3b8":"#1e293b",wordBreak:"break-word"}}>
              {displayTitle}
            </div>
            <div style={{display:"flex",gap:5,marginTop:4,flexWrap:"wrap"}}>
              <ItemTags item={item} ov={ov}/>
            </div>
          </div>
          <div style={{display:"flex",gap:4,flexShrink:0,alignItems:"center"}}>
            {onStartPomo&&<button onClick={onStartPomo} title="Start a pomodoro" aria-label="Start a pomodoro" className="ibtn" style={{fontSize:13}}>🍅</button>}
            {onProcess&&<button onClick={onProcess} style={{padding:"3px 8px",background:"#6366f1",color:"#fff",border:"none",borderRadius:5,cursor:"pointer",fontSize:10,fontWeight:700}}>Process</button>}
            {onRestore&&<button onClick={onRestore} style={{padding:"3px 8px",background:"#f1f5f9",color:"#475569",border:"1px solid #e2e8f0",borderRadius:5,cursor:"pointer",fontSize:10}}>Restore</button>}
            {onToggleFocus&&(
              <button onClick={onToggleFocus} title={focused?"Remove from today's focus":"Focus for today"}
                style={{background:"none",border:"none",cursor:"pointer",color:focused?"#f59e0b":"#cbd5e1",fontSize:15,lineHeight:1,padding:"0 1px"}}>
                {focused?"★":"☆"}
              </button>
            )}
            {onEdit&&(
              <button onClick={onEdit} title="Edit"
                style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:13,lineHeight:1,padding:"0 2px"}}
                onMouseEnter={e=>e.target.style.color="#6366f1"}
                onMouseLeave={e=>e.target.style.color="#94a3b8"}>✎</button>
            )}
            {(targets.length>0 || onPromote) && (
              <div ref={moveRef} style={{position:"relative"}}>
                <button ref={btnRef} onClick={()=>showMove?setMenuPos(null):openMenu()}
                  style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:13,lineHeight:1,padding:"0 2px"}}
                  title="Move to…">⇄</button>
                {showMove && ReactDOM.createPortal(
                  <div ref={menuRef} style={{position:"fixed",top:menuPos.top,bottom:menuPos.bottom,right:menuPos.right,background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,boxShadow:"0 8px 24px rgba(0,0,0,.12)",zIndex:300,minWidth:160,overflow:"hidden"}}>
                    {targets.length>0 && (
                      <React.Fragment>
                        <div style={{fontSize:9,color:"#94a3b8",fontWeight:700,textTransform:"uppercase",letterSpacing:".8px",padding:"7px 12px 4px"}}>Move to</div>
                        {targets.map(t=>(
                          <button key={t} onClick={()=>{onMove(t);setMenuPos(null);}}
                            style={{display:"block",width:"100%",padding:"7px 12px",background:"none",border:"none",cursor:"pointer",fontSize:12,textAlign:"left",color:"#1e293b"}}
                            onMouseEnter={e=>e.currentTarget.style.background="#f1f5f9"}
                            onMouseLeave={e=>e.currentTarget.style.background="none"}>
                            {targetLabel[t]}
                          </button>
                        ))}
                      </React.Fragment>
                    )}
                    {onPromote && (
                      <React.Fragment>
                        {targets.length>0 && <div style={{height:1,background:"#f1f5f9",margin:"3px 0"}}/>}
                        <button onClick={()=>{onPromote();setMenuPos(null);}}
                          style={{display:"block",width:"100%",padding:"7px 12px",background:"none",border:"none",cursor:"pointer",fontSize:12,textAlign:"left",color:"#4338ca",fontWeight:600}}
                          onMouseEnter={e=>e.currentTarget.style.background="#f5f3ff"}
                          onMouseLeave={e=>e.currentTarget.style.background="none"}>
                          📋 Make into project
                        </button>
                      </React.Fragment>
                    )}
                  </div>,
                  document.body
                )}
              </div>
            )}
            <button onClick={onDelete}
              style={{background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",fontSize:16,lineHeight:1}}
              onMouseEnter={e=>e.target.style.color="#ef4444"}
              onMouseLeave={e=>e.target.style.color="#cbd5e1"}>×</button>
          </div>
        </div>
      );
    }

    // ── TodayView ─────────────────────────────────────────────────
    // The daily-planning view. Not a stored list — a filter over the dated lists:
    // "Focused today" = Next Actions you starred for today (ephemeral focusDate);
    // "Due today"/"Overdue" = the hard landscape (any dated list). Unfinished focus
    // simply isn't "today" tomorrow — it stays in Next Actions, no rollover guilt.
    function TodayView({ items, todayISO, pnameOf, reviewDue, daysSinceReview, onComplete, onToggleFocus, onStartPomo, onGoto, onEdit }) {
      const dateLabel = new Date(todayISO+"T00:00").toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
      const [hideReview, setHideReview] = useState(false);

      // classify, deduped by id with priority overdue > focus > due > started (DATA CORE)
      const rows    = todayRows(items, todayISO);
      const overdue = rows.filter(r=>r._kind==="overdue");
      const focus   = rows.filter(r=>r._kind==="focus");
      const due     = rows.filter(r=>r._kind==="due");
      const started = rows.filter(r=>r._kind==="started");
      const total   = rows.length;
      const yesterday = isoDate(new Date(todayISO+"T12:00").getTime()-86400000);
      const pomoToday = pomoTally(items, todayISO, todayISO), pomoYday = pomoTally(items, yesterday, yesterday);

      const Row = ({ i, ov }) => {
        const pname = pnameOf(i);
        const title = i.title;
        const foc   = i._list==="next" && i.focusDate===todayISO;
        return (
          <div style={{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 11px",border:`1px solid ${ov?"#fca5a5":"#e2e8f0"}`,borderRadius:9,background:ov?"#fff7f7":"#fff"}}>
            {i._list!=="projects" ? (
              <button onClick={()=>onComplete(i._list,{...i})} title="Mark done"
                style={{width:18,height:18,borderRadius:"50%",border:"2px solid #cbd5e1",background:"#fff",cursor:"pointer",flexShrink:0,marginTop:1}}
                onMouseEnter={e=>e.target.style.borderColor="#6366f1"}
                onMouseLeave={e=>e.target.style.borderColor="#cbd5e1"}/>
            ) : <span style={{fontSize:14,flexShrink:0,marginTop:1}}>📋</span>}
            <div style={{flex:1,minWidth:0}}>
              {pname && <div style={{fontSize:10,color:"#7c3aed",fontWeight:600,marginBottom:2}}>📋 {pname}</div>}
              <div style={{fontSize:13,fontWeight:500,wordBreak:"break-word"}}>{title}</div>
              <div style={{display:"flex",gap:5,marginTop:4,flexWrap:"wrap",alignItems:"center"}}>
                <Tag bg="#eef2ff" c="#4338ca">{META[i._list].icon} {META[i._list].label}</Tag>
                <ItemTags item={i} ov={ov}/>
              </div>
            </div>
            {i._list==="next" && onStartPomo && (
              <button onClick={()=>onStartPomo(i)} title="Start a pomodoro" aria-label="Start a pomodoro" className="ibtn" style={{fontSize:13,flexShrink:0}}>🍅</button>
            )}
            {i._list==="next" && onToggleFocus && (
              <button onClick={()=>onToggleFocus(i.id)} title={foc?"Remove from today's focus":"Focus for today"}
                style={{background:"none",border:"none",cursor:"pointer",color:foc?"#f59e0b":"#cbd5e1",fontSize:15,lineHeight:1,padding:"0 1px",flexShrink:0}}>
                {foc?"★":"☆"}
              </button>
            )}
            {onEdit && i._list!=="projects" && (
              <button onClick={()=>onEdit(i._list,i)} title="Edit" className="ibtn" style={{fontSize:13,flexShrink:0}}>✎</button>
            )}
            <button onClick={()=>onGoto(i._list)} title={"Open "+META[i._list].label} className="ibtn" style={{fontSize:14,flexShrink:0}}>↗</button>
          </div>
        );
      };

      const Section = ({ label, list, ov }) => list.length===0 ? null : (
        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".8px",marginBottom:7}}>
            {label} <span style={{color:"#cbd5e1"}}>· {list.length}</span>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {list.map(i=><Row key={i.id} i={i} ov={ov||(i.dueDate&&i.dueDate<todayISO)}/>)}
          </div>
        </div>
      );

      return (
        <div>
          {reviewDue && !hideReview && (
            <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",marginBottom:14,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10}}>
              <span style={{fontSize:18,flexShrink:0}}>🔄</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12.5,fontWeight:600,color:"#92400e"}}>Time for your Weekly Review</div>
                <div style={{fontSize:11,color:"#b45309",marginTop:1}}>
                  {daysSinceReview===null ? "You haven't run one yet — it's the habit that keeps GTD trustworthy." : `It's been ${daysSinceReview} days. A quick pass keeps your system trustworthy.`}
                </div>
              </div>
              <button onClick={()=>onGoto("review")}
                style={{flexShrink:0,padding:"6px 12px",background:"#f59e0b",color:"#fff",border:"none",borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:700}}>Start</button>
              <button onClick={()=>setHideReview(true)} title="Dismiss for now"
                style={{flexShrink:0,background:"none",border:"none",cursor:"pointer",color:"#b45309",fontSize:16,lineHeight:1,padding:"0 2px"}}>×</button>
            </div>
          )}
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:6}}>
            <div style={{fontSize:15,fontWeight:700}}>{dateLabel}</div>
            <div style={{fontSize:11,color:"#64748b"}}>
              {total} {total===1?"item":"items"} on deck
              {(pomoToday>0||pomoYday>0) && <span title="Finished sessions on actions. Yesterday's number is the honest guide to how much fits today."> · 🍅 {pomoToday} today · {pomoYday} yesterday</span>}
            </div>
          </div>
          {total===0 ? (
            <div style={{textAlign:"center",padding:"48px 20px",color:"#94a3b8"}}>
              <div style={{fontSize:38,marginBottom:10}}>🎯</div>
              <div style={{fontSize:14,fontWeight:600,color:"#475569"}}>No plan for today yet.</div>
              <div style={{fontSize:12,marginTop:4,marginBottom:16}}>Star the next actions you'll focus on today — nothing's due or overdue.</div>
              <button onClick={()=>onGoto("next")}
                style={{padding:"8px 16px",background:"#6366f1",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600}}>
                ⚡ Pick from Next Actions
              </button>
            </div>
          ) : (
            <React.Fragment>
              <Section label="⚠️ Overdue"          list={overdue} ov={true}/>
              <Section label="🎯 Focused today"    list={focus}   ov={false}/>
              <Section label="📅 Due today"        list={due}     ov={false}/>
              <Section label="🚀 Ready to start"   list={started} ov={false}/>
            </React.Fragment>
          )}
        </div>
      );
    }

    // ── PomoBar ───────────────────────────────────────────────────
    // Owns its one-second clock so a running timer re-renders this strip, not the whole App.
    function PomoBar({ pomo, compact, onStop, onSkip, onNext, onCapture }) {
      const [, setNow] = useState(0);
      const [thought, setThought] = useState("");
      const fire = () => { const t = thought.trim(); if (!t) return; onCapture(t); setThought(""); };
      useEffect(() => {
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, []);
      if (!pomo) return null;
      // Android rings natively (its WebView has no Notification), so only a browser can be missing this.
      const notif = window.Notification ? Notification.permission : "granted";
      const look = { work:["#fef2f2","#b91c1c","🍅"], break:["#f0fdf4","#166534","☕"], idle:["#f1f5f9","#475569","🍅"] }[pomo.phase];
      return (
        <div role="timer" style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:"6px 10px",padding:compact?"2px 8px":"8px 14px",background:look[0],color:look[1],borderBottom:"1px solid #e2e8f0",flexShrink:0}}>
          <span style={{fontSize:compact?12:15,fontWeight:700,fontVariantNumeric:"tabular-nums",whiteSpace:"nowrap"}}>
            {look[2]} {pomo.phase==="idle" ? "Break over" : pomoClock(pomo.endsAt-Date.now())}
          </span>
          <span style={{flex:"1 1 90px",minWidth:0,fontSize:12,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
            {pomo.phase==="break" ? "Break — step away" : pomo.title}
          </span>
          {pomo.done>0 && <span title="Sessions finished in this run" style={{fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>× {pomo.done}</span>}
          {pomo.phase==="work" && pomo.marks>0 && <span title="Thoughts captured during this session" style={{fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>’ {pomo.marks}</span>}
          {notif!=="granted" && (
            <button disabled={notif==="denied"} onClick={()=>{ window.focus(); Pomo.arm(); }} className="btn btn-ghost btn-sm"
              title={notif==="denied" ? "Blocked: allow notifications for this site in the browser's settings" : "Get a notification when the timer ends. The prompt appears in the main window."}>
              🔕 {notif==="denied" ? "Blocked" : "Turn on"}
            </button>
          )}
          {pomo.phase==="break" && <button onClick={onSkip} className="btn btn-ghost btn-sm">Skip</button>}
          {pomo.phase==="idle"  && <button onClick={onNext} className="btn btn-pri btn-sm">▶ Next</button>}
          <button onClick={onStop} title="Stop (an unfinished session isn't counted)" aria-label="Stop timer" className="ibtn" style={{fontSize:15}}>×</button>
          {onCapture && pomo.phase==="work" && (
            <input value={thought} onChange={e=>setThought(e.target.value)} onKeyDown={e=>e.key==="Enter"&&fire()}
              placeholder="Something on your mind? Enter sends it to the Inbox — keep going." aria-label="Capture to Inbox"
              className="in in-sm" style={{flex:"1 1 100%",minWidth:0}}/>
          )}
        </div>
      );
    }

    function ItemTags({ item, ov }) {
      return (
        <React.Fragment>
          {item.context&&item.context!=="@anywhere"&&<Tag bg="#ede9fe" c="#5b21b6">{item.context}</Tag>}
          {item.waitingFor&&<Tag bg="#fffbeb" c="#b45309">👤 {item.waitingFor}</Tag>}
          {item.energy&&<Tag bg="#f1f5f9" c="#475569">🔋 {item.energy}</Tag>}
          {item.time&&<Tag bg="#f1f5f9" c="#475569">⏱ {item.time}</Tag>}
          {item.startDate&&<Tag bg="#eff6ff" c="#1d4ed8">🕒 {item.startDate}</Tag>}
          {item.dueDate&&<Tag bg={ov?"#fef2f2":"#f0fdf4"} c={ov?"#b91c1c":"#166534"}>{ov?"⚠️ ":"📅 "}{dueLabel(item.dueDate,item.dueTime)}</Tag>}
          <PomoTag item={item}/>
          {item.doneAt&&<Tag bg="#f0fdf4" c="#166534">✓ {fmtDate(item.doneAt)}</Tag>}
        </React.Fragment>
      );
    }

    function PomoTag({ item }) {
      const n = pomoTotal(item);
      if (!n) return null;
      const big = !item.doneAt && n >= POMO_SPLIT;
      return (
        <Tag bg={big?"#fffbeb":"#fef2f2"} c={big?"#b45309":"#b91c1c"}>
          🍅 {n}{big ? " · break it down?" : ""}
        </Tag>
      );
    }

    // ── FloatToday ────────────────────────────────────────────────
    // The whole app at its smallest, rendered into a Document Picture-in-Picture window (see
    // App.openPip) that stays on top while working in other apps. Every mutation is passed in
    // as a prop (it shares no React context with the main tree), and renderView supplies the
    // views that aren't plain lists.
    function FloatToday({ items, todayISO, pnameOf, canUndo, onUndo, onOpen, onComplete, onToggleFocus, onStartPomo, pomoBar, onCapture, onClose, updateReady, onReload, renderView, inbox }) {
      const [tab, setTab]   = useState("today");
      const [text, setText] = useState("");
      const fire = () => { const t=text.trim(); if(!t) return; onCapture(t); setText(""); };

      const today = todayRows(items, todayISO);
      const listRows = l => (items[l]||[])
        .filter(i => !((l==="next"||l==="waiting") && isDeferred(i, todayISO)))
        .map(i => ({ ...i, _list:l }));
      const rows = tab==="today" ? today : tab==="done" ? listRows("done").slice(0,50) : listRows(tab);
      const count = v => v==="today" ? today.length : v==="inbox" ? (items.inbox||[]).length : 0;
      const iconBtn = {background:"none",border:"none",cursor:"pointer",lineHeight:1,padding:0,flexShrink:0};
      const special = renderView(tab, setTab);
      const card   = tab==="inbox" && rows.length ? rows[rows.length-1] : null;   // oldest first, as in the main window
      const listed = card ? rows.slice(0,-1) : rows;
      const waitingInbox = (tab==="today"||tab==="next") && (items.inbox||[]).length;

      return (
        <div style={{display:"flex",flexDirection:"column",height:"100vh",fontFamily:"'Inter',system-ui,sans-serif"}}>
          <nav style={{display:"flex",alignItems:"center",padding:"3px 4px",background:"#1e293b",flexShrink:0}}>
            {NAV.filter(v => v!=="chat" || Ai.enabled()).map(v => (
              <button key={v} onClick={()=>setTab(v)} title={META[v].label} aria-label={META[v].label}
                style={{...iconBtn,flex:"1 1 0",minWidth:0,padding:"4px 0",fontSize:13,borderRadius:5,position:"relative",background:tab===v?"rgba(99,102,241,.45)":"none"}}>
                {META[v].icon}
                {count(v)>0 && <span style={{position:"absolute",top:0,right:1,fontSize:8,fontWeight:700,color:"#fff",background:v==="inbox"?"#ef4444":"#6366f1",borderRadius:8,padding:"0 3px"}}>{count(v)}</span>}
              </button>
            ))}
            {canUndo && <button onClick={onUndo} title="Undo" aria-label="Undo" style={{...iconBtn,color:"#cbd5e1",fontSize:13,padding:"0 5px"}}>↩</button>}
            <button onClick={onClose} title="Close floating window" aria-label="Close floating window" style={{...iconBtn,color:"#94a3b8",fontSize:16,padding:"0 4px"}}>×</button>
          </nav>

          {pomoBar}

          {updateReady && (
            <div style={{display:"flex",alignItems:"center",gap:6,padding:"3px 8px",background:"#312e81",color:"#e0e7ff",fontSize:11,flexShrink:0}}>
              <span style={{flex:1,minWidth:0}}>🔄 A new version is ready.</span>
              <button onClick={onReload} style={{padding:"2px 8px",background:"#6366f1",color:"#fff",border:"none",borderRadius:5,cursor:"pointer",fontSize:11,fontWeight:700}}>Refresh</button>
            </div>
          )}

          {tab!=="chat" && <div style={{display:"flex",gap:4,padding:"4px 6px",background:"#fff",borderBottom:"1px solid #e2e8f0",flexShrink:0}}>
            <input autoFocus value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&fire()}
              placeholder="Capture a thought…" aria-label="Capture to Inbox" className="in in-sm" style={{flex:1,minWidth:0}}/>
            {onStartPomo && <button onClick={()=>onStartPomo({ id:null, title:META[tab].label })} title={"Start a pomodoro on "+META[tab].label} aria-label={"Start a pomodoro on "+META[tab].label} style={{...iconBtn,fontSize:14}}>🍅</button>}
          </div>}

          {special ? (
            <div style={{flex:1,minHeight:0,overflowY:"auto",padding:6,background:"#fff"}}>{special}</div>
          ) : <div style={{flex:1,overflowY:"auto",background:"#fff"}}>
            {card && <FloatProcess key={card.id} item={card} total={rows.length} inbox={inbox} onSorted={()=>setTab("chat")}/>}
            {!card && rows.length===0 && (waitingInbox
              ? <button onClick={()=>setTab("inbox")} style={{...iconBtn,display:"block",width:"100%",color:"#6366f1",fontSize:12,fontWeight:600,padding:"16px 8px"}}>📥 {(items.inbox||[]).length} in the Inbox — turn them into next actions →</button>
              : <div style={{textAlign:"center",color:"#94a3b8",fontSize:11,padding:"16px 8px"}}>{META[tab].icon} Nothing here.</div>)}
            {listed.map(i => {
              const foc = i._list==="next" && i.focusDate===todayISO;
              const late = i.dueDate && i.dueDate < todayISO && i._list!=="done";
              const pname = pnameOf(i);
              return (
                <div key={i.id} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 8px",borderBottom:"1px solid #f1f5f9",fontSize:12}}>
                  {(i._list==="next"||i._list==="waiting") && (
                    <button onClick={()=>onComplete(i._list,i)} title="Mark done" aria-label={"Mark done: "+i.title}
                      style={{...iconBtn,width:14,height:14,borderRadius:"50%",border:"2px solid #cbd5e1",background:"#fff"}}/>
                  )}
                  <button onClick={()=>onOpen(i._list)} title={(pname?pname+" · ":"")+i.title+" (open in the main window)"}
                    style={{...iconBtn,flex:1,minWidth:0,fontSize:12,textAlign:"left",color:late?"#b91c1c":"#1e293b",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                    {i.title}
                  </button>
                  {i.dueDate && <span style={{fontSize:9.5,color:late?"#b91c1c":"#64748b",flexShrink:0}}>{dueLabel(i.dueDate,i.dueTime)}</span>}
                  {pomoTotal(i)>0 && <span style={{fontSize:9.5,color:"#b91c1c",flexShrink:0}}>🍅{pomoTotal(i)}</span>}
                  {i._list==="next" && onStartPomo && <button onClick={()=>onStartPomo(i)} title="Start a pomodoro" aria-label={"Start a pomodoro: "+i.title} style={{...iconBtn,fontSize:12}}>🍅</button>}
                  {i._list==="next" && (
                    <button onClick={()=>onToggleFocus(i.id)} title={foc?"Unfocus":"Focus for today"} aria-label={(foc?"Unfocus: ":"Focus for today: ")+i.title}
                      style={{...iconBtn,color:foc?"#f59e0b":"#cbd5e1",fontSize:13}}>{foc?"★":"☆"}</button>
                  )}
                </div>
              );
            })}
          </div>}
        </div>
      );
    }

    // One inbox item at a time, oldest first. Enter makes it a next action, so a run of them goes
    // quickly; what needs more than a title (project, waiting, dates) goes to the full dialog.
    function FloatProcess({ item, total, inbox, onSorted }) {
      const [title, setTitle] = useState(item.title);
      const t = title.trim();
      const small = {padding:"2px 6px",fontSize:10.5,background:"#fff",border:"1px solid #ddd6fe",borderRadius:5,cursor:"pointer",color:"#4338ca",whiteSpace:"nowrap"};
      return (
        <div style={{padding:"5px 6px",background:"#f5f3ff",borderBottom:"1px solid #ddd6fe"}}>
          <div style={{fontSize:10,color:"#6d28d9",marginBottom:3}}>{total} to process · what's the next physical action?</div>
          <div style={{display:"flex",gap:4,marginBottom:4}}>
            <input autoFocus value={title} onChange={e=>setTitle(e.target.value)} onFocus={e=>e.target.select()} aria-label="Next action"
              onKeyDown={e=>{ if (e.key==="Enter" && t && !e.nativeEvent.isComposing) inbox.next(item,t); }}
              className="in in-sm" style={{flex:1,minWidth:0}}/>
            <button onClick={()=>inbox.next(item,t)} disabled={!t} title="Make it a next action (Enter)" aria-label="Make it a next action" className="btn btn-pri btn-sm">⚡</button>
            {inbox.start && <button onClick={()=>inbox.start(item,t)} disabled={!t} title="Make it a next action and start a pomodoro on it" aria-label="Make it a next action and start a pomodoro" className="btn btn-ghost btn-sm">🍅</button>}
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
            <button onClick={()=>inbox.to(item,"done",{doneAt:ts()})} title="Took under two minutes: already done" style={small}>✓ Done</button>
            <button onClick={()=>inbox.to(item,"someday",{})} style={small}>🌟 Someday</button>
            <button onClick={()=>inbox.to(item,"reference",{})} style={small}>📁 Reference</button>
            <button onClick={()=>inbox.trash(item)} title="Trash" aria-label="Trash" style={small}>🗑</button>
            <button onClick={()=>inbox.more(item)} title="Project, waiting for, dates (opens the main window)" style={small}>⋯ More</button>
            {inbox.sort && <button onClick={()=>{ inbox.sort(); onSorted(); }} title="The Agent proposes for the whole inbox; nothing changes until you approve" style={small}>✨ All</button>}
          </div>
        </div>
      );
    }

    // ── CalendarView ──────────────────────────────────────────────
    // A cross-list month grid of every dated item (next/waiting/projects/someday).
    // Read-mostly: click a day to inspect its items; complete or jump to the source
    // list from the day panel. Not a stored list — derives entirely from `items`.
    const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    function CalendarView({ compact, items, pnameOf, onComplete, onGoto, onEdit }) {
      const today = new Date(); today.setHours(0,0,0,0);
      const todayISO = isoDate(today);
      const [cursor,   setCursor]   = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
      const [selected, setSelected] = useState(todayISO);

      // bucket every dated item by its YYYY-MM-DD dates — a due date (deadline) on its due
      // day and a start date (GTD tickler "defer until") on its start day. An item with both
      // appears on both days; _kind distinguishes the marker/label.
      const byDate = {};
      DATED.forEach(l => (items[l]||[]).forEach(i => {
        if (i.dueDate)   (byDate[i.dueDate]   = byDate[i.dueDate]   || []).push({ ...i, _list:l, _kind:"due" });
        if (i.startDate) (byDate[i.startDate] = byDate[i.startDate] || []).push({ ...i, _list:l, _kind:"start" });
      }));
      // within a day: timed appointments first (chronological), then untimed due, then starts
      const sortKey = x => x._kind==="start" ? "25:00" : (x.dueTime || "24:00");
      Object.values(byDate).forEach(arr => arr.sort((a,b)=>sortKey(a).localeCompare(sortKey(b))));

      const y = cursor.getFullYear(), mo = cursor.getMonth();
      const startDow    = (new Date(y, mo, 1).getDay() + 6) % 7;   // Monday-first
      const daysInMonth = new Date(y, mo + 1, 0).getDate();
      const cells = [];
      for (let i=0; i<startDow; i++)      cells.push(null);
      for (let d=1; d<=daysInMonth; d++)  cells.push(new Date(y, mo, d));
      while (cells.length % 7 !== 0)      cells.push(null);

      const monthLabel = cursor.toLocaleDateString("en-US", { month:"long", year:"numeric" });
      const stepMonth  = n => setCursor(new Date(y, mo + n, 1));
      const goToday    = () => { setCursor(new Date(today.getFullYear(), today.getMonth(), 1)); setSelected(todayISO); };
      const selItems   = byDate[selected] || [];

      const navBtn = {width:30,height:30,borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",color:"#475569",fontSize:14,lineHeight:1};
      const dot    = { next:"#6366f1", waiting:"#f59e0b", projects:"#7c3aed", someday:"#94a3b8" };

      return (
        <div>
          {/* month navigation */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <button onClick={()=>stepMonth(-1)} style={navBtn} title="Previous month">‹</button>
              <div style={{fontSize:15,fontWeight:700,minWidth:148,textAlign:"center"}}>{monthLabel}</div>
              <button onClick={()=>stepMonth(1)} style={navBtn} title="Next month">›</button>
            </div>
            <button onClick={goToday}
              style={{padding:"6px 12px",background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#475569"}}>
              Today
            </button>
          </div>

          {/* weekday header */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:compact?2:4,marginBottom:4}}>
            {WEEKDAYS.map(w=>(
              <div key={w} style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".5px",textAlign:"center",padding:"2px 0"}}>{w}</div>
            ))}
          </div>

          {/* month grid */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:compact?2:4}}>
            {cells.map((d,idx)=>{
              if (!d) return <div key={idx} style={{minHeight:compact?30:74,background:"#f8fafc",borderRadius:8}}/>;
              const iso     = isoDate(d);
              const dayList = byDate[iso] || [];
              const isToday = iso===todayISO;
              const isSel   = iso===selected;
              const overdue = iso < todayISO;
              return (
                <button key={idx} onClick={()=>setSelected(iso)}
                  style={{minHeight:compact?30:74,textAlign:"left",padding:compact?"1px":"5px 6px",borderRadius:compact?6:8,cursor:"pointer",display:"flex",flexDirection:"column",gap:3,
                          background:isSel?"#eef2ff":"#fff",border:`1px solid ${isSel?"#6366f1":"#e2e8f0"}`,outline:"none"}}>
                  <div style={{display:"flex",justifyContent:"center"}}>
                    <span style={{fontSize:11,fontWeight:700,width:20,height:20,lineHeight:"20px",textAlign:"center",borderRadius:"50%",
                                  background:isToday?"#6366f1":"transparent",color:isToday?"#fff":"#475569"}}>{d.getDate()}</span>
                  </div>
                  <div style={{display:"flex",flexDirection:compact?"row":"column",justifyContent:compact?"center":"flex-start",gap:2,overflow:"hidden"}}>
                    {dayList.slice(0,3).map(i=>{
                      const isStart = i._kind==="start";
                      const od = overdue && !isStart;   // a start day in the past isn't "overdue"
                      return (
                      <div key={i.id+i._kind} title={(isStart?"Starts: ":"")+i.title}
                        style={{display:"flex",alignItems:"center",gap:3,fontSize:9,lineHeight:1.2,color:od?"#b91c1c":"#334155",
                                whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                        <span style={{width:5,height:5,borderRadius:"50%",flexShrink:0,boxSizing:"border-box",
                                      background:isStart?"transparent":(od?"#ef4444":dot[i._list]||"#94a3b8"),
                                      border:isStart?"1.5px solid #1d4ed8":"none"}}/>
                        {!compact && <span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{!isStart&&i.dueTime?<span style={{fontWeight:700}}>{i.dueTime} </span>:null}{i._list==="next"?(i.title.replace(/^\[[^\]]+\]\s*/,"")):i.title}</span>}
                      </div>
                      );
                    })}
                    {!compact && dayList.length>3 && <div style={{fontSize:9,color:"#94a3b8",fontWeight:600}}>+{dayList.length-3} more</div>}
                  </div>
                </button>
              );
            })}
          </div>

          {/* selected-day panel */}
          <div style={{marginTop:16,background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"14px 16px"}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:selItems.length?10:0}}>
              {new Date(selected+"T00:00").toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
              {selected===todayISO && <span style={{marginLeft:8,fontSize:10,color:"#6366f1",fontWeight:700}}>TODAY</span>}
            </div>
            {selItems.length===0 ? (
              <div style={{fontSize:12,color:"#94a3b8",fontStyle:"italic"}}>Nothing scheduled.</div>
            ) : (
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {selItems.map(i=>{
                  const isStart = i._kind==="start";
                  const ov    = selected < todayISO && !isStart;   // a past start day isn't overdue
                  const pname = pnameOf(i);
                  const title = i.title;
                  return (
                    <div key={i.id+i._kind}
                      style={{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 11px",border:`1px solid ${ov?"#fca5a5":"#e2e8f0"}`,borderRadius:9,background:ov?"#fff7f7":"#fff"}}>
                      {i._list!=="projects" ? (
                        <button onClick={()=>onComplete(i._list,{...i})} title="Mark done"
                          style={{width:18,height:18,borderRadius:"50%",border:"2px solid #cbd5e1",background:"#fff",cursor:"pointer",flexShrink:0,marginTop:1}}
                          onMouseEnter={e=>e.target.style.borderColor="#6366f1"}
                          onMouseLeave={e=>e.target.style.borderColor="#cbd5e1"}/>
                      ) : <span style={{fontSize:14,flexShrink:0,marginTop:1}}>📋</span>}
                      <div style={{flex:1,minWidth:0}}>
                        {pname && <div style={{fontSize:10,color:"#7c3aed",fontWeight:600,marginBottom:2}}>📋 {pname}</div>}
                        <div style={{fontSize:13,fontWeight:500,wordBreak:"break-word"}}>{title}</div>
                        <div style={{display:"flex",gap:5,marginTop:4,flexWrap:"wrap",alignItems:"center"}}>
                          <Tag bg="#eef2ff" c="#4338ca">{META[i._list].icon} {META[i._list].label}</Tag>
                          {i.context&&i.context!=="@anywhere"&&<Tag bg="#ede9fe" c="#5b21b6">{i.context}</Tag>}
                          {i.waitingFor&&<Tag bg="#fffbeb" c="#b45309">👤 {i.waitingFor}</Tag>}
                          {isStart&&<Tag bg="#eff6ff" c="#1d4ed8">🕒 starts</Tag>}
                          {!isStart&&i.dueTime&&<Tag bg="#f0fdf4" c="#166534">⏰ {fmtTime(i.dueTime)}</Tag>}
                          {ov&&<Tag bg="#fef2f2" c="#b91c1c">⚠️ overdue</Tag>}
                        </div>
                      </div>
                      {onEdit && i._list!=="reference" && (
                        <button onClick={()=>onEdit(i._list,i)} title="Edit"
                          style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:13,lineHeight:1,padding:"0 2px",flexShrink:0}}
                          onMouseEnter={e=>e.currentTarget.style.color="#6366f1"}
                          onMouseLeave={e=>e.currentTarget.style.color="#94a3b8"}>✎</button>
                      )}
                      <button onClick={()=>onGoto(i._list)} title={"Open "+META[i._list].label}
                        style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:14,lineHeight:1,padding:"0 2px",flexShrink:0}}
                        onMouseEnter={e=>e.currentTarget.style.color="#6366f1"}
                        onMouseLeave={e=>e.currentTarget.style.color="#94a3b8"}>↗</button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── WeeklyReview ──────────────────────────────────────────────
    // GTD's keystone Reflect habit, as a guided checklist: get clear → get current →
    // get creative. Surfaces live counts (inbox, stalled projects, stale waiting-for,
    // overdue) so the review is actionable; completing it stamps _reviewedAt.
    function WeeklyReview({ items, todayISO, reviewedAt, daysSinceReview, reviewDay, onSetReviewDay, onComplete, onGoto, ai }) {
      const [done, setDone] = useState({});
      const toggle = k => setDone(d => ({ ...d, [k]: !d[k] }));
      const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

      const inbox = (items.inbox||[]).length;
      const nextC = (items.next||[]).length;
      const someC = (items.someday||[]).length;
      const waiting = items.waiting||[];
      const staleWait = waiting.filter(w => w.created && (Date.now()-new Date(w.created)) > 7*86400000).length;
      const projects = items.projects||[];
      // A project is stalled when NOTHING moves it: no linked next action AND no
      // linked waiting-for (delegated work counts as a next move — id-based links).
      const linkedActive = new Set();
      ["next","waiting"].forEach(l=>(items[l]||[]).forEach(a=>{ if(a.projectId) linkedActive.add(a.projectId); }));
      const stalled = projects.filter(p => !linkedActive.has(p.id));
      let overdue=0, upcoming=0;
      DATED.forEach(l=>(items[l]||[]).forEach(i=>{ if(i.dueDate){ i.dueDate<todayISO ? overdue++ : upcoming++; }}));

      const phases = [
        { name:"1 · Get clear", key:"clear", color:"#0ea5e9", steps:[
          {k:"collect", label:"Collect loose papers & materials", hint:"Round up stray notes, receipts, cards — drop them in your Inbox."},
          {k:"inbox",   label:"Process your Inbox to zero", hint:"Decide what each item is and where it belongs — don't put anything back.", goto:"inbox", count:inbox, danger:inbox>0, note:inbox===0?"empty ✓":null},
          {k:"mind",    label:"Empty your head", hint:"Capture any uncaptured commitments, ideas, or open loops."},
        ]},
        { name:"2 · Get current", key:"current", color:"#6366f1", steps:[
          {k:"next",    label:"Review Next Actions", hint:"Tick off completed ones; is each still the real next step?", goto:"next", count:nextC},
          {k:"cal",     label:"Review Calendar — past & upcoming", hint:"Check last week for loose ends, the week ahead for commitments.", goto:"calendar", count:overdue+upcoming, danger:overdue>0, note:overdue>0?`${overdue} overdue`:null},
          {k:"waiting", label:"Review Waiting For", hint:"Anyone to follow up on or nudge?", goto:"waiting", count:waiting.length, note:staleWait>0?`${staleWait} over a week old`:null},
          {k:"projects",label:"Review Projects", hint:"Every active project needs a defined next action.", goto:"projects", count:projects.length, danger:stalled.length>0, note:stalled.length>0?`${stalled.length} stalled`:null},
          {k:"someday", label:"Review Someday/Maybe", hint:"Anything ready to activate? Anything to let go?", goto:"someday", count:someC},
        ]},
        { name:"3 · Get creative", key:"creative", color:"#10b981", steps:[
          {k:"creative", label:"Add new ideas & projects", hint:"What's possible now? Capture anything fresh that surfaced."},
        ]},
      ];
      const pomoWeek = pomoTally(items, isoDate(new Date(todayISO+"T12:00").getTime()-6*86400000), todayISO);
      // The app has already COUNTED everything; the coach is handed those numbers so
      // it spends its turn on judgement instead of re-deriving what we know exactly.
      const facts = [
        `inbox: ${inbox}`, `next actions: ${nextC}`, `waiting: ${waiting.length} (${staleWait} over a week old)`,
        `projects: ${projects.length} (${stalled.length} stalled: ${stalled.map(p=>p.title).join("; ") || "none"})`,
        `someday: ${someC}`, `dated: ${overdue} overdue, ${upcoming} upcoming`,
        `weekly review: ${daysSinceReview===null ? "never run" : daysSinceReview + " days since the last one"}`,
        `pomodoros in the last 7 days: ${pomoWeek}`,
      ].join("\n");
      const obsFor = key => ((ai && ai.data && ai.data.observations) || []).filter(o => o.phase === key);

      const allSteps  = phases.flatMap(p=>p.steps);
      const completed = allSteps.filter(s=>done[s.k]).length;
      const pct       = Math.round(completed/allSteps.length*100);
      const finish    = () => { onComplete(); setDone({}); };

      const lastTxt = reviewedAt
        ? (daysSinceReview===0 ? "Last reviewed today 🎉" : `Last reviewed ${daysSinceReview} day${daysSinceReview===1?"":"s"} ago`)
        : "You haven't run a Weekly Review yet";

      return (
        <div style={{maxWidth:1180,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",flexWrap:"wrap",gap:6,marginBottom:4}}>
            <div style={{fontSize:15,fontWeight:700}}>🔄 Weekly Review</div>
            <div style={{fontSize:11,color:daysSinceReview>=7||daysSinceReview===null?"#b45309":"#64748b"}}>{lastTxt}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:14}}>
            <div style={{fontSize:12,color:"#64748b"}}>
              The habit that keeps your system trustworthy. Walk each step, then mark it complete.
              {pomoWeek>0 && ` 🍅 ${pomoWeek} focused sessions in the last 7 days.`}
            </div>
            {onSetReviewDay && (
              <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#64748b",whiteSpace:"nowrap"}}>
                Review day
                <select className="in in-sm" value={reviewDay} onChange={e=>onSetReviewDay(Number(e.target.value))}
                  title="The reminder appears from this day each week until you complete the review">
                  {WD.map((d,i)=><option key={i} value={i}>{d}</option>)}
                </select>
              </label>
            )}
          </div>

          {ai && (ai.active ? (
            <AiOpsReview ops={ai.ops} results={ai.results} notes={ai.notes} busy={ai.busy} error={ai.error}
              applyLabel="Apply" onApply={ai.onApply} onRetry={()=>ai.onRun(facts)} onCancel={ai.onClose}/>
          ) : (
            <button onClick={()=>ai.onRun(facts)} disabled={!ai.online}
              title={ai.online ? "" : "Offline — Claude needs a connection"}
              style={{width:"100%",padding:"10px 12px",marginBottom:14,textAlign:"left",
                      background:ai.online?"#faf5ff":"#f8fafc",border:`1.5px solid ${ai.online?"#c4b5fd":"#e2e8f0"}`,
                      borderRadius:9,cursor:ai.online?"pointer":"default",fontSize:12,fontWeight:600,
                      color:ai.online?"#5b21b6":"#94a3b8"}}>
              ✨ Coach me through this review
              <div style={{fontSize:10,fontWeight:400,color:ai.online?"#8b5cf6":"#cbd5e1",marginTop:2}}>
                Reads your lists and says what actually needs attention — nothing changes without your OK
              </div>
            </button>
          ))}

          {/* progress */}
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
            <div style={{flex:1,height:8,background:"#e2e8f0",borderRadius:20,overflow:"hidden"}}>
              <div style={{width:`${pct}%`,height:"100%",background:pct===100?"#10b981":"#6366f1",transition:"width .2s"}}/>
            </div>
            <div style={{fontSize:11,fontWeight:700,color:"#475569",minWidth:78,textAlign:"right"}}>{completed}/{allSteps.length} steps</div>
          </div>

          {/* three phases side by side — each a panel-column, steps stacked in sequence */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:14,alignItems:"start",marginBottom:18}}>
            {phases.map(ph=>(
              <div key={ph.name} style={{border:"1px solid #e2e8f0",borderRadius:12,background:"#f8fafc",padding:14,display:"flex",flexDirection:"column",gap:8}}>
                <div style={{fontSize:10,fontWeight:700,color:ph.color,textTransform:"uppercase",letterSpacing:".8px",borderBottom:`2px solid ${ph.color}22`,paddingBottom:7}}>{ph.name}</div>
                {obsFor(ph.key).map((o,k)=>(
                  <div key={"obs"+k} style={{fontSize:11,color:"#5b21b6",background:"#faf5ff",border:"1px solid #ddd6fe",
                                             borderRadius:8,padding:"8px 10px",lineHeight:1.5}}>
                    ✨ {o.text}
                  </div>
                ))}
                {ph.steps.map(s=>{
                  const on = !!done[s.k];
                  return (
                    <div key={s.k}
                      style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",border:`1px solid ${on?"#86efac":"#e2e8f0"}`,borderRadius:9,background:on?"#f0fdf4":"#fff"}}>
                      <button onClick={()=>toggle(s.k)} title={on?"Mark not done":"Mark done"}
                        style={{width:18,height:18,borderRadius:"50%",border:`2px solid ${on?"#10b981":"#cbd5e1"}`,background:on?"#10b981":"#fff",color:"#fff",cursor:"pointer",flexShrink:0,marginTop:1,fontSize:11,lineHeight:1,padding:0}}>
                        {on?"✓":""}
                      </button>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:500,textDecoration:on?"line-through":"none",color:on?"#64748b":"#1e293b"}}>{s.label}</div>
                        <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{s.hint}</div>
                        {(s.count!==undefined || s.note) && (
                          <div style={{display:"flex",gap:5,marginTop:5,flexWrap:"wrap",alignItems:"center"}}>
                            {s.count!==undefined && <Tag bg="#eef2ff" c="#4338ca">{s.count} item{s.count===1?"":"s"}</Tag>}
                            {s.note && <Tag bg={s.danger?"#fef2f2":"#f0fdf4"} c={s.danger?"#b91c1c":"#166534"}>{s.note}</Tag>}
                          </div>
                        )}
                        {s.goto && (
                          <button onClick={()=>onGoto(s.goto)} title={"Open "+(META[s.goto]?.label||s.goto)}
                            className="btn btn-ghost btn-sm" style={{marginTop:7,whiteSpace:"nowrap"}}>Open →</button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

          <button onClick={finish}
            style={{width:"100%",padding:"12px",background:pct===100?"#10b981":"#6366f1",color:"#fff",border:"none",borderRadius:9,cursor:"pointer",fontSize:13,fontWeight:700,marginTop:4}}>
            {pct===100?"✓ Complete Weekly Review":"Mark Weekly Review complete"}
          </button>
          <div style={{fontSize:10,color:"#94a3b8",textAlign:"center",marginTop:8}}>
            Completing resets the 7-day clock and clears the “due” reminder.
          </div>
        </div>
      );
    }

    // ── CompleteModal ─────────────────────────────────────────────
    function CompleteModal({ item, list, pname, ctxs, onConfirm, onClose }) {
      const [phase, setPhase]         = useState(pname ? "decide" : "simple");
      const [nextTitle, setNextTitle] = useState("");
      const [nextCtx,   setNextCtx]   = useState(item.context||"@anywhere");
      const [nextDue,   setNextDue]   = useState("");
      const [waitingFor, setWaitingFor] = useState("");

      const overlay = {position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200};
      const box     = {background:"#fff",borderRadius:14,padding:22,width:420,maxWidth:"92vw",maxHeight:"92vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.2)"};

      if (phase==="simple") return (
        <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div style={box}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:5}}>Mark as done?</div>
            <div style={{fontSize:12,color:"#64748b",marginBottom:16,fontStyle:"italic"}}>"{item.title}"</div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>onConfirm("later",null)}
                style={{flex:1,padding:"9px",background:"#10b981",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>✓ Done</button>
              <button onClick={onClose}
                style={{flex:1,padding:"9px",background:"transparent",border:"1px solid #e2e8f0",borderRadius:8,cursor:"pointer",fontSize:13,color:"#64748b"}}>Cancel</button>
            </div>
          </div>
        </div>
      );

      if (phase==="decide") return (
        <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div style={box}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>Action complete ✓</div>
            <div style={{fontSize:12,color:"#64748b",marginBottom:12,fontStyle:"italic"}}>
              "{item.title}"
            </div>
            <div style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:"#5b21b6"}}>
              📋 <strong>{pname}</strong>
              <div style={{marginTop:3,fontSize:11,color:"#7c3aed",fontStyle:"italic"}}>GTD: every project must always have a defined next action.</div>
            </div>
            <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".8px",marginBottom:8}}>What's next for this project?</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              <button onClick={()=>setPhase("define")}
                style={{padding:"11px 13px",background:"#f5f3ff",border:"1.5px solid #6366f1",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#4338ca",textAlign:"left"}}>
                ⚡ Define the next action now
                <div style={{fontSize:10,fontWeight:400,color:"#6366f1",marginTop:2}}>Recommended — keeps the project moving</div>
              </button>
              <button onClick={()=>onConfirm("close",null)}
                style={{padding:"11px 13px",background:"#f0fdf4",border:"1.5px solid #10b981",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#065f46",textAlign:"left"}}>
                🎉 Project is complete — close it
                <div style={{fontSize:10,fontWeight:400,color:"#10b981",marginTop:2}}>The outcome has been fully achieved</div>
              </button>
              <button onClick={()=>setPhase("waiting")}
                style={{padding:"11px 13px",background:"#eff6ff",border:"1.5px solid #93c5fd",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#1e40af",textAlign:"left"}}>
                ⏳ Waiting for someone/something
                <div style={{fontSize:10,fontWeight:400,color:"#3b82f6",marginTop:2}}>The ball is in someone else's court</div>
              </button>
              <button onClick={()=>onConfirm("someday",null)}
                style={{padding:"11px 13px",background:"#f8fafc",border:"1.5px solid #94a3b8",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#475569",textAlign:"left"}}>
                💤 Move to Someday/Maybe
                <div style={{fontSize:10,fontWeight:400,color:"#64748b",marginTop:2}}>Not a current priority — incubate it</div>
              </button>
              <button onClick={()=>onConfirm("later",null)}
                style={{padding:"11px 13px",background:"#fffbeb",border:"1.5px solid #fcd34d",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#92400e",textAlign:"left"}}>
                🔄 Decide at next Weekly Review
                <div style={{fontSize:10,fontWeight:400,color:"#b45309",marginTop:2}}>⚠️ Project will appear as stalled until then</div>
              </button>
            </div>
            <button onClick={onClose}
              style={{marginTop:10,width:"100%",padding:"8px",background:"transparent",border:"1px solid #e2e8f0",borderRadius:8,cursor:"pointer",fontSize:12,color:"#64748b"}}>
              Cancel
            </button>
          </div>
        </div>
      );

      if (phase==="define") return (
        <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div style={box}>
            <button onClick={()=>setPhase("decide")}
              style={{background:"none",border:"none",cursor:"pointer",color:"#6366f1",fontSize:12,marginBottom:12,padding:0}}>← Back</button>
            <div style={{fontSize:14,fontWeight:700,marginBottom:3}}>
              Next action for: <span style={{color:"#6366f1"}}>{pname}</span>
            </div>
            <div style={{fontSize:11,color:"#64748b",marginBottom:12}}>
              What is the very next <em>physical, visible</em> action?
            </div>
            <input autoFocus value={nextTitle} onChange={e=>setNextTitle(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter"&&nextTitle.trim()) onConfirm("next",{...mk(nextTitle.trim()),projectId:item.projectId,context:nextCtx,dueDate:nextDue}); }}
              placeholder="e.g. Gọi điện cho anh Sơn về tiến độ"
              style={{width:"100%",padding:"8px 10px",border:"1px solid #d1d5db",borderRadius:8,fontSize:13,outline:"none",marginBottom:8}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
              <div>
                <div style={{fontSize:9,color:"#64748b",textTransform:"uppercase",letterSpacing:".8px",marginBottom:4}}>Context</div>
                <select value={nextCtx} onChange={e=>setNextCtx(e.target.value)}
                  style={{width:"100%",padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12,background:"#fff"}}>
                  {ctxs.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div>
                <div style={{fontSize:9,color:"#64748b",textTransform:"uppercase",letterSpacing:".8px",marginBottom:4}}>Due date</div>
                <input type="date" value={nextDue} onChange={e=>setNextDue(e.target.value)}
                  style={{width:"100%",padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12}}/>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button
                onClick={()=>{ if(nextTitle.trim()) onConfirm("next",{...mk(nextTitle.trim()),projectId:item.projectId,context:nextCtx,dueDate:nextDue}); }}
                disabled={!nextTitle.trim()}
                style={{flex:1,padding:"9px",background:nextTitle.trim()?"#6366f1":"#e2e8f0",color:nextTitle.trim()?"#fff":"#94a3b8",border:"none",borderRadius:8,cursor:nextTitle.trim()?"pointer":"default",fontSize:13,fontWeight:600}}>
                ✓ Done & add next action
              </button>
              <button onClick={onClose}
                style={{flex:1,padding:"9px",background:"transparent",border:"1px solid #e2e8f0",borderRadius:8,cursor:"pointer",fontSize:13,color:"#64748b"}}>
                Cancel
              </button>
            </div>
          </div>
        </div>
      );

      if (phase==="waiting") return (
        <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div style={box}>
            <button onClick={()=>setPhase("decide")}
              style={{background:"none",border:"none",cursor:"pointer",color:"#3b82f6",fontSize:12,marginBottom:12,padding:0}}>← Back</button>
            <div style={{fontSize:14,fontWeight:700,marginBottom:3}}>
              Waiting for: <span style={{color:"#3b82f6"}}>{pname}</span>
            </div>
            <div style={{fontSize:11,color:"#64748b",marginBottom:12}}>
              What or who are you waiting for before this project can move forward?
            </div>
            <input autoFocus value={waitingFor} onChange={e=>setWaitingFor(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter"&&waitingFor.trim()) onConfirm("waiting",{waitingFor:waitingFor.trim()}); }}
              placeholder="e.g. John's approval on the proposal"
              style={{width:"100%",padding:"8px 10px",border:"1px solid #d1d5db",borderRadius:8,fontSize:13,outline:"none",marginBottom:14}}/>
            <div style={{display:"flex",gap:8}}>
              <button
                onClick={()=>{ if(waitingFor.trim()) onConfirm("waiting",{waitingFor:waitingFor.trim()}); }}
                disabled={!waitingFor.trim()}
                style={{flex:1,padding:"9px",background:waitingFor.trim()?"#3b82f6":"#e2e8f0",color:waitingFor.trim()?"#fff":"#94a3b8",border:"none",borderRadius:8,cursor:waitingFor.trim()?"pointer":"default",fontSize:13,fontWeight:600}}>
                ⏳ Add to Waiting For
              </button>
              <button onClick={onClose}
                style={{flex:1,padding:"9px",background:"transparent",border:"1px solid #e2e8f0",borderRadius:8,cursor:"pointer",fontSize:13,color:"#64748b"}}>
                Cancel
              </button>
            </div>
          </div>
        </div>
      );

      return null;
    }

    // ── PromoteModal — turn a single next action into a project ───
    // ── Review-before-apply — the ONE surface every AI proposal lands in ─────
    // The preview IS applyAiOps run against the live state, so an op the model got
    // wrong is already greyed out with a reason before the user commits to anything.
    // Applying goes through a single upd, so Ctrl+Z undoes the whole batch at once.
    const AI_REASON = {
      "no-such-item":"that item is gone",     "no-such-list":"not a valid list",
      "no-such-project":"no such project",    "empty-title":"empty title",
      "wrong-list":"only next actions can be focused", "noop":"already true",
      "unknown-op":"unsupported action",      "bad-shape":"malformed",
      "too-many":"batch too long",
    };
    function AiOpsReview({ ops, results, notes, busy, error, onApply, onRetry, onCancel, applyLabel }) {
      const [off, setOff] = useState({});
      const [secs, setSecs] = useState(0);
      useEffect(() => { setOff({}); }, [results]);          // a fresh run starts fully ticked
      // A silent spinner makes "it's slow" and "it's wedged" look identical. Count.
      useEffect(() => {
        if (!busy) { setSecs(0); return; }
        const t = setInterval(() => setSecs(n => n + 1), 1000);
        return () => clearInterval(t);
      }, [busy]);
      const rows    = results || [];
      const chosen  = rows.filter(r => r.ok && !off[r.i]).map(r => r.i);
      const box     = {border:"1px solid #ddd6fe",background:"#faf5ff",borderRadius:9,padding:"11px 13px",marginBottom:10};

      if (busy) return (
        <div style={box}>
          <div style={{fontSize:12,color:"#5b21b6",fontWeight:600}}>
            ✨ Asking Claude… {secs > 2 ? `${secs}s` : ""}
          </div>
          {secs > 20 && (
            <div style={{fontSize:10,color:"#8b5cf6",marginTop:4,lineHeight:1.5}}>
              Longer than usual. It gives up at 60s — check DevTools → Network → “messages” if this repeats.
            </div>
          )}
          {onCancel && <button onClick={onCancel} className="btn btn-ghost btn-sm" style={{marginTop:8}}>Cancel</button>}
        </div>
      );
      if (error) return (
        <div style={{...box,borderColor:"#fca5a5",background:"#fef2f2"}}>
          <div style={{fontSize:12,color:"#b91c1c",lineHeight:1.5}}>{error}</div>
          <div style={{display:"flex",gap:6,marginTop:8}}>
            {onRetry  && <button onClick={onRetry}  className="btn btn-pri btn-sm">Try again</button>}
            {onCancel && <button onClick={onCancel} className="btn btn-ghost btn-sm">Dismiss</button>}
          </div>
        </div>
      );
      if (!rows.length && !(notes||[]).length) return null;

      return (
        <div style={box}>
          {(notes||[]).map((n,k)=>(
            <div key={k} style={{fontSize:12,color:"#4c1d95",lineHeight:1.5,marginBottom:6}}>{n}</div>
          ))}
          {rows.map(r => {
            const op = (ops||[])[r.i] || {};
            return (
              <label key={r.i} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"5px 0",
                                       cursor:r.ok?"pointer":"default",opacity:r.ok?1:.5}}>
                <input type="checkbox" disabled={!r.ok} checked={r.ok && !off[r.i]}
                  onChange={()=>setOff(o=>({ ...o, [r.i]: !o[r.i] }))} style={{marginTop:2}}/>
                <span style={{flex:1,minWidth:0}}>
                  <span style={{fontSize:12,color:"#1e293b"}}>{r.effect || op.op}</span>
                  {!r.ok && <span style={{fontSize:10,color:"#b91c1c",marginLeft:6}}>
                    — skipped: {AI_REASON[r.reason] || r.reason}</span>}
                  {op.why && <div style={{fontSize:10,color:"#94a3b8",marginTop:1}}>{op.why}</div>}
                  {r.ok && r.clamped && r.clamped.length > 0 && (
                    <div style={{fontSize:10,color:"#b45309",marginTop:1}}>ignored: {r.clamped.join(", ")}</div>
                  )}
                </span>
              </label>
            );
          })}
          <div style={{display:"flex",gap:6,marginTop:9}}>

    // ── Agent — a derived view like Today/Calendar; it proposes, the owner approves ──
    // The session lives in App, so the main window and the float show one conversation and a
    // request outlives leaving the view. The transcript stays in its own device-local key:
    // inside gtd_state_v1 it would reach OneDrive, the hub and every backup, and bloat each sync.
    function useAgentSession(items, archive, pomo) {
      const [msgs,  setMsgs]  = useState(() => {
        try { const m = JSON.parse(localStorage.getItem(AGENT_LS)); return Array.isArray(m) ? m : []; } catch { return []; }
      });
      const [step,  setStep]  = useState("");
      const [busy,  setBusy]  = useState(false);
      const [error, setError] = useState("");
      const [cost,  setCost]  = useState(0);
      const [proposal, setProposal] = useState(null);    // {ops, refs}
      const abort = React.useRef(null);
      useEffect(() => { try { localStorage.setItem(AGENT_LS, JSON.stringify(msgs.slice(-AGENT_KEEP))); } catch {} }, [msgs]);

      const send = async q => {
        if (abort.current) return;
        const history = [...msgs, { role:"user", content:q }];
        setMsgs(history); setError(""); setProposal(null); setStep(""); setBusy(true);
        const ctrl = new AbortController(); abort.current = ctrl;
        const timerLine = pomo && pomo.phase === "work"
          ? `They are in a pomodoro on "${pomo.title}" with ${pomoClock(pomo.endsAt-Date.now())} left; keep it short and don't pull them off it.`
          : "No pomodoro is running.";
        const model = Ai.model();
        const r = await AiTasks.agent(items, archive, history, isoDate(new Date()), timerLine, { model, signal:ctrl.signal, onStep:setStep });
        abort.current = null;
        setBusy(false); setStep("");
        if (r.usage) setCost(c => c + agentCost(r.usage, model));
        if (!r.ok) { if (r.code !== "cancelled") setError(r.msg); return; }
        if (r.text) setMsgs(h => [...h, { role:"assistant", content:r.text }]);
        if (r.ops.length) setProposal({ ops:r.ops, refs:r.refs });
      };
      return { msgs, step, busy, error, cost, proposal, send, setProposal,
        stop:  () => { if (abort.current) abort.current.abort(); },
        clear: () => { setMsgs([]); setProposal(null); setError(""); } };
    }
