<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>GTD – Getting Things Done</title>

  <!-- PWA: installable on Android home screen & Windows; works offline -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="static/icons/icon.svg">
  <link rel="apple-touch-icon" href="static/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GTD">

  <!-- Exact versions with integrity: this page holds the Anthropic key and the OneDrive token.
       Changing a version means changing it here and in sw.js, with its new hash. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
  <!-- Microsoft Authentication Library — used only for the OPTIONAL OneDrive cloud sync.
       Served from unpkg (same CDN as React) — Microsoft's own alcdn host is unreliable. -->
  <script src="https://unpkg.com/@azure/msal-browser@2.38.4/lib/msal-browser.min.js" crossorigin integrity="sha384-FyFWjaUFP9q0tLEvcwV9UloGlRNkfP3l+vmNCjwLpji7ChADDrvdXXXNIufO0sEw"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; }

    /* ── Responsive app shell ──
       Layout structure lives here (not inline) so it can adapt to viewport.
       Wide screens: persistent sidebar beside the content (works in landscape).
       Narrow screens: sidebar becomes an off-canvas drawer toggled by a button. */
    .app-shell   { display:flex; height:100vh; height:100dvh; overflow:hidden; }
    .app-sidebar { width:210px; flex-shrink:0; display:flex; flex-direction:column;
                   overflow-y:auto; background:#0f172a; }
    .app-main    { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
    .nav-toggle  { display:none; }          /* hamburger: hidden on wide screens */
    .nav-backdrop{ display:none; }

    /* Phones / very narrow windows — drawer sidebar over full-width content.
       Targets portrait phones AND short landscape phones (max-height) so the
       sidebar never eats the content area. */
    @media (max-width: 760px), (max-height: 460px) and (max-width: 960px) {
      .nav-toggle { display:inline-flex; align-items:center; justify-content:center; }
      .app-sidebar {
        position:fixed; top:0; left:0; bottom:0; height:100%;
        width:78vw; max-width:300px; z-index:120;
        transform:translateX(-100%);
        transition:transform .22s ease;
        box-shadow:0 0 40px rgba(0,0,0,.55);
        padding-top:env(safe-area-inset-top);
      }
      .app-sidebar.open { transform:translateX(0); }
      .nav-backdrop.show {
        display:block; position:fixed; inset:0;
        background:rgba(0,0,0,.5); z-index:110;
      }
    }

    /* ── Design system ──
       Shared tokens + component classes so styling stays consistent and edits
       happen in one place. Hover/focus live here (CSS :hover) instead of inline
       onMouseEnter/Leave handlers. Components reference these via className. */
    :root{
      --indigo:#6366f1; --indigo-d:#4f46e5; --indigo-soft:#eef2ff; --indigo-ink:#4338ca;
      --ink:#1e293b; --muted:#64748b; --faint:#94a3b8;
      --line:#e2e8f0; --line-2:#d1d5db; --bg-soft:#f8fafc; --bg-form:#fafaf9;
      --red:#ef4444; --red-ink:#b91c1c; --amber:#f59e0b; --green:#10b981;
    }
    /* inputs & selects */
    .in{ width:100%; padding:8px 10px; border:1px solid var(--line-2); border-radius:8px;
         font-size:13px; outline:none; background:#fff; color:var(--ink); font-family:inherit; }
    .in:focus{ border-color:var(--indigo); }
    .agent-box:focus-within{ border-color:var(--indigo) !important; }
    .in-sm{ padding:7px 9px; font-size:12px; border-radius:7px; }
    select.in{ cursor:pointer; }
    /* stacked label + control */
    .fld{ display:flex; flex-direction:column; gap:3px; min-width:0; }
    .fld > span{ font-size:9px; font-weight:600; color:var(--faint);
                 text-transform:uppercase; letter-spacing:.4px; }
    /* buttons */
    .btn{ border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
          padding:9px 16px; line-height:1.2; font-family:inherit;
          transition:background .15s, border-color .15s, color .15s; }
    .btn:disabled{ cursor:default; }
    .btn-sm{ padding:6px 12px; font-size:12px; border-radius:7px; }
    .btn-pri{ background:var(--indigo); color:#fff; }
    .btn-pri:hover{ background:var(--indigo-d); }
    .btn-pri:disabled{ background:var(--line); color:var(--faint); }
    .btn-ghost{ background:#fff; color:var(--muted); border:1px solid var(--line); }
    .btn-ghost:hover{ border-color:var(--indigo); color:var(--indigo); }
    /* bare icon button (✎ ↗ ☆ ×) */
    .ibtn{ background:none; border:none; cursor:pointer; color:var(--faint);
           line-height:1; padding:0 2px; transition:color .15s; }
    .ibtn:hover{ color:var(--indigo); }
    /* filter chip */
    .chip{ padding:3px 10px; border-radius:20px; border:1px solid var(--line);
           background:#fff; color:var(--muted); cursor:pointer; font-size:11px; font-family:inherit; }
    .chip:hover{ border-color:var(--indigo); }
    .chip.on{ border-color:var(--indigo); background:var(--indigo); color:#fff; font-weight:600; }
    /* modal chrome */
    .ov{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
         align-items:center; justify-content:center; z-index:200; padding:14px; }
    .mbox{ background:#fff; border-radius:14px; padding:22px; width:420px; max-width:92vw;
           max-height:92vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    /* uppercase section label */
    .slabel{ font-size:10px; font-weight:700; color:var(--faint);
             text-transform:uppercase; letter-spacing:.8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="core.js"></script>
  <script src="adapters.js"></script>
  <script src="app.js"></script>

  <!-- Register service worker so the app installs and runs fully offline,
       and surface an in-app "new version" prompt when a fresh build deploys. -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          // Proactively check for a newly deployed shell while the app stays open.
          setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);   // hourly
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) reg.update().catch(() => {});              // and on focus
          });
        }).catch(() => {});

        // The SW skip-waits + claims, so a new build takes control via
        // "controllerchange". The very first control (fresh install) isn't an
        // update — ignore it; any later one means a new version is live.
        let hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadController) { hadController = true; return; }
          window.dispatchEvent(new CustomEvent("gtd:update-ready"));
        });
      });
    }
  </script>
</body>
</html>
