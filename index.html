          {/* tabs */}
          <div style={{display:"flex",gap:6,padding:"8px 12px",background:"#fff",borderBottom:"1px solid #e2e8f0",flexShrink:0}}>
            <button onClick={()=>setTab("today")} className={"chip"+(tab==="today"?" on":"")}>🎯 Today · {rows.length}</button>
            <button onClick={()=>setTab("inbox")} className={"chip"+(tab==="inbox"?" on":"")}>📥 Inbox · {inbox.length}</button>
          </div>

          {/* body */}
          <div style={{flex:1,overflowY:"auto",padding:"10px 12px",display:"flex",flexDirection:"column",gap:6}}>
            {tab==="today" ? (
              rows.length===0 ? (
                <div style={{textAlign:"center",color:"#94a3b8",fontSize:12,padding:"28px 8px"}}>
                  <div style={{fontSize:30,marginBottom:8}}>🎯</div>Nothing on deck.<br/>Star next actions in the app.
                </div>
              ) : rows.map(i=>{
                const [ic,col,bg,bd]=kindMeta[i._kind];
                const pname=pnameOf(i), title=i.title;
                const foc=i._list==="next"&&i.focusDate===todayISO;
                return (
                  <div key={i.id} style={{display:"flex",alignItems:"flex-start",gap:9,padding:"8px 10px",border:`1px solid ${bd}`,borderRadius:9,background:bg}}>
                    <button onClick={()=>onComplete(i._list,{...i})} title="Mark done"
                      style={{width:17,height:17,borderRadius:"50%",border:"2px solid #cbd5e1",background:"#fff",cursor:"pointer",flexShrink:0,marginTop:1}}/>
                    <div style={{flex:1,minWidth:0}}>
                      {i._list==="next"&&pname&&<div style={{fontSize:9.5,color:"#7c3aed",fontWeight:600,marginBottom:1}}>📋 {pname}</div>}
                      <div style={{fontSize:12.5,fontWeight:500,wordBreak:"break-word"}}>{title}</div>
                      <div style={{fontSize:10,color:col,fontWeight:600,marginTop:2}}>
                        {ic} {i._kind==="overdue"?"Overdue":i._kind==="focus"?"Focused":i._kind==="due"?"Due today":"Ready"}
                        {i.dueDate&&` · ${dueLabel(i.dueDate,i.dueTime)}`}
                      </div>
                    </div>
                    {i._list==="next"&&(
                      <button onClick={()=>onToggleFocus(i.id)} title={foc?"Unfocus":"Focus for today"}
                        style={{background:"none",border:"none",cursor:"pointer",color:foc?"#f59e0b":"#cbd5e1",fontSize:14,lineHeight:1,padding:0,flexShrink:0}}>{foc?"★":"☆"}</button>
                    )}
                  </div>
                );
              })
            ) : (
              inbox.length===0 ? (
                <div style={{textAlign:"center",color:"#94a3b8",fontSize:12,padding:"28px 8px"}}>
                  <div style={{fontSize:30,marginBottom:8}}>📥</div>Inbox zero.
                </div>
              ) : (
                <React.Fragment>
                  <div style={{fontSize:10,color:"#94a3b8"}}>Captured — process in the main window.</div>
                  {inbox.map(i=>(
                    <div key={i.id} style={{display:"flex",gap:8,padding:"8px 10px",border:"1px solid #e2e8f0",borderRadius:9,background:"#fff",fontSize:12.5}}>
                      <span style={{color:"#cbd5e1",flexShrink:0}}>•</span>
                      <span style={{wordBreak:"break-word"}}>{i.title}</span>
                    </div>
                  ))}
                </React.Fragment>
              )
            )}
          </div>
        </div>
      );
    }

    // ── CalendarView ──────────────────────────────────────────────
    // A cross-list month grid of every dated item (next/waiting/projects/someday).
    // Read-mostly: click a day to inspect its items; complete or jump to the source
    // list from the day panel. Not a stored list — derives entirely from `items`.
    const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    function CalendarView({ items, pnameOf, onComplete, onGoto, onEdit }) {
      const today = new Date(); today.setHours(0,0,0,0);
      const todayISO = isoDate(today);
      const [cursor,   setCursor]   = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
      const [selected, setSelected] = useState(todayISO);

      // bucket every dated item by its YYYY-MM-DD dates — a due date (deadline) on its due
      // day and a start date (GTD tickler "defer until") on its start day. An item with both
      // appears on both days; _kind distinguishes the marker/label.
      const byDate = {};
      DATED.forEach(l => (items[l]||[]).forEach(i => {
        if (i.dueDate)   (byDate[i.dueDate]   = byDate[i.dueDate]   || []).push({ ...i, _list:l, _kind:"due" });
        if (i.startDate) (byDate[i.startDate] = byDate[i.startDate] || []).push({ ...i, _list:l, _kind:"start" });
      }));
      // within a day: timed appointments first (chronological), then untimed due, then starts
      const sortKey = x => x._kind==="start" ? "25:00" : (x.dueTime || "24:00");
      Object.values(byDate).forEach(arr => arr.sort((a,b)=>sortKey(a).localeCompare(sortKey(b))));

      const y = cursor.getFullYear(), mo = cursor.getMonth();
      const startDow    = (new Date(y, mo, 1).getDay() + 6) % 7;   // Monday-first
      const daysInMonth = new Date(y, mo + 1, 0).getDate();
      const cells = [];
      for (let i=0; i<startDow; i++)      cells.push(null);
      for (let d=1; d<=daysInMonth; d++)  cells.push(new Date(y, mo, d));
      while (cells.length % 7 !== 0)      cells.push(null);

      const monthLabel = cursor.toLocaleDateString("en-US", { month:"long", year:"numeric" });
      const stepMonth  = n => setCursor(new Date(y, mo + n, 1));
      const goToday    = () => { setCursor(new Date(today.getFullYear(), today.getMonth(), 1)); setSelected(todayISO); };
      const selItems   = byDate[selected] || [];

      const navBtn = {width:30,height:30,borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",color:"#475569",fontSize:14,lineHeight:1};
      const dot    = { next:"#6366f1", waiting:"#f59e0b", projects:"#7c3aed", someday:"#94a3b8" };

      return (
        <div>
          {/* month navigation */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <button onClick={()=>stepMonth(-1)} style={navBtn} title="Previous month">‹</button>
              <div style={{fontSize:15,fontWeight:700,minWidth:148,textAlign:"center"}}>{monthLabel}</div>
              <button onClick={()=>stepMonth(1)} style={navBtn} title="Next month">›</button>
            </div>
            <button onClick={goToday}
              style={{padding:"6px 12px",background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#475569"}}>
              Today
            </button>
          </div>

          {/* weekday header */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>
            {WEEKDAYS.map(w=>(
              <div key={w} style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".5px",textAlign:"center",padding:"2px 0"}}>{w}</div>
            ))}
          </div>

          {/* month grid */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
            {cells.map((d,idx)=>{
              if (!d) return <div key={idx} style={{minHeight:74,background:"#f8fafc",borderRadius:8}}/>;
              const iso     = isoDate(d);
              const dayList = byDate[iso] || [];
              const isToday = iso===todayISO;
              const isSel   = iso===selected;
              const overdue = iso < todayISO;
              return (
                <button key={idx} onClick={()=>setSelected(iso)}
                  style={{minHeight:74,textAlign:"left",padding:"5px 6px",borderRadius:8,cursor:"pointer",display:"flex",flexDirection:"column",gap:3,
                          background:isSel?"#eef2ff":"#fff",border:`1px solid ${isSel?"#6366f1":"#e2e8f0"}`,outline:"none"}}>
                  <div style={{display:"flex",justifyContent:"center"}}>
                    <span style={{fontSize:11,fontWeight:700,width:20,height:20,lineHeight:"20px",textAlign:"center",borderRadius:"50%",
                                  background:isToday?"#6366f1":"transparent",color:isToday?"#fff":"#475569"}}>{d.getDate()}</span>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:2,overflow:"hidden"}}>
                    {dayList.slice(0,3).map(i=>{
                      const isStart = i._kind==="start";
                      const od = overdue && !isStart;   // a start day in the past isn't "overdue"
                      return (
                      <div key={i.id+i._kind} title={(isStart?"Starts: ":"")+i.title}
                        style={{display:"flex",alignItems:"center",gap:3,fontSize:9,lineHeight:1.2,color:od?"#b91c1c":"#334155",
                                whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                        <span style={{width:5,height:5,borderRadius:"50%",flexShrink:0,boxSizing:"border-box",
                                      background:isStart?"transparent":(od?"#ef4444":dot[i._list]||"#94a3b8"),
                                      border:isStart?"1.5px solid #1d4ed8":"none"}}/>
                        <span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{!isStart&&i.dueTime?<span style={{fontWeight:700}}>{i.dueTime} </span>:null}{i._list==="next"?(i.title.replace(/^\[[^\]]+\]\s*/,"")):i.title}</span>
                      </div>
                      );
                    })}
                    {dayList.length>3 && <div style={{fontSize:9,color:"#94a3b8",fontWeight:600}}>+{dayList.length-3} more</div>}
                  </div>
                </button>
              );
            })}
          </div>

          {/* selected-day panel */}
          <div style={{marginTop:16,background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"14px 16px"}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:selItems.length?10:0}}>
              {new Date(selected+"T00:00").toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
              {selected===todayISO && <span style={{marginLeft:8,fontSize:10,color:"#6366f1",fontWeight:700}}>TODAY</span>}
            </div>
            {selItems.length===0 ? (
              <div style={{fontSize:12,color:"#94a3b8",fontStyle:"italic"}}>Nothing scheduled.</div>
            ) : (
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {selItems.map(i=>{
                  const isStart = i._kind==="start";
                  const ov    = selected < todayISO && !isStart;   // a past start day isn't overdue
                  const pname = pnameOf(i);
                  const title = i.title;
                  return (
                    <div key={i.id+i._kind}
                      style={{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 11px",border:`1px solid ${ov?"#fca5a5":"#e2e8f0"}`,borderRadius:9,background:ov?"#fff7f7":"#fff"}}>
                      {i._list!=="projects" ? (
                        <button onClick={()=>onComplete(i._list,{...i})} title="Mark done"
                          style={{width:18,height:18,borderRadius:"50%",border:"2px solid #cbd5e1",background:"#fff",cursor:"pointer",flexShrink:0,marginTop:1}}
                          onMouseEnter={e=>e.target.style.borderColor="#6366f1"}
                          onMouseLeave={e=>e.target.style.borderColor="#cbd5e1"}/>
                      ) : <span style={{fontSize:14,flexShrink:0,marginTop:1}}>📋</span>}
                      <div style={{flex:1,minWidth:0}}>
                        {pname && <div style={{fontSize:10,color:"#7c3aed",fontWeight:600,marginBottom:2}}>📋 {pname}</div>}
                        <div style={{fontSize:13,fontWeight:500,wordBreak:"break-word"}}>{title}</div>
                        <div style={{display:"flex",gap:5,marginTop:4,flexWrap:"wrap",alignItems:"center"}}>
                          <Tag bg="#eef2ff" c="#4338ca">{META[i._list].icon} {META[i._list].label}</Tag>
                          {i.context&&i.context!=="@anywhere"&&<Tag bg="#ede9fe" c="#5b21b6">{i.context}</Tag>}
                          {i.waitingFor&&<Tag bg="#fffbeb" c="#b45309">👤 {i.waitingFor}</Tag>}
                          {isStart&&<Tag bg="#eff6ff" c="#1d4ed8">🕒 starts</Tag>}
                          {!isStart&&i.dueTime&&<Tag bg="#f0fdf4" c="#166534">⏰ {fmtTime(i.dueTime)}</Tag>}
                          {ov&&<Tag bg="#fef2f2" c="#b91c1c">⚠️ overdue</Tag>}
                        </div>
                      </div>
                      {onEdit && i._list!=="reference" && (
                        <button onClick={()=>onEdit(i._list,i)} title="Edit"
                          style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:13,lineHeight:1,padding:"0 2px",flexShrink:0}}
                          onMouseEnter={e=>e.currentTarget.style.color="#6366f1"}
                          onMouseLeave={e=>e.currentTarget.style.color="#94a3b8"}>✎</button>
                      )}
                      <button onClick={()=>onGoto(i._list)} title={"Open "+META[i._list].label}
                        style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:14,lineHeight:1,padding:"0 2px",flexShrink:0}}
                        onMouseEnter={e=>e.currentTarget.style.color="#6366f1"}
                        onMouseLeave={e=>e.currentTarget.style.color="#94a3b8"}>↗</button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── WeeklyReview ──────────────────────────────────────────────
    // GTD's keystone Reflect habit, as a guided checklist: get clear → get current →
    // get creative. Surfaces live counts (inbox, stalled projects, stale waiting-for,
    // overdue) so the review is actionable; completing it stamps _reviewedAt.
    function WeeklyReview({ items, todayISO, reviewedAt, daysSinceReview, reviewDay, onSetReviewDay, onComplete, onGoto, ai }) {
      const [done, setDone] = useState({});
      const toggle = k => setDone(d => ({ ...d, [k]: !d[k] }));
      const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

      const inbox = (items.inbox||[]).length;
      const nextC = (items.next||[]).length;
      const someC = (items.someday||[]).length;
      const waiting = items.waiting||[];
      const staleWait = waiting.filter(w => w.created && (Date.now()-new Date(w.created)) > 7*86400000).length;
      const projects = items.projects||[];
      // A project is stalled when NOTHING moves it: no linked next action AND no
      // linked waiting-for (delegated work counts as a next move — id-based links).
      const linkedActive = new Set();
      ["next","waiting"].forEach(l=>(items[l]||[]).forEach(a=>{ if(a.projectId) linkedActive.add(a.projectId); }));
      const stalled = projects.filter(p => !linkedActive.has(p.id));
      let overdue=0, upcoming=0;
      DATED.forEach(l=>(items[l]||[]).forEach(i=>{ if(i.dueDate){ i.dueDate<todayISO ? overdue++ : upcoming++; }}));

      const phases = [
        { name:"1 · Get clear", key:"clear", color:"#0ea5e9", steps:[
          {k:"collect", label:"Collect loose papers & materials", hint:"Round up stray notes, receipts, cards — drop them in your Inbox."},
          {k:"inbox",   label:"Process your Inbox to zero", hint:"Decide what each item is and where it belongs — don't put anything back.", goto:"inbox", count:inbox, danger:inbox>0, note:inbox===0?"empty ✓":null},
          {k:"mind",    label:"Empty your head", hint:"Capture any uncaptured commitments, ideas, or open loops."},
        ]},
        { name:"2 · Get current", key:"current", color:"#6366f1", steps:[
          {k:"next",    label:"Review Next Actions", hint:"Tick off completed ones; is each still the real next step?", goto:"next", count:nextC},
          {k:"cal",     label:"Review Calendar — past & upcoming", hint:"Check last week for loose ends, the week ahead for commitments.", goto:"calendar", count:overdue+upcoming, danger:overdue>0, note:overdue>0?`${overdue} overdue`:null},
          {k:"waiting", label:"Review Waiting For", hint:"Anyone to follow up on or nudge?", goto:"waiting", count:waiting.length, note:staleWait>0?`${staleWait} over a week old`:null},
          {k:"projects",label:"Review Projects", hint:"Every active project needs a defined next action.", goto:"projects", count:projects.length, danger:stalled.length>0, note:stalled.length>0?`${stalled.length} stalled`:null},
          {k:"someday", label:"Review Someday/Maybe", hint:"Anything ready to activate? Anything to let go?", goto:"someday", count:someC},
        ]},
        { name:"3 · Get creative", key:"creative", color:"#10b981", steps:[
          {k:"creative", label:"Add new ideas & projects", hint:"What's possible now? Capture anything fresh that surfaced."},
        ]},
      ];
      // The app has already COUNTED everything; the coach is handed those numbers so
      // it spends its turn on judgement instead of re-deriving what we know exactly.
      const facts = [
        `inbox: ${inbox}`, `next actions: ${nextC}`, `waiting: ${waiting.length} (${staleWait} over a week old)`,
        `projects: ${projects.length} (${stalled.length} stalled: ${stalled.map(p=>p.title).join("; ") || "none"})`,
        `someday: ${someC}`, `dated: ${overdue} overdue, ${upcoming} upcoming`,
        `weekly review: ${daysSinceReview===null ? "never run" : daysSinceReview + " days since the last one"}`,
      ].join("\n");
      const obsFor = key => ((ai && ai.data && ai.data.observations) || []).filter(o => o.phase === key);

      const allSteps  = phases.flatMap(p=>p.steps);
      const completed = allSteps.filter(s=>done[s.k]).length;
      const pct       = Math.round(completed/allSteps.length*100);
      const finish    = () => { onComplete(); setDone({}); };

      const lastTxt = reviewedAt
        ? (daysSinceReview===0 ? "Last reviewed today 🎉" : `Last reviewed ${daysSinceReview} day${daysSinceReview===1?"":"s"} ago`)
        : "You haven't run a Weekly Review yet";

      return (
        <div style={{maxWidth:1180,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",flexWrap:"wrap",gap:6,marginBottom:4}}>
            <div style={{fontSize:15,fontWeight:700}}>🔄 Weekly Review</div>
            <div style={{fontSize:11,color:daysSinceReview>=7||daysSinceReview===null?"#b45309":"#64748b"}}>{lastTxt}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:14}}>
            <div style={{fontSize:12,color:"#64748b"}}>
              The habit that keeps your system trustworthy. Walk each step, then mark it complete.
            </div>

            <div style={{fontSize:11,fontWeight:700,color:"#475569",minWidth:78,textAlign:"right"}}>{completed}/{allSteps.length} steps</div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:14,alignItems:"start",marginBottom:18}}>

          <button onClick={finish}
            style={{width:"100%",padding:"12px",background:pct===100?"#10b981":"#6366f1",color:"#fff",border:"none",borderRadius:9,cursor:"pointer",fontSize:13,fontWeight:700,marginTop:4}}>

    // ── PromoteModal — turn a single next action into a project ───
    // ── Review-before-apply — the ONE surface every AI proposal lands in ─────
    // The preview IS applyAiOps run against the live state, so an op the model got
    // wrong is already greyed out with a reason before the user commits to anything.
    // Applying goes through a single upd, so Ctrl+Z undoes the whole batch at once.
    const AI_REASON = {
      "no-such-item":"that item is gone",     "no-such-list":"not a valid list",
      "no-such-project":"no such project",    "empty-title":"empty title",
      "wrong-list":"only next actions can be focused", "noop":"already true",
      "unknown-op":"unsupported action",      "bad-shape":"malformed",
      "too-many":"batch too long",
    };
    function AiOpsReview({ ops, results, notes, busy, error, onApply, onRetry, onCancel, applyLabel }) {
      const [off, setOff] = useState({});
      useEffect(() => { setOff({}); }, [results]);          // a fresh run starts fully ticked
      const rows    = results || [];
      const chosen  = rows.filter(r => r.ok && !off[r.i]).map(r => r.i);
      const box     = {border:"1px solid #ddd6fe",background:"#faf5ff",borderRadius:9,padding:"11px 13px",marginBottom:10};

      if (busy) return (
        <div style={box}>
          <div style={{fontSize:12,color:"#5b21b6",fontWeight:600}}>✨ Asking Claude…</div>
          {onCancel && <button onClick={onCancel} className="btn btn-ghost btn-sm" style={{marginTop:8}}>Cancel</button>}
        </div>
      );
      if (error) return (
        <div style={{...box,borderColor:"#fca5a5",background:"#fef2f2"}}>
          <div style={{fontSize:12,color:"#b91c1c",lineHeight:1.5}}>{error}</div>
          <div style={{display:"flex",gap:6,marginTop:8}}>
            {onRetry  && <button onClick={onRetry}  className="btn btn-pri btn-sm">Try again</button>}
            {onCancel && <button onClick={onCancel} className="btn btn-ghost btn-sm">Dismiss</button>}
          </div>
        </div>
      );
      if (!rows.length && !(notes||[]).length) return null;

      return (
        <div style={box}>
          {(notes||[]).map((n,k)=>(
            <div key={k} style={{fontSize:12,color:"#4c1d95",lineHeight:1.5,marginBottom:6}}>{n}</div>
          ))}
          {rows.map(r => {
            const op = (ops||[])[r.i] || {};
            return (
              <label key={r.i} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"5px 0",
                                       cursor:r.ok?"pointer":"default",opacity:r.ok?1:.5}}>
                <input type="checkbox" disabled={!r.ok} checked={r.ok && !off[r.i]}
                  onChange={()=>setOff(o=>({ ...o, [r.i]: !o[r.i] }))} style={{marginTop:2}}/>
                <span style={{flex:1,minWidth:0}}>
                  <span style={{fontSize:12,color:"#1e293b"}}>{r.effect || op.op}</span>
                  {!r.ok && <span style={{fontSize:10,color:"#b91c1c",marginLeft:6}}>
                    — skipped: {AI_REASON[r.reason] || r.reason}</span>}
                  {op.why && <div style={{fontSize:10,color:"#94a3b8",marginTop:1}}>{op.why}</div>}
                  {r.ok && r.clamped && r.clamped.length > 0 && (
                    <div style={{fontSize:10,color:"#b45309",marginTop:1}}>ignored: {r.clamped.join(", ")}</div>
                  )}
                </span>
              </label>
            );
          })}
          <div style={{display:"flex",gap:6,marginTop:9}}>
            <button onClick={()=>onApply(chosen)} disabled={!chosen.length}
              style={{flex:1,padding:"8px",border:"none",borderRadius:7,fontSize:12,fontWeight:600,
                      background:chosen.length?"#6366f1":"#e2e8f0",color:chosen.length?"#fff":"#94a3b8",
                      cursor:chosen.length?"pointer":"default"}}>
              {applyLabel || "Apply"} {chosen.length ? `${chosen.length} of ${rows.length}` : ""}
            </button>
            {onCancel && <button onClick={onCancel} className="btn btn-ghost btn-sm">Discard</button>}
          </div>
        </div>
      );
    }

    // A proposal that has nowhere to live inline (project breakdown) gets an overlay.
    function AiModal({ title, subtitle, ai }) {
      const overlay = {position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200};
      const box     = {background:"#fff",borderRadius:14,padding:22,width:460,maxWidth:"92vw",maxHeight:"92vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.2)"};

    // ── Ask Claude — a derived view like Today/Calendar, and read-only ────────
    // The conversation is component state ONLY: persisting it would push chat text
    // into gtd_state_v1, and from there into OneDrive, the hub and every backup.
    function ChatView({ items, todayISO }) {
      const [msgs,  setMsgs]  = useState([]);        // [{role, content}]
      const [draft, setDraft] = useState("");
      const [live,  setLive]  = useState("");        // the answer currently streaming in
      const [busy,  setBusy]  = useState(false);
      const [error, setError] = useState("");
      const [usage, setUsage] = useState({ in:0, out:0 });
      const abort = React.useRef(null);
      const foot  = React.useRef(null);
      useEffect(() => { if (foot.current) foot.current.scrollIntoView({ block:"end" }); }, [msgs, live]);
      useEffect(() => () => { if (abort.current) abort.current.abort(); }, []);   // leave the view, drop the request

      const send = async () => {
        const q = draft.trim();
        if (!q || busy) return;
        const history = [...msgs, { role:"user", content:q }];
        setMsgs(history); setDraft(""); setLive(""); setError(""); setBusy(true);
        const ctrl = new AbortController(); abort.current = ctrl;
        let acc = "";
        try {
          // rebuilt every turn on purpose: a background sync may have changed the data
          for await (const ev of Ai.stream(AiTasks.chatBody(items, history, todayISO), { signal:ctrl.signal })) {
            if (ev.t === "text")  { acc += ev.text; setLive(acc); }
            else if (ev.t === "error") { setError(ev.msg); break; }
            else if (ev.t === "done" && ev.usage) {
              setUsage(u => ({ in:u.in + (ev.usage.input_tokens||0), out:u.out + (ev.usage.output_tokens||0) }));
            }
          }
        } finally {
          if (acc) setMsgs(h => [...h, { role:"assistant", content:acc }]);
          setLive(""); setBusy(false); abort.current = null;
        }
      };

      const bubble = (role, text, k) => (
        <div key={k} style={{display:"flex",justifyContent:role==="user"?"flex-end":"flex-start",marginBottom:8}}>
          <div style={{maxWidth:"82%",padding:"9px 12px",borderRadius:12,fontSize:13,lineHeight:1.55,whiteSpace:"pre-wrap",
                       background:role==="user"?"#6366f1":"#fff",color:role==="user"?"#fff":"#1e293b",
                       border:role==="user"?"none":"1px solid #e2e8f0"}}>{text}</div>
        </div>
      );

      return (
        <div style={{maxWidth:760,margin:"0 auto",display:"flex",flexDirection:"column",height:"100%"}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:2}}>✨ Ask Claude</div>
          <div style={{fontSize:12,color:"#64748b",marginBottom:14}}>
            Questions about your own system. Claude can read it but can't change anything —
            use Clarify or Break down for that.
          </div>
          <div style={{flex:1,overflowY:"auto",marginBottom:10,minHeight:120}}>
            {!msgs.length && !live && (
              <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.7}}>
                Try: “what am I waiting on, and from whom?” · “what can I do in 15 minutes at my desk?”
                · “which projects haven't moved?”
              </div>
            )}
            {msgs.map((m,k)=>bubble(m.role, m.content, k))}
            {live && bubble("assistant", live, "live")}
            {busy && !live && <div style={{fontSize:11,color:"#94a3b8"}}>thinking…</div>}
            {error && <div style={{fontSize:12,color:"#b91c1c",padding:"8px 0"}}>{error}</div>}
            <div ref={foot}/>
          </div>
          <div style={{display:"flex",gap:6}}>
            <input className="in in-sm" style={{flex:1}} value={draft} placeholder="Ask about your lists…"
              onChange={e=>setDraft(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
            {busy
              ? <button onClick={()=>abort.current&&abort.current.abort()} className="btn btn-ghost btn-sm">Stop</button>
              : <button onClick={send} disabled={!draft.trim()} className="btn btn-pri btn-sm">Send</button>}
          </div>
          <div style={{fontSize:10,color:"#cbd5e1",marginTop:6,textAlign:"right"}}>
            {usage.in || usage.out ? `this session: ${usage.in} in / ${usage.out} out tokens` : ""}
          </div>
        </div>
      );
    }

    function PromoteModal({ item, onConfirm, onClose }) {
      const actionText = item.title;
      const [outcome, setOutcome] = useState("");
      const can = outcome.trim();
      const confirm = () => { if (can) onConfirm(outcome.trim()); };
      return (
        <div className="ov" onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div className="mbox">
            <div style={{fontSize:14,fontWeight:700,marginBottom:3}}>Make into a project</div>
            <div style={{fontSize:11,color:"#64748b",marginBottom:14}}>
              GTD: a project is a multi-step outcome. This action stays on as its first next action.
            </div>
            <div style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:"#5b21b6"}}>
              ⚡ <strong>{actionText}</strong>
            </div>
            <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".8px",marginBottom:6}}>
              Project outcome — what does "done" look like?
            </div>
            <input autoFocus className="in" style={{marginBottom:14}} value={outcome} onChange={e=>setOutcome(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&can&&confirm()}
              placeholder="e.g. Bathroom leak fully fixed"/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={confirm} disabled={!can} className="btn btn-pri" style={{flex:1}}>📋 Create project</button>
              <button onClick={onClose} className="btn btn-ghost" style={{flex:1}}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    // ── EditModal ─────────────────────────────────────────────────
    // Edit an existing item's own fields. Fields shown mirror the add form's
    // per-list rules. For project-linked actions the [Project] prefix is stripped
    // for editing and reattached on save (parent owns the title-link cascade).
    function EditModal({ item, list, ctxs, projects, onConfirm, onClose }) {
      const [title,      setTitle]      = useState(item.title);
      const [projectId,  setProjectId]  = useState(item.projectId||"");
      const [context,    setContext]    = useState(item.context||"@anywhere");
      const [dueDate,    setDueDate]    = useState(item.dueDate||"");
      const [dueTime,    setDueTime]    = useState(item.dueTime||"");
      const [startDate,  setStartDate]  = useState(item.startDate||"");
      const [waitingFor, setWaitingFor] = useState(item.waitingFor||"");
      const [energy,     setEnergy]     = useState(item.energy||"");
      const [time,       setTime]       = useState(item.time||"");
      const can = title.trim();
      const showCtx  = list==="next";
      const showWait = list==="waiting";
      const showProj = list==="next"||list==="waiting";
      const showDue  = ["next","projects","waiting","someday"].includes(list);
      // <option> values are strings; item ids are numbers — resolve back to the real id
      const resolvePid = () => {
        if (projectId==="") return "";
        const hit = (projects||[]).find(p=>String(p.id)===String(projectId));
        return hit ? hit.id : item.projectId;
      };
      const confirm = () => { if (can) onConfirm({ title:title.trim(), projectId:resolvePid(), context, dueDate, dueTime:dueDate?dueTime:"", startDate, waitingFor:waitingFor.trim(), energy, time }); };
      const lbl = {marginBottom:6};
      return (
        <div className="ov" onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div className="mbox">
            <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>Edit {META[list]?.label||"item"}</div>
            <div className="slabel" style={lbl}>{list==="projects"?"Project outcome":"Title"}</div>
            <input autoFocus className="in" style={{marginBottom:14}} value={title} onChange={e=>setTitle(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&can&&confirm()}/>
            {showProj&&(
              <React.Fragment>
                <div className="slabel" style={lbl}>Project</div>
                <select className="in" style={{marginBottom:14}} value={projectId} onChange={e=>setProjectId(e.target.value)}>
                  <option value="">— none —</option>
                  {(projects||[]).map(p=><option key={p.id} value={p.id}>📋 {p.title}</option>)}
                  {projectId && !(projects||[]).some(p=>String(p.id)===String(projectId)) &&
                    <option value={projectId}>📋 (current link)</option>}
                </select>
              </React.Fragment>
            )}
            {showCtx&&(
              <React.Fragment>
                <div className="slabel" style={lbl}>Context</div>
                <select className="in" style={{marginBottom:14}} value={context} onChange={e=>setContext(e.target.value)}>
                  {ctxs.map(c=><option key={c}>{c}</option>)}
                </select>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                  <div>
                    <div className="slabel" style={lbl}>Energy</div>
                    <select className="in" value={energy} onChange={e=>setEnergy(e.target.value)}>
                      <option value="">—</option>
                      {ENERGIES.map(en=><option key={en} value={en}>🔋 {en}</option>)}
                    </select>
                  </div>
                  <div>
                    <div className="slabel" style={lbl}>Time needed</div>
                    <select className="in" value={time} onChange={e=>setTime(e.target.value)}>
                      <option value="">—</option>
                      {TIMES.map(t=><option key={t} value={t}>⏱ {t}</option>)}
                    </select>
                  </div>
                </div>
              </React.Fragment>
            )}
            {showWait&&(
              <React.Fragment>
                <div className="slabel" style={lbl}>Waiting for whom?</div>
                <input className="in" style={{marginBottom:14}} value={waitingFor} onChange={e=>setWaitingFor(e.target.value)}/>
              </React.Fragment>
            )}
            {showDue&&(
              <React.Fragment>
                <div className="slabel" style={lbl}>Start date (defer until)</div>
                <input className="in" style={{marginBottom:14}} type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}/>
                <div className="slabel" style={lbl}>Due date</div>
                <input className="in" style={{marginBottom:dueDate?8:14}} type="date" value={dueDate} onChange={e=>{setDueDate(e.target.value); if(!e.target.value) setDueTime("");}}/>
                {dueDate&&(
                  <React.Fragment>
                    <div className="slabel" style={lbl}>Due time <span style={{textTransform:"none",fontWeight:400,color:"#cbd5e1"}}>· optional, for appointments</span></div>
                    <input className="in" style={{marginBottom:14}} type="time" value={dueTime} onChange={e=>setDueTime(e.target.value)}/>
                  </React.Fragment>
                )}
              </React.Fragment>
            )}
            <div style={{display:"flex",gap:8}}>
              <button onClick={confirm} disabled={!can} className="btn btn-pri" style={{flex:1}}>Save</button>
              <button onClick={onClose} className="btn btn-ghost" style={{flex:1}}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    // ── InboxFocus ────────────────────────────────────────────────
    function InboxFocus({ item, total, onProcess }) {
      return (
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"48px 24px 24px"}}>
          <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"1px",marginBottom:28}}>
            {total} item{total!==1?"s":""} to process
          </div>
          <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,padding:"28px",width:"100%",maxWidth:520,boxShadow:"0 4px 24px rgba(0,0,0,.07)"}}>
            <div style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".8px",marginBottom:10}}>Oldest item</div>
            <div style={{fontSize:17,fontWeight:600,color:"#1e293b",lineHeight:1.45,marginBottom:24}}>{item.title}</div>
            <div style={{background:"#f5f3ff",borderRadius:8,padding:"9px 12px",marginBottom:22,fontSize:11,color:"#6366f1",fontStyle:"italic"}}>
              GTD: process top to bottom, oldest first. Make a decision on each item — never put it back.
            </div>
            <button onClick={onProcess} className="btn btn-pri" style={{width:"100%",padding:"13px",fontSize:14,borderRadius:9,fontWeight:700}}>
              Process this item →
            </button>
          </div>
        </div>
      );
    }

    // ── ProcessModal ──────────────────────────────────────────────
    function ProcessModal({ item, ctxs, ai, onMove, onMoveAsProject, onTrash, onClose }) {
      const [due,       setDue]       = useState("");
      const [from,      setFrom]      = useState("");
      const [phase,     setPhase]     = useState("main"); // "main" | "project" | "doit"
      const [firstType, setFirstType] = useState("next");
      const [naTitle,   setNaTitle]   = useState("");
      const [naCtx,     setNaCtx]     = useState("@anywhere");
      const [naDue,     setNaDue]     = useState("");
      const [naDueTime, setNaDueTime] = useState("");
      const [naStart,   setNaStart]   = useState("");
      const [waitTxt,   setWaitTxt]   = useState("");
      const [secsLeft,  setSecsLeft]  = useState(120);

      useEffect(() => {
        if (phase !== "doit") return;
        setSecsLeft(120);
        const id = setInterval(() => setSecsLeft(s => Math.max(0, s - 1)), 1000);
        return () => clearInterval(id);
      }, [phase]);

      const overlay = {position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200};
      const box     = {background:"#fff",borderRadius:14,padding:22,width:420,maxWidth:"92vw",maxHeight:"92vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.2)"};

      const Opt = ({ bg, border, color, onClick, children }) => (
        <button onClick={onClick}
          style={{padding:"9px 12px",background:bg,border:`1px solid ${border}`,borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:500,textAlign:"left",color,width:"100%"}}>
          {children}
        </button>
      );

      const Divider = ({label}) => (
        <div style={{display:"flex",alignItems:"center",gap:8,margin:"12px 0 8px"}}>
          <div style={{flex:1,height:1,background:"#e2e8f0"}}/>
          <span style={{fontSize:9,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".8px"}}>{label}</span>
          <div style={{flex:1,height:1,background:"#e2e8f0"}}/>
        </div>
      );

      const tabBtn = (label, active, onClick) => (
        <button onClick={onClick}
          style={{flex:1,padding:"8px",fontSize:12,fontWeight:600,border:`1.5px solid ${active?"#6366f1":"#e2e8f0"}`,borderRadius:7,cursor:"pointer",
            background:active?"#6366f1":"#fff",color:active?"#fff":"#64748b"}}>
          {label}
        </button>
      );

      if (phase==="doit") {
        const mins    = Math.floor(secsLeft / 60);
        const secs    = secsLeft % 60;
        const timeStr = `${mins}:${secs.toString().padStart(2,"0")}`;
        const over    = secsLeft === 0;
        return (
          <div style={overlay}>
            <div style={{...box, textAlign:"center"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#10b981",textTransform:"uppercase",letterSpacing:"1px",marginBottom:12}}>
                Do it now
              </div>
              <div style={{fontSize:16,fontWeight:600,color:"#1e293b",lineHeight:1.4,marginBottom:20}}>
                {item.title}
              </div>
              <div style={{fontSize:52,fontWeight:800,letterSpacing:"-2px",color:over?"#ef4444":secsLeft<=30?"#f59e0b":"#10b981",marginBottom:6,fontVariantNumeric:"tabular-nums"}}>
                {timeStr}
              </div>
              <div style={{fontSize:11,color:"#94a3b8",marginBottom:24}}>
                {over ? "Time's up — did you finish?" : "2-minute timer running…"}
              </div>
              <button onClick={()=>onMove("done",{doneAt:ts()})}
                style={{width:"100%",padding:"13px",background:"#10b981",color:"#fff",border:"none",borderRadius:9,cursor:"pointer",fontSize:14,fontWeight:700,marginBottom:8}}>
                ✓ Done — back to inbox
              </button>
              <button onClick={()=>setPhase("main")}
                style={{width:"100%",padding:"9px",background:"transparent",border:"1px solid #e2e8f0",borderRadius:9,cursor:"pointer",fontSize:12,color:"#64748b"}}>
                Takes longer — defer it instead
              </button>
            </div>
          </div>
        );
      }

      if (phase==="next") {
        const can = naTitle.trim();
        const confirm = () => { if (can) onMove("next", {title:naTitle.trim(), context:naCtx, dueDate:naDue, dueTime:naDue?naDueTime:"", startDate:naStart}); };
        return (
          <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
            <div style={box}>
              <button onClick={()=>setPhase("main")}
                style={{background:"none",border:"none",cursor:"pointer",color:"#6366f1",fontSize:12,marginBottom:12,padding:0}}>← Back</button>
              <div style={{fontSize:14,fontWeight:700,marginBottom:3}}>Define the next action</div>
              <div style={{fontSize:11,color:"#64748b",marginBottom:10}}>
                GTD: the inbox note is just a reminder — name the concrete, physical action you'll actually do.
              </div>
              <div style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:"#5b21b6"}}>
                💭 <strong>{item.title}</strong>
              </div>
              <input autoFocus value={naTitle} onChange={e=>setNaTitle(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&can&&confirm()}
                placeholder="What is the very next physical action?"
                style={{width:"100%",padding:"8px 10px",border:"1px solid #d1d5db",borderRadius:8,fontSize:13,outline:"none",marginBottom:8}}/>
              <select value={naCtx} onChange={e=>setNaCtx(e.target.value)}
                style={{width:"100%",padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12,background:"#fff",marginBottom:8}}>
                {ctxs.map(c=><option key={c}>{c}</option>)}
              </select>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:14}}>
                <label style={{display:"flex",flexDirection:"column",gap:2,fontSize:9,color:"#94a3b8",fontWeight:600}}>Start (defer until)
                  <input type="date" value={naStart} onChange={e=>setNaStart(e.target.value)}
                    style={{padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12}}/>
                </label>
                <label style={{display:"flex",flexDirection:"column",gap:2,fontSize:9,color:"#94a3b8",fontWeight:600}}>Due
                  <input type="date" value={naDue} onChange={e=>{setNaDue(e.target.value); if(!e.target.value) setNaDueTime("");}}
                    style={{padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12}}/>
                </label>
                {naDue && (
                  <label style={{display:"flex",flexDirection:"column",gap:2,fontSize:9,color:"#94a3b8",fontWeight:600,gridColumn:"1 / -1"}} title="Optional — set a time only for a real appointment">Due time (optional)
                    <input type="time" value={naDueTime} onChange={e=>setNaDueTime(e.target.value)}
                      style={{padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12}}/>
                  </label>
                )}
              </div>
              <button onClick={confirm} disabled={!can}
                style={{width:"100%",padding:"10px",background:can?"#6366f1":"#e2e8f0",color:can?"#fff":"#94a3b8",
                  border:"none",borderRadius:8,cursor:can?"pointer":"default",fontSize:13,fontWeight:600}}>
                ✓ Add to Next Actions
              </button>
            </div>
          </div>
        );
      }

      if (phase==="project") {
        const canConfirm = firstType==="next" ? naTitle.trim() : waitTxt.trim();
        const confirm = () => {
          const first = firstType==="next"
            ? {type:"next", title:naTitle.trim(), context:naCtx, dueDate:naDue, dueTime:naDue?naDueTime:"", startDate:naStart}
            : {type:"waiting", waitingFor:waitTxt.trim()};
          onMoveAsProject({dueDate:due}, first);
        };
        return (
          <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
            <div style={box}>
              <button onClick={()=>setPhase("main")}
                style={{background:"none",border:"none",cursor:"pointer",color:"#6366f1",fontSize:12,marginBottom:12,padding:0}}>← Back</button>
              <div style={{fontSize:14,fontWeight:700,marginBottom:3}}>New project: <span style={{color:"#6366f1"}}>{item.title}</span></div>
              <div style={{fontSize:11,color:"#64748b",marginBottom:14}}>
                GTD: every project needs a first next action or a waiting-for before it's active.
              </div>
              <div style={{display:"flex",gap:6,marginBottom:14}}>
                {tabBtn("⚡ Next Action", firstType==="next", ()=>setFirstType("next"))}
                {tabBtn("⏳ Waiting For", firstType==="waiting", ()=>setFirstType("waiting"))}
              </div>
              {firstType==="next" ? (
                <div>
                  <input autoFocus value={naTitle} onChange={e=>setNaTitle(e.target.value)}
                    onKeyDown={e=>e.key==="Enter"&&canConfirm&&confirm()}
                    placeholder="What is the very next physical action?"
                    style={{width:"100%",padding:"8px 10px",border:"1px solid #d1d5db",borderRadius:8,fontSize:13,outline:"none",marginBottom:8}}/>
                  <select value={naCtx} onChange={e=>setNaCtx(e.target.value)}
                    style={{width:"100%",padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12,background:"#fff",marginBottom:8}}>
                    {ctxs.map(c=><option key={c}>{c}</option>)}
                  </select>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:14}}>
                    <label style={{display:"flex",flexDirection:"column",gap:2,fontSize:9,color:"#94a3b8",fontWeight:600}}>Start (defer until)
                      <input type="date" value={naStart} onChange={e=>setNaStart(e.target.value)}
                        style={{padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12}}/>
                    </label>
                    <label style={{display:"flex",flexDirection:"column",gap:2,fontSize:9,color:"#94a3b8",fontWeight:600}}>Due
                      <input type="date" value={naDue} onChange={e=>{setNaDue(e.target.value); if(!e.target.value) setNaDueTime("");}}
                        style={{padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12}}/>
                    </label>
                    {naDue && (
                      <label style={{display:"flex",flexDirection:"column",gap:2,fontSize:9,color:"#94a3b8",fontWeight:600,gridColumn:"1 / -1"}} title="Optional — set a time only for a real appointment">Due time (optional)
                        <input type="time" value={naDueTime} onChange={e=>setNaDueTime(e.target.value)}
                          style={{padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12}}/>
                      </label>
                    )}
                  </div>
                </div>
              ) : (
                <input autoFocus value={waitTxt} onChange={e=>setWaitTxt(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&canConfirm&&confirm()}
                  placeholder="Waiting for whom / what?"
                  style={{width:"100%",padding:"8px 10px",border:"1px solid #d1d5db",borderRadius:8,fontSize:13,outline:"none",marginBottom:14}}/>
              )}
              <button onClick={confirm} disabled={!canConfirm}
                style={{width:"100%",padding:"10px",background:canConfirm?"#6366f1":"#e2e8f0",color:canConfirm?"#fff":"#94a3b8",
                  border:"none",borderRadius:8,cursor:canConfirm?"pointer":"default",fontSize:13,fontWeight:600}}>
                ✓ Create project + add {firstType==="next"?"next action":"waiting for"}
              </button>
            </div>
          </div>
        );
      }

      return (
        <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div style={box}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>Clarify this item</div>
            <div style={{fontSize:12,color:"#64748b",marginBottom:10,fontStyle:"italic"}}>"{item.title}"</div>

            {ai && (ai.active ? (
              <AiOpsReview ops={ai.ops} results={ai.results} notes={ai.notes} busy={ai.busy} error={ai.error}
                applyLabel="Apply" onApply={ai.onApply} onRetry={ai.onRun} onCancel={ai.onClose}/>
            ) : (
              <button onClick={ai.onRun} disabled={!ai.online}
                title={ai.online ? "" : "Offline — Claude needs a connection"}
                style={{width:"100%",padding:"9px 12px",background:ai.online?"#faf5ff":"#f8fafc",
                        border:`1.5px solid ${ai.online?"#c4b5fd":"#e2e8f0"}`,borderRadius:8,
                        cursor:ai.online?"pointer":"default",fontSize:12,fontWeight:600,
                        color:ai.online?"#5b21b6":"#94a3b8",textAlign:"left",marginBottom:4}}>
                ✨ Ask Claude to clarify this
                <div style={{fontSize:10,fontWeight:400,color:ai.online?"#8b5cf6":"#cbd5e1",marginTop:2}}>
                  Suggests where it belongs — you approve before anything changes
                </div>
              </button>
            ))}

            <Divider label="Actionable"/>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <button onClick={()=>setPhase("doit")}
                style={{padding:"9px 12px",background:"#ecfdf5",border:"1.5px solid #34d399",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,textAlign:"left",color:"#065f46",width:"100%"}}>
                ✅ Do it now — under 2 minutes
                <div style={{fontSize:10,fontWeight:400,color:"#10b981",marginTop:2}}>Starts a 2-min timer — mark done when finished</div>
              </button>
              <Opt bg="#f5f3ff" border="#c4b5fd" color="#5b21b6" onClick={()=>{setNaTitle(item.title);setNaCtx("@anywhere");setNaDue("");setNaDueTime("");setNaStart("");setPhase("next");}}>⚡ Next Action — you do it</Opt>
              <Opt bg="#f5f3ff" border="#ddd6fe" color="#4338ca" onClick={()=>{setNaTitle("");setNaCtx("@anywhere");setNaDue("");setNaDueTime("");setNaStart("");setPhase("project");}}>📋 Project — multiple steps needed</Opt>
              <input value={from} onChange={e=>setFrom(e.target.value)} placeholder="Waiting from whom?"
                style={{padding:"7px 10px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12,outline:"none"}}/>
              <input type="date" value={due} onChange={e=>setDue(e.target.value)}
                style={{padding:"7px 9px",border:"1px solid #d1d5db",borderRadius:7,fontSize:12}}/>
              <Opt bg="#fffbeb" border="#fde68a" color="#92400e" onClick={()=>onMove("waiting",{waitingFor:from,dueDate:due})}>⏳ Waiting For — someone else does it</Opt>
            </div>

            <Divider label="Not actionable"/>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <Opt bg="#f0fdf4" border="#86efac" color="#166534" onClick={()=>onMove("someday",{})}>🌟 Someday/Maybe — revisit when the time is right</Opt>
              <Opt bg="#eff6ff" border="#93c5fd" color="#1e40af" onClick={()=>onMove("reference",{})}>📁 Reference — keep for future lookup</Opt>
              <Opt bg="#f8fafc" border="#e2e8f0" color="#475569" onClick={onTrash}>🗑️ Trash — not needed</Opt>
            </div>

            <div style={{marginTop:10,fontSize:10,color:"#94a3b8",textAlign:"center",fontStyle:"italic"}}>
              Click outside to come back to this item later.
            </div>
          </div>
        </div>
      );
    }

    // ── DataModal: cloud sync + offline export / import ──────────
    function DataModal({ counts, archiveCount, contexts, onAddContext, onDelContext, onExport, onImport, cloud, ai, onClose }) {
      const total   = LISTS.reduce((n,l)=>n+(counts[l]||0),0);
      const [newCtx, setNewCtx] = useState("");
      const fireAddCtx = () => { if(newCtx.trim()){ onAddContext(newCtx); setNewCtx(""); } };
      const [key, setKey] = useState(""), [keyWarn, setKeyWarn] = useState("");
      const a = ai || {};
      // The plaintext key is dropped from component state the moment it is stored —
      // it has no business living in a React tree any longer than the keystroke.
      const saveKey = () => {
        const v = key.trim(); if (!v) return;
        setKeyWarn(v.startsWith("sk-ant-") ? "" : "That doesn't look like an Anthropic key, saving it anyway.");
        a.onSave && a.onSave(v); setKey("");
      };
      const overlay = {position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200};
      const box     = {background:"#fff",borderRadius:14,padding:22,width:420,maxWidth:"92vw",maxHeight:"92vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.2)"};
      const card    = (bg,border,color) => ({padding:"11px 13px",background:bg,border:`1.5px solid ${border}`,borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color,textAlign:"left",width:"100%"});
      const head    = {fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".8px",marginBottom:8};
      const c       = cloud || {};
      return (
        <div style={overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div style={box}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>⇅ Sync &amp; Backup</div>
            <div style={{fontSize:12,color:"#64748b",marginBottom:14,lineHeight:1.5}}>
              Keep devices in sync via your own OneDrive, or move data manually with a file.
              <strong> {total}</strong> item{total!==1?"s":""} on this device{archiveCount?` (+ ${archiveCount} archived)`:""}.
            </div>

            <div style={head}>Cloud sync — OneDrive</div>
            {!c.configured ? (
              <div style={{padding:"11px 13px",background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,fontSize:11,color:"#92400e",lineHeight:1.5,marginBottom:16}}>
                Not set up yet. Register a free Azure app, paste its <strong>client ID</strong> into
                <code style={{background:"#fef3c7",padding:"0 4px",borderRadius:3,margin:"0 2px"}}>MS_CLIENT_ID</code>
                in <code style={{background:"#fef3c7",padding:"0 4px",borderRadius:3}}>index.html</code>, then reload.
                See the README → “Cloud sync via OneDrive”.
              </div>
            ) : !c.account ? (
              <button onClick={c.onConnect} style={{...card("#eff6ff","#3b82f6","#1e40af"),marginBottom:16}}>
                ☁ Connect OneDrive
                <div style={{fontSize:10,fontWeight:400,color:"#3b82f6",marginTop:2}}>Sign in with your Microsoft account — syncs every device, no server</div>
              </button>
            ) : (
              <div style={{border:"1px solid #e2e8f0",borderRadius:8,padding:"11px 13px",marginBottom:16}}>
                <div style={{fontSize:12,fontWeight:600,color:"#1e293b",marginBottom:2}}>☁ Connected</div>
                <div style={{fontSize:11,color:"#64748b",marginBottom:2,wordBreak:"break-all"}}>{c.account.username||"OneDrive"}</div>
                <div style={{fontSize:10,color:"#94a3b8",marginBottom:10}}>
                  {c.syncing ? "Syncing…" : c.lastSynced ? `Last synced ${relTime(c.lastSynced)}` : "Not synced yet"}
                </div>
                <div style={{display:"flex",gap:7}}>
                  <button onClick={c.onSyncNow} disabled={c.syncing}
                    style={{flex:1,padding:"7px",background:c.syncing?"#e2e8f0":"#6366f1",color:c.syncing?"#94a3b8":"#fff",border:"none",borderRadius:7,cursor:c.syncing?"default":"pointer",fontSize:12,fontWeight:600}}>
                    {c.syncing?"Syncing…":"↻ Sync now"}
                  </button>
                  <button onClick={c.onDisconnect}
                    style={{padding:"7px 12px",background:"transparent",border:"1px solid #e2e8f0",borderRadius:7,cursor:"pointer",fontSize:12,color:"#64748b"}}>
                    Disconnect
                  </button>
                </div>
              </div>
            )}

            <div style={head}>Claude — AI assistant</div>
            {!a.hasKey ? (
              <div style={{border:"1px solid #e2e8f0",borderRadius:8,padding:"11px 13px",marginBottom:16}}>
                <div style={{fontSize:11,color:"#64748b",lineHeight:1.5,marginBottom:8}}>
                  Paste an Anthropic API key to turn on Clarify, project breakdowns, the Weekly
                  Review coach and Ask Claude. Leave it blank and the app behaves exactly as before.
                </div>
                <div style={{display:"flex",gap:6}}>
                  <input className="in in-sm" style={{flex:1}} type="password" value={key}
                    autoComplete="off" spellCheck={false} placeholder="sk-ant-…"
                    onChange={e=>setKey(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveKey()}/>
                  <button onClick={saveKey} className="btn btn-pri btn-sm">Save</button>
                </div>
                {keyWarn && <div style={{fontSize:10,color:"#b45309",marginTop:6}}>{keyWarn}</div>}
                <div style={{fontSize:10,color:"#94a3b8",marginTop:6}}>
                  Get one at console.anthropic.com. Each device needs its own — the key is never synced.
                </div>
              </div>
            ) : (
              <div style={{border:"1px solid #e2e8f0",borderRadius:8,padding:"11px 13px",marginBottom:16}}>
                <div style={{fontSize:12,fontWeight:600,color:"#1e293b",marginBottom:2}}>✨ Key saved</div>
                <div style={{fontSize:11,color:"#64748b",marginBottom:2,wordBreak:"break-all"}}>{a.masked}</div>
                <div style={{fontSize:10,color:"#94a3b8",marginBottom:10}}>
                  {a.model}{!a.online && " · offline"}
                </div>
                <div style={{display:"flex",gap:7}}>
                  <button onClick={a.onTest} disabled={a.test==="…"}
                    style={{flex:1,padding:"7px",background:a.test==="…"?"#e2e8f0":"#6366f1",color:a.test==="…"?"#94a3b8":"#fff",border:"none",borderRadius:7,cursor:a.test==="…"?"default":"pointer",fontSize:12,fontWeight:600}}>
                    {a.test==="…"?"Testing…":"↻ Test key"}
                  </button>
                  <button onClick={a.onClear}
                    style={{padding:"7px 12px",background:"transparent",border:"1px solid #e2e8f0",borderRadius:7,cursor:"pointer",fontSize:12,color:"#64748b"}}>
                    Remove
                  </button>
                </div>
                {a.test && a.test !== "…" && (
                  <div style={{fontSize:11,marginTop:8,color:a.test.ok?"#065f46":"#b91c1c"}}>
                    {a.test.ok ? "✓ The key works." : a.test.msg}
                  </div>
                )}
              </div>
            )}
            <div style={{padding:"11px 13px",background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,fontSize:11,color:"#92400e",lineHeight:1.5,marginBottom:16}}>
              The key is stored unencrypted in this device's browser storage. It is never synced to
              OneDrive, never sent to the hub, and never written into a backup file — but any script
              running on this page could read it. Use a key with a <strong>spend limit</strong> set in
              the Anthropic Console, and revoke it if you lose the device.
            </div>

            <div style={head}>Contexts</div>
            <div style={{border:"1px solid #e2e8f0",borderRadius:8,padding:"11px 13px",marginBottom:16}}>
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
                {(contexts||[]).map(c2=>(
                  <span key={c2} className="chip" style={{display:"inline-flex",alignItems:"center",gap:5,cursor:"default"}}>
                    {c2}
                    {c2!=="@anywhere" && (
                      <button onClick={()=>onDelContext(c2)} title={`Remove ${c2}`}
                        style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:12,lineHeight:1,padding:0}}>×</button>
                    )}
                  </span>
                ))}
              </div>
              <div style={{display:"flex",gap:6}}>
                <input className="in in-sm" style={{flex:1}} value={newCtx} placeholder="@new-context"
                  onChange={e=>setNewCtx(e.target.value)} onKeyDown={e=>e.key==="Enter"&&fireAddCtx()}/>
                <button onClick={fireAddCtx} className="btn btn-pri btn-sm">Add</button>
              </div>
              <div style={{fontSize:10,color:"#94a3b8",marginTop:6}}>Contexts live in your data and sync everywhere. Removing one doesn't touch existing items.</div>
            </div>

            <div style={head}>Export</div>
            <button onClick={onExport} style={{...card("#f5f3ff","#6366f1","#4338ca"),marginBottom:16}}>
              💾 Save backup file
              <div style={{fontSize:10,fontWeight:400,color:"#6366f1",marginTop:2}}>Downloads gtd-backup-….json (uses the share sheet on phones)</div>
            </button>

            <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".8px",marginBottom:8}}>Import from a backup file</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              <button onClick={()=>onImport("merge")} style={card("#f0fdf4","#10b981","#065f46")}>
                ➕ Merge — keep both
                <div style={{fontSize:10,fontWeight:400,color:"#10b981",marginTop:2}}>Adds the file's items to this device (same items aren't duplicated)</div>
              </button>
              <button onClick={()=>onImport("replace")} style={card("#fef2f2","#fca5a5","#b91c1c")}>
                ♻️ Replace — overwrite this device
                <div style={{fontSize:10,fontWeight:400,color:"#ef4444",marginTop:2}}>Discards what's here and loads the file exactly</div>
              </button>
            </div>

            <button onClick={onClose} className="btn btn-ghost btn-sm" style={{marginTop:14,width:"100%"}}>Close</button>
          </div>
        </div>
      );
    }

    // ── Misc ──────────────────────────────────────────────────────
    const Tag = ({ bg, c, children }) => (
      <span style={{background:bg,color:c,fontSize:10,padding:"2px 7px",borderRadius:20,fontWeight:500}}>{children}</span>
    );

    function EmptyState({ list, ctx }) {
      const m = {
        inbox:     ["🎉","Inbox Zero!","Everything's captured and clarified. Mind like water."],
        next:      ["⚡","Clear horizons.","No next actions — process your inbox."],
        projects:  ["📋","No projects yet.","Add outcomes needing more than one step."],
        waiting:   ["⏳","Nothing waiting.","Track items you've delegated to others."],
        someday:   ["🌟","Dream big.","Capture ideas to revisit someday."],
        reference: ["📁","No reference material.","Store non-actionable items you want to keep."],
        done:      ["🎉","Nothing completed yet.","Mark items done and they'll appear here."],
      };
      const [icon,title,sub] = m[list]||["✨","Empty",""];
      return (
        <div style={{textAlign:"center",padding:"52px 20px",color:"#94a3b8"}}>
          <div style={{fontSize:38,marginBottom:10}}>{icon}</div>
          <div style={{fontSize:14,fontWeight:600,color:"#475569"}}>{title}</div>
          <div style={{fontSize:12,marginTop:4}}>
            {list==="next"&&ctx!=="all" ? `No actions in ${ctx}.` : sub}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <!-- Register service worker so the app installs and runs fully offline,
       and surface an in-app "new version" prompt when a fresh build deploys. -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          // Proactively check for a newly deployed shell while the app stays open.
          setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);   // hourly
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) reg.update().catch(() => {});              // and on focus
          });
        }).catch(() => {});

        // The SW skip-waits + claims, so a new build takes control via
        // "controllerchange". The very first control (fresh install) isn't an
        // update — ignore it; any later one means a new version is live.
        let hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadController) { hadController = true; return; }
          window.dispatchEvent(new CustomEvent("gtd:update-ready"));
        });
      });
    }
  </script>
</body>
</html>
